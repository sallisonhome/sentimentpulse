name: Deploy to Droplet

# CLAUDE.md §16 — Auto-Deploy via GitHub Actions
#
# Runs on every push to main (including PR merges) and via manual trigger.
# Connects to the droplet via SSH, pulls main, installs deps for ALL apps,
# runs Alembic migrations (SentimentPulse), rebuilds ALL frontends, and
# restarts the systemd services that exist on this droplet.
#
# Apps deployed:
#   1. SentimentPulse  — port 8000  (frontend/, backend/)
#   2. GTM Studio      — port 8001  (gtm/frontend/, gtm/backend/)
#
# Required secrets:
#   DROPLET_SSH_KEY   — ed25519 private key whose pubkey is in
#                       /root/.ssh/authorized_keys on the droplet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse

            echo "## git pull ##"
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline

            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            which node || echo "node not in PATH"
            which npm  || echo "npm not in PATH"

            echo ""
            echo "## SentimentPulse backend deps + migrations ##"
            cd backend
            source .venv/bin/activate
            pip install --quiet --upgrade-strategy only-if-needed -r requirements.txt
            alembic upgrade head
            deactivate
            cd ..

            echo ""
            echo "## SentimentPulse frontend build ##"
            if [ -d frontend ] && [ -f frontend/package.json ]; then
              cd frontend
              npm install --no-audit --no-fund
              npm run build
              cd ..
            else
              echo "frontend/ missing, skipping"
            fi

            echo ""
            echo "## GTM Studio backend deps ##"
            if [ -f gtm/backend/requirements.txt ] && [ -d gtm/backend/.venv ]; then
              cd gtm/backend
              source .venv/bin/activate
              pip install --quiet --upgrade-strategy only-if-needed -r requirements.txt
              deactivate
              cd ../..
            elif [ -f gtm/backend/requirements.txt ]; then
              echo "WARN: gtm/backend/.venv missing — backend deps NOT installed"
            else
              echo "gtm/backend/requirements.txt missing, skipping"
            fi

            echo ""
            echo "## GTM Studio frontend build ##"
            if [ -d gtm/frontend ] && [ -f gtm/frontend/package.json ]; then
              cd gtm/frontend
              npm install --no-audit --no-fund
              npm run build
              cd ../..
            else
              echo "gtm/frontend/ missing, skipping"
            fi

            echo ""
            echo "## restart services ##"
            # Match service unit lines like 'sentimentpulse.service enabled enabled'.
            # Escape the literal '.' in the regex so '^name.service' doesn't false-positive,
            # AND use awk to test field 1 exactly (more reliable than grep on the full row).
            installed_units=$(systemctl list-unit-files --type=service --no-legend | awk '{print $1}')
            for svc in sentimentpulse gtmstudio; do
              if echo "$installed_units" | grep -qx "${svc}.service"; then
                systemctl restart "$svc"
                sleep 2
                systemctl is-active "$svc" && echo "$svc: active" || echo "$svc: FAILED"
              else
                echo "$svc.service not installed; skipping"
              fi
            done

            echo ""
            echo "## deploy OK ##"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
