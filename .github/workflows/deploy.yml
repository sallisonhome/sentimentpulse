name: Deploy to Droplet

# CLAUDE.md §16 — Auto-Deploy via GitHub Actions
#
# Runs on every push to main (including PR merges) and via manual trigger.
# Connects to the droplet via SSH, pulls main, installs deps for ALL apps,
# runs Alembic migrations (SentimentPulse), rebuilds ALL frontends, and
# restarts the systemd services that exist on this droplet.
#
# Apps deployed:
#   1. SentimentPulse  — port 8000  (frontend/, backend/)
#   2. GTM Studio      — port 8001  (gtm/frontend/, gtm/backend/)
#
# Required secrets:
#   DROPLET_SSH_KEY        — ed25519 private key whose pubkey is in
#                            /root/.ssh/authorized_keys on the droplet.
#   BLUESKY_HANDLE         — Bluesky account handle (e.g. myaccount.bsky.social)
#   BLUESKY_APP_PASSWORD   — App password from Bluesky Settings → App passwords
# Optional secrets (digest email):
#   RESEND_API_KEY         — Resend HTTPS API key (https://resend.com/api-keys).
#                            Required for weekly + monthly executive digest sends.
#                            Without it, the digest cron logs
#                            'resend_not_configured' and does NOT email.
#   RESEND_FROM            — Optional 'Name <addr@verified-domain>'.  Defaults
#                            to 'SentimentPulse Intelligence <onboarding@resend.dev>'.
#                            Default sender only delivers to the Resend account
#                            owner's verified address; set this once a domain
#                            is verified at resend.com/domains for arbitrary recipients.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Bluesky + Resend credentials to droplet
        env:
          BSKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BSKY_PW: ${{ secrets.BLUESKY_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          # Write secrets to a temp file on the runner, then scp to droplet.
          # Keeps the deploy heredoc fully quoted so in-script vars like $PATH,
          # $svc, $installed_units etc. are NOT expanded by the GH runner shell.
          # Empty values are written as empty strings; the droplet-side script
          # detects empty and skips the .env update for that key, leaving any
          # existing value in place (idempotent across deploys).
          #
          # CRITICAL: the file is sourced on the droplet with POSIX `.`, so any
          # value containing spaces, <>, &, |, $, etc. must be single-quoted.
          # Bluesky values don't have specials, but RESEND_FROM can be
          # 'Display Name <addr@domain>' — the spaces + angle brackets break
          # shell-source parsing without quoting (regression 2026-06-24).
          # We wrap every value in single quotes and escape any single-quote
          # inside via the standard '"'"' sh-quote trick.
          quote_single() {
            local v="$1"
            # Escape internal single quotes
            v=${v//\'/\'\"\'\"\'}
            printf "'%s'\n" "$v"
          }
          umask 077
          {
            printf 'BSKY_HANDLE=';    quote_single "$BSKY_HANDLE"
            printf 'BSKY_PW=';        quote_single "$BSKY_PW"
            printf 'RESEND_API_KEY='; quote_single "$RESEND_API_KEY"
            printf 'RESEND_FROM=';    quote_single "$RESEND_FROM"
          } > /tmp/bsky_creds.env
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            /tmp/bsky_creds.env root@104.236.239.46:/root/bsky_creds.env
          rm -f /tmp/bsky_creds.env

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@104.236.239.46 bash -s << 'EOF'
            set -euo pipefail

            # Load Bluesky + Resend credentials uploaded by the previous step.
            # File is 0600 by scp; remove after sourcing so it does not linger.
            BSKY_HANDLE=""
            BSKY_PW=""
            RESEND_API_KEY=""
            RESEND_FROM=""
            if [ -f /root/bsky_creds.env ]; then
              # shellcheck disable=SC1091
              . /root/bsky_creds.env
              rm -f /root/bsky_creds.env
            fi

            cd /opt/sentimentpulse

            echo "## git pull ##"
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline

            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            which node || echo "node not in PATH"
            which npm  || echo "npm not in PATH"

            echo ""
            echo "## SentimentPulse backend deps + migrations ##"
            cd backend
            source .venv/bin/activate
            pip install --quiet --upgrade-strategy only-if-needed -r requirements.txt
            alembic upgrade head

            echo ""
            echo "## One-time: apply approved distinctive_keywords lists (idempotent) ##"
            # 2026-07-24 relevance-gate fix: persists the 29-game keyword table
            # from sentiment_relevance_fix/proposed_keywords.json into
            # games.distinctive_keywords. Guarded by an app_settings row so it
            # only runs once across all future deploys — re-run manually with
            # `python scripts/apply_keyword_lists.py` if the keyword table is
            # revised later.
            #
            # v2 (2026-07-24 re-fix): the previous PYCHECK1/PYMARK1/PYCHECK2/
            # PYMARK2 heredoc approach silently broke the whole tail of this
            # script because bash heredoc terminators must be at column 0 unless
            # you use `<<-` (which only strips tabs, not spaces). YAML block
            # scalars force space indentation, so we can't dedent the closer.
            # Result: bash read everything after the first heredoc opener until
            # EOF looking for `PYCHECK1`, silently swallowed the rest of the
            # deploy (including the guarded apply/purge/restart), and exited 0.
            # This rewrite uses `python -c "..."` inline — no heredocs, no
            # indentation trap.
            # v3 (2026-07-24 keyword-hardening): apply_keyword_lists.py is
            # fully idempotent (an UPDATE that sets the same list is a no-op,
            # a change gets a fresh persistence). Removing the guard so every
            # deploy re-applies from backend/data/proposed_keywords.json.
            # That lets us tighten the keyword table (dropping
            # over-lenient variants like 'Space Marine2', 'Crysis3 Remastered',
            # 'Crysis2 Remastered', 'Halo3 MCC') and have the change take
            # effect on the next push, without needing a separate migration.
            if [ -f scripts/apply_keyword_lists.py ]; then
              if python scripts/apply_keyword_lists.py; then
                python -c 'from datetime import datetime, timezone; from database import SessionLocal; from models import AppSetting; db=SessionLocal(); db.merge(AppSetting(key="keyword_lists_applied_at", value=datetime.now(timezone.utc).isoformat())); db.commit(); db.close(); print("Marked keyword_lists_applied_at")'
              else
                echo "WARN: apply_keyword_lists.py failed (non-fatal, will retry next deploy)"
              fi
            else
              echo "scripts/apply_keyword_lists.py missing, skipping"
            fi

            echo ""
            echo "## One-time: purge July 2026 off-topic reddit sentiment (idempotent) ##"
            # 2026-07-24 relevance-gate fix: re-checks every reddit
            # SentimentRecord in the 2026-07-01..2026-07-24 window against the
            # NEW relevance gate (now using the just-applied keyword lists) and
            # deletes the ones that are off-topic. Must run AFTER the keyword
            # apply step above. Guarded by its own app_settings row.
            BACKFILL_ALREADY_DONE=$(python -c 'from database import SessionLocal; from models import AppSetting; db=SessionLocal(); row=db.query(AppSetting).filter(AppSetting.key=="sentiment_july_backfill_done_at").first(); print("yes" if row else "no"); db.close()' 2>/dev/null || echo "no")
            if [ "$BACKFILL_ALREADY_DONE" = "yes" ]; then
              echo "sentiment_july_backfill_done_at already set — skipping purge_july_offtopic_sentiment.py"
            else
              if [ -f scripts/purge_july_offtopic_sentiment.py ]; then
                if python scripts/purge_july_offtopic_sentiment.py; then
                  # Also delete any pre-existing July 2026 monthly summary rows
                  # so the next scheduled/regen run recomputes from cleaned data.
                  python -c 'from datetime import datetime, timezone; from database import SessionLocal; from models import AppSetting, MonthlySummary; db=SessionLocal(); deleted=db.query(MonthlySummary).filter(MonthlySummary.period_year==2026, MonthlySummary.period_month==7).delete(); db.merge(AppSetting(key="sentiment_july_backfill_done_at", value=datetime.now(timezone.utc).isoformat())); db.commit(); db.close(); print(f"Deleted {deleted} stale July 2026 monthly_summary row(s); marked sentiment_july_backfill_done_at")'
                else
                  echo "WARN: purge_july_offtopic_sentiment.py failed (non-fatal, will retry next deploy)"
                fi
              else
                echo "scripts/purge_july_offtopic_sentiment.py missing, skipping"
              fi
            fi

            echo ""
            echo "## One-time: reclassify sentiment for posts wrongly purged (idempotent) ##"
            # 2026-07-24 recovery step (add: after purge). The initial prod deploy
            # of the relevance-gate fix (commit c66f777) hit FileNotFoundError in
            # apply_keyword_lists.py because it defaulted to a workspace-only path,
            # so the 29 keyword lists never landed in games.distinctive_keywords
            # before purge_july_offtopic_sentiment.py ran. With no keywords loaded,
            # the new `if not keywords: return False` gate rejected almost every
            # post: 7,594 sentiment records deleted, only 265 kept — many of the
            # deleted were legitimate posts (false positives).
            #
            # Recovery: RawPost rows were untouched (purge only deletes
            # SentimentRecord). Re-running _step5_classify_sentiment against
            # every active game picks up every RawPost that no longer has a
            # SentimentRecord and has is_relevant IS NULL, applies the correct
            # gate (now with keywords loaded), and restores classification for
            # real posts. Truly off-topic posts stay marked is_relevant=False and
            # never get a SentimentRecord.
            #
            # Guarded by its own app_settings row so it only runs once. Only
            # runs if the apply-keywords guard is now set (i.e. this deploy or
            # a previous one successfully persisted the keyword lists).
            # v2 (2026-07-24 second-recovery): the first recovery deploy marked
            # this guard even though the script found "no unclassified posts"
            # for every game. Root cause: purge_july_offtopic_sentiment.py had
            # set RawPost.is_relevant=False on every wrongly-purged post, so
            # _step5_classify_sentiment (which filters is_relevant IS NULL)
            # skipped them. The recovery script now has a Step 0 that resets
            # is_relevant=None on posts that are (False AND have no
            # SentimentRecord) before doing anything else. Force-cleared once
            # in an earlier deploy; guard is now set correctly and this
            # recovery block is a no-op on subsequent runs.
            RECOVERY_ALREADY_DONE=$(python -c 'from database import SessionLocal; from models import AppSetting; db=SessionLocal(); row=db.query(AppSetting).filter(AppSetting.key=="sentiment_july_recovery_done_at").first(); print("yes" if row else "no"); db.close()' 2>/dev/null || echo "no")
            KEYWORDS_APPLIED_NOW=$(python -c 'from database import SessionLocal; from models import AppSetting; db=SessionLocal(); row=db.query(AppSetting).filter(AppSetting.key=="keyword_lists_applied_at").first(); print("yes" if row else "no"); db.close()' 2>/dev/null || echo "no")
            if [ "$RECOVERY_ALREADY_DONE" = "yes" ]; then
              echo "sentiment_july_recovery_done_at already set — skipping reclassify_missing_sentiment.py"
            elif [ "$KEYWORDS_APPLIED_NOW" != "yes" ]; then
              echo "keyword_lists_applied_at not set — skipping recovery (keywords must be applied first)"
            else
              if [ -f scripts/reclassify_missing_sentiment.py ]; then
                if python scripts/reclassify_missing_sentiment.py; then
                  python -c 'from datetime import datetime, timezone; from database import SessionLocal; from models import AppSetting; db=SessionLocal(); db.merge(AppSetting(key="sentiment_july_recovery_done_at", value=datetime.now(timezone.utc).isoformat())); db.commit(); db.close(); print("Marked sentiment_july_recovery_done_at")'
                  # After recovery, delete any pre-existing July 2026 monthly
                  # summary rows AGAIN so they regenerate against the fully
                  # restored data (not the mid-purge intermediate state).
                  python -c 'from database import SessionLocal; from models import MonthlySummary; db=SessionLocal(); deleted=db.query(MonthlySummary).filter(MonthlySummary.period_year==2026, MonthlySummary.period_month==7).delete(); db.commit(); db.close(); print(f"Post-recovery: deleted {deleted} stale July 2026 monthly_summary row(s) so they regenerate against restored data")'
                else
                  echo "WARN: reclassify_missing_sentiment.py failed (non-fatal, will retry next deploy)"
                fi
              else
                echo "scripts/reclassify_missing_sentiment.py missing, skipping"
              fi
            fi

            echo ""
            echo "## One-time: cleanup SM2 & sibling over-matches (idempotent) ##"
            # 2026-07-24 keyword-hardening cleanup. The initial recovery
            # classified real Warhammer 40k lore posts as SM2 game posts because
            # the keyword variant 'Space Marine2' (13 chars, 2 words) fuzzy-
            # matched bare 'Space Marine' with edit distance 1 on the 'Marine2'
            # token vs 'Marine'. Same pattern hit 'Crysis3 Remastered' (#37),
            # 'Crysis2 Remastered' (#39), and 'Halo3 MCC' (#105). Those four
            # variants are now removed from backend/data/proposed_keywords.json
            # and re-applied above.
            #
            # This step invalidates every SentimentRecord in the July 2026
            # window for those four games where RawPost.is_relevant=True
            # (i.e. classified as relevant under the too-lenient gate),
            # resets those posts to is_relevant=None, then re-runs Step 5
            # against them with the tightened keyword list. False positives
            # get is_relevant=False and no SentimentRecord. Real posts get
            # re-classified.
            SM2_CLEANUP_DONE=$(python -c 'from database import SessionLocal; from models import AppSetting; db=SessionLocal(); row=db.query(AppSetting).filter(AppSetting.key=="sm2_overmatch_cleanup_done_at").first(); print("yes" if row else "no"); db.close()' 2>/dev/null || echo "no")
            if [ "$SM2_CLEANUP_DONE" = "yes" ]; then
              echo "sm2_overmatch_cleanup_done_at already set — skipping cleanup_sm2_overmatch.py"
            else
              if [ -f scripts/cleanup_sm2_overmatch.py ]; then
                if python scripts/cleanup_sm2_overmatch.py; then
                  python -c 'from datetime import datetime, timezone; from database import SessionLocal; from models import AppSetting; db=SessionLocal(); db.merge(AppSetting(key="sm2_overmatch_cleanup_done_at", value=datetime.now(timezone.utc).isoformat())); db.commit(); db.close(); print("Marked sm2_overmatch_cleanup_done_at")'
                else
                  echo "WARN: cleanup_sm2_overmatch.py failed (non-fatal, will retry next deploy)"
                fi
              else
                echo "scripts/cleanup_sm2_overmatch.py missing, skipping"
              fi
            fi

            # §24b (2026-06-29): install Playwright Chromium for editorial
            # body fetching.  --with-deps installs system libraries the
            # browser needs (libnss, libatk, etc.).  Idempotent: skip if
            # the browser binary is already present (§16 auto-deploy may
            # run on every push so we don't want to re-fetch ~150 MB each
            # time).  Falls through silently if playwright is missing
            # from requirements (older branches).
            if python -c "import playwright" 2>/dev/null; then
              if [ ! -d /root/.cache/ms-playwright ] || [ -z "$(ls /root/.cache/ms-playwright 2>/dev/null)" ]; then
                echo "Installing Playwright Chromium + system deps..."
                python -m playwright install --with-deps chromium || \
                  echo "WARN: playwright install failed; editorial body fetch will fall back to title-only"
              else
                echo "Playwright Chromium already present, skipping install"
              fi
            else
              echo "playwright not in requirements (older branch?), skipping browser install"
            fi

            deactivate
            cd ..

            echo ""
            echo "## SentimentPulse frontend build ##"
            if [ -d frontend ] && [ -f frontend/package.json ]; then
              cd frontend
              npm install --no-audit --no-fund
              npm run build
              cd ..
            else
              echo "frontend/ missing, skipping"
            fi

            echo ""
            echo "## GTM Studio backend deps ##"
            if [ -f gtm/backend/requirements.txt ] && [ -d gtm/backend/.venv ]; then
              cd gtm/backend
              source .venv/bin/activate
              pip install --quiet --upgrade-strategy only-if-needed -r requirements.txt
              deactivate
              cd ../..
            elif [ -f gtm/backend/requirements.txt ]; then
              echo "WARN: gtm/backend/.venv missing — backend deps NOT installed"
            else
              echo "gtm/backend/requirements.txt missing, skipping"
            fi

            echo ""
            echo "## GTM Studio: re-seed example pack (idempotent) ##"
            # Re-render the 12-slide 'Blackwood Hollow' example pack from
            # source. Cheap (~10s) and guarantees /example on the live site
            # matches the current slide order + renderer code. Runs on every
            # deploy; the previous PNGs are overwritten atomically.
            if [ -f gtm/backend/scripts/seed_example_pack.py ] && [ -d gtm/backend/.venv ]; then
              cd gtm/backend
              source .venv/bin/activate
              python scripts/seed_example_pack.py || echo "WARN: seed_example_pack.py failed (non-fatal)"
              deactivate
              cd ../..
            else
              echo "seed_example_pack.py or gtm/backend/.venv missing, skipping example re-seed"
            fi

            echo ""
            echo "## GTM Studio frontend build ##"
            if [ -d gtm/frontend ] && [ -f gtm/frontend/package.json ]; then
              cd gtm/frontend
              npm install --no-audit --no-fund
              npm run build
              cd ../..
            else
              echo "gtm/frontend/ missing, skipping"
            fi

            echo ""
            echo "## SignalPulse build (client + server bundle) ##"
            # Added 2026-07-22: like triptracker, signalpulse was provisioned
            # once by deploy.sh but never re-built on subsequent pushes, so
            # client fixes (e.g. improved settings-save error messaging) never
            # went live automatically.
            if [ -d signalpulse ] && [ -f signalpulse/package.json ]; then
              cd signalpulse
              npm install --no-audit --no-fund
              npm run build
              cd ..
            else
              echo "signalpulse/ missing, skipping"
            fi

            echo ""
            echo "## Trip Tracker build (client + server bundle) ##"
            # Added 2026-07-20: the auto-deploy workflow previously only
            # handled SentimentPulse and GTM Studio. Trip Tracker was
            # provisioned once by deploy.sh but never re-built on subsequent
            # pushes, so new routes (e.g. /api/events/:id/executive-pdf) never
            # went live until a manual restart. Now built + restarted on
            # every push, matching the other two apps.
            if [ -d triptracker ] && [ -f triptracker/package.json ]; then
              cd triptracker
              npm install --no-audit --no-fund
              npm run build
              cd ..
            else
              echo "triptracker/ missing, skipping"
            fi

            echo ""
            echo "## Update Bluesky credentials in .env (idempotent) ##"
            ENV_FILE=/opt/sentimentpulse/.env
            if [ -n "${BSKY_HANDLE:-}" ] && [ -n "${BSKY_PW:-}" ]; then
              # Remove old lines if present, then append fresh ones
              sed -i '/^BLUESKY_HANDLE=/d' "$ENV_FILE"
              sed -i '/^BLUESKY_APP_PASSWORD=/d' "$ENV_FILE"
              echo "BLUESKY_HANDLE=${BSKY_HANDLE}" >> "$ENV_FILE"
              echo "BLUESKY_APP_PASSWORD=${BSKY_PW}" >> "$ENV_FILE"
              echo "Bluesky credentials updated in .env"
            else
              echo "Bluesky secrets not provided to workflow; .env untouched"
            fi

            echo ""
            echo "## Update Resend credentials in .env (idempotent) ##"
            # Only touch RESEND_API_KEY if the GH secret was set this run.
            # Empty secret ⇒ leave any existing value in place so a missing
            # secret in one deploy doesn't wipe a previously-good key.
            if [ -n "${RESEND_API_KEY:-}" ]; then
              sed -i '/^RESEND_API_KEY=/d' "$ENV_FILE"
              echo "RESEND_API_KEY=${RESEND_API_KEY}" >> "$ENV_FILE"
              echo "RESEND_API_KEY updated in .env"
            else
              echo "RESEND_API_KEY secret not provided this deploy; .env untouched"
            fi
            if [ -n "${RESEND_FROM:-}" ]; then
              sed -i '/^RESEND_FROM=/d' "$ENV_FILE"
              echo "RESEND_FROM=${RESEND_FROM}" >> "$ENV_FILE"
              echo "RESEND_FROM updated in .env"
            fi

            echo ""
            echo "## restart services ##"
            # Match service unit lines like 'sentimentpulse.service enabled enabled'.
            # Escape the literal '.' in the regex so '^name.service' doesn't false-positive,
            # AND use awk to test field 1 exactly (more reliable than grep on the full row).
            installed_units=$(systemctl list-unit-files --type=service --no-legend | awk '{print $1}')
            for svc in sentimentpulse gtmstudio triptracker signalpulse; do
              if echo "$installed_units" | grep -qx "${svc}.service"; then
                systemctl restart "$svc"
                sleep 2
                systemctl is-active "$svc" && echo "$svc: active" || echo "$svc: FAILED"
              else
                echo "$svc.service not installed; skipping"
              fi
            done

            echo ""
            echo "## deploy OK ##"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
