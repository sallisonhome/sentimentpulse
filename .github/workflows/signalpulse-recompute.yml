name: SignalPulse — Recompute from stored data (no store polling)

# Re-derive title-level chart ranks and console estimates from data the daily job already collected today.
# Nothing here calls Steam, Sony or Microsoft. The two *-preview actions write nothing to the live database.
#   ranks-preview / estimate-preview : safe, read-only against live data (estimate-preview runs on a copy)
#   ranks-apply / estimate-apply     : write to the live database; run only after a preview and an explicit go-ahead
# Refuses to overlap the daily refresh (exit 75).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do (previews are the default and write nothing)'
        required: true
        default: 'ranks-preview'
        type: choice
        options: [ranks-preview, estimate-preview, ranks-apply, estimate-apply]
      overlay:
        description: 'estimate-preview only: settings applied to the COPY, e.g. noise_gate_min_signal.xbox=10 (numbers only)'
        required: false
        default: ''
      anchor_mode:
        description: 'estimate-preview only: rank-anchor floor on the COPY: legacy (default), report (legacy applied, comparison printed), curve (durable floor applied)'
        required: false
        default: 'legacy'
        type: choice
        options: [legacy, report, curve]

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Run ${{ github.event.inputs.action }}
        env:
          ACTION: ${{ github.event.inputs.action }}
          OVERLAY: ${{ github.event.inputs.overlay }}
          ANCHOR_MODE: ${{ github.event.inputs.anchor_mode }}
        run: |
          set -e
          case "$ACTION" in ranks-preview|estimate-preview|ranks-apply|estimate-apply) ;; *) echo "bad action"; exit 64;; esac
          # ssh joins its arguments into one command line for the remote shell: an empty argument is dropped (the next one
          # shifts into its place) and shell metacharacters would be interpreted. So the free-text inputs travel as prefixed
          # base64, which is never empty and never carries a metacharacter, and are decoded and re-quoted on the droplet.
          # The anchor mode only applies to estimate-preview; the other actions get an empty mode.
          [ "$ACTION" = "estimate-preview" ] || ANCHOR_MODE=""
          OV_ARG="o:$(printf '%s' "$OVERLAY" | base64 -w0)"
          MD_ARG="m:$(printf '%s' "$ANCHOR_MODE" | base64 -w0)"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            root@104.236.239.46 bash -s -- "$ACTION" "$OV_ARG" "$MD_ARG" <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          [ -n "$WD" ] && [ -f "$WD/deploy/signalpulse-recompute.sh" ]
          OV=$(printf '%s' "${2#o:}" | base64 -d)
          MD=$(printf '%s' "${3#m:}" | base64 -d)
          bash "$WD/deploy/signalpulse-recompute.sh" "$1" "$OV" "$MD"
          REMOTE
