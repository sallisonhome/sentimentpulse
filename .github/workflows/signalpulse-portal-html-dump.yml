name: SignalPulse — Portal HTML dump (diagnostic)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Steam AppID (e.g. 2183900 for SM2)"
        required: true
        default: "2183900"
      date_start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-08-01"
      date_end:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-08-31"

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch and dump panel HTML
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          DATE_START: ${{ github.event.inputs.date_start }}
          DATE_END: ${{ github.event.inputs.date_end }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 \
              APP_ID="$APP_ID" DATE_START="$DATE_START" DATE_END="$DATE_END" \
              bash -s <<'REMOTE_EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db
            COOKIE=$(sqlite3 "$DB" "SELECT cookie_value FROM steamworks_sessions WHERE id='default';")
            if [ -z "$COOKIE" ]; then
              echo "No cookie configured. Aborting."; exit 1
            fi

            URL="https://partner.steampowered.com/app/details/${APP_ID}/?dateStart=${DATE_START}&dateEnd=${DATE_END}&priorDateStart=2025-08-01&priorDateEnd=2025-08-31&alignPriorAnnual=Immediate&submit=Update"
            echo "Fetching: $URL"

            HTML=/tmp/portal-dump.html
            curl -sS \
                 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                 -H "Cookie: $COOKIE" \
                 --max-time 30 \
                 "$URL" > "$HTML"

            echo ""
            echo "File size: $(wc -c < $HTML) bytes"
            echo ""

            # Write the Python parser to a separate file to avoid quoting hell.
            cat > /tmp/parse-dump.py <<'PY_EOF'
            import re, sys, os
            html = open("/tmp/portal-dump.html", "r", encoding="utf-8", errors="replace").read()
            for panel in ("salesregion_panel1","salesregion_panel3","activationsregion_panel1","activationsregion_panel3"):
                print("")
                print("=" * 68)
                print(" PANEL: %s" % panel)
                print("=" * 68)
                idx = html.find('class="%s"' % panel)
                if idx == -1:
                    print("  NOT FOUND")
                    continue
                slice_ = html[idx:idx+15000]
                trs = re.findall(r"<tr[^>]*>.*?</tr>", slice_, re.DOTALL)
                print("  Found %d <tr> rows in panel slice (showing first 10):" % len(trs))
                print("")
                for i, tr in enumerate(trs[:10]):
                    compact = re.sub(r"\s+", " ", tr).strip()
                    print("  [%d] %s" % (i, compact[:900]))
                    print("")
            PY_EOF
            python3 /tmp/parse-dump.py
            rm -f "$HTML" /tmp/parse-dump.py
          REMOTE_EOF
