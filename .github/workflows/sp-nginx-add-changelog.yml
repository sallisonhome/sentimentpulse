name: SP Nginx Add Changelog Routes

# One-shot idempotent surgery: adds the two exact-match location blocks
# needed for the launcher's What's New page to the LIVE nginx config,
# without touching anything else. Idempotent — running twice is a no-op.
#
# The Python surgery script lives at scripts/nginx_insert_changelog_routes.py
# so YAML indentation doesn't break it.

on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy insert script to droplet
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              scripts/nginx_insert_changelog_routes.py \
              root@104.236.239.46:/tmp/nginx_insert_changelog_routes.py

      - name: Insert routes + reload nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s << 'REMOTE'
            set -euo pipefail

            LIVE=/etc/nginx/sites-enabled/sentimentpulse
            BACKUP=/etc/nginx/sites-enabled/sentimentpulse.bak.$(date +%Y%m%d-%H%M%S)

            if grep -q "location = /changelog.html" "$LIVE"; then
              echo "Changelog routes already present in live config — nothing to do."
              rm -f /tmp/nginx_insert_changelog_routes.py
              exit 0
            fi

            echo "── Backing up $LIVE -> $BACKUP ──"
            cp "$LIVE" "$BACKUP"

            echo ""
            echo "── Running surgical insert ──"
            python3 /tmp/nginx_insert_changelog_routes.py "$LIVE"

            echo ""
            echo "── nginx -t ──"
            if ! nginx -t; then
              echo "ERROR: nginx -t failed after insert. Rolling back."
              cp "$BACKUP" "$LIVE"
              nginx -t
              rm -f /tmp/nginx_insert_changelog_routes.py
              exit 1
            fi

            echo ""
            echo "── systemctl reload nginx ──"
            systemctl reload nginx
            echo "nginx reloaded."

            echo ""
            echo "── Smoke tests ──"
            for path in / /changelog.html /SUITE_CHANGELOG.md /sentiment/ /signal/ /partnerships/ /trips/ /gtm/ /genrepulse/; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost$path")
              echo "  GET $path -> $CODE"
            done

            rm -f /tmp/nginx_insert_changelog_routes.py
          REMOTE
