name: SP Comment Backfill Count (one-off)

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Count
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend
            sqlite3 -header -column sentimentpulse.db <<'SQL'
          SELECT
            COUNT(*) AS reddit_comment_raw_posts_total
          FROM raw_posts
          WHERE source = 'reddit_comment';
          SELECT
            sr.sentiment,
            COUNT(*) AS n
          FROM raw_posts rp
          JOIN sentiment_records sr ON sr.raw_post_id = rp.id
          WHERE rp.source = 'reddit_comment'
          GROUP BY sr.sentiment
          ORDER BY n DESC;
          SELECT
            COUNT(DISTINCT rp.game_id) AS games_with_reddit_comments
          FROM raw_posts rp
          JOIN sentiment_records sr ON sr.raw_post_id = rp.id
          WHERE rp.source = 'reddit_comment';
          SQL
          EOF
