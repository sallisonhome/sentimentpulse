name: SignalPulse — Refit ownership multipliers (from anchors)

# Reads baseline-state revenue_calibration_anchors at m12+ltd windows, joins
# to current window_estimates_daily units_mid, and computes a weighted-median
# ratio (weight = window length in days). Applies old_mult × ratio, capped at
# MAX_STEP× step per refit for safety. Every run writes a calibration_events
# audit row whether applied or not.
#
# DEFAULTS to dry-run. Always review the output before running with
# dry_run=false. The banner on the leaderboard reads from the latest applied
# calibration_events row.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      as_of_date:
        description: "AS_OF_DATE (YYYY-MM-DD, default today UTC)"
        required: false
        default: ""
      min_anchors:
        description: "Minimum anchor rows required to refit (default 2)"
        required: false
        default: "2"
      max_step:
        description: "Maximum step change relative to current multiplier per refit (default 3.0)"
        required: false
        default: "3.0"

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run refit-ownership-multipliers
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          AS_OF_DATE: ${{ github.event.inputs.as_of_date || '' }}
          MIN_ANCHORS: ${{ github.event.inputs.min_anchors || '2' }}
          MAX_STEP: ${{ github.event.inputs.max_step || '3.0' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 \
              DRY_RUN="$DRY_RUN" \
              AS_OF_DATE="$AS_OF_DATE" \
              MIN_ANCHORS="$MIN_ANCHORS" \
              MAX_STEP="$MAX_STEP" \
              bash -s <<'REMOTE'
          set -euo pipefail
          DRY_RUN="${DRY_RUN:-true}"
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"
          if [ -f /etc/signalpulse/env ]; then set -a; . /etc/signalpulse/env; set +a; fi
          export NODE_ENV="${NODE_ENV:-production}"
          if [ "$DRY_RUN" = "true" ]; then export DRY_RUN=1; else unset DRY_RUN; fi
          if [ -n "${AS_OF_DATE:-}" ]; then export AS_OF_DATE; fi
          export MIN_ANCHORS="${MIN_ANCHORS:-2}"
          export MAX_STEP="${MAX_STEP:-3.0}"
          [ -f "$WD/scripts/refit-ownership-multipliers.ts" ] || {
            echo "ERR: scripts/refit-ownership-multipliers.ts missing on droplet — deploy first"; exit 1;
          }
          echo "════════════════════════════════════════════════════════"
          echo "  refit-ownership-multipliers.ts"
          echo "  DRY_RUN=${DRY_RUN:-unset} AS_OF_DATE=${AS_OF_DATE:-today}"
          echo "  MIN_ANCHORS=${MIN_ANCHORS} MAX_STEP=${MAX_STEP}"
          echo "════════════════════════════════════════════════════════"
          timeout 60 ./node_modules/.bin/tsx scripts/refit-ownership-multipliers.ts
          REMOTE
