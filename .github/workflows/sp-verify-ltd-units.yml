name: SP Verify LTD Units (one-off diagnostic)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse

            echo "== HEAD commit on droplet =="
            git log --oneline -1

            echo ""
            echo "== signalpulse.service status =="
            systemctl is-active signalpulse || true

            echo ""
            echo "== dist bundle contains ltdUnitsSold (proves new build is live) =="
            grep -c "ltdUnitsSold" signalpulse/dist/index.cjs || echo "NOT FOUND"

            echo ""
            echo "== Independent SQL sanity check: lifetime BASE net units + revenue per product =="
            sqlite3 -header -column signalpulse/data.db "
              SELECT p.id AS product_id, p.title,
                     SUM(CASE WHEN s.sku_group='base' THEN s.net_units ELSE 0 END) AS ltd_base_units,
                     ROUND(SUM(CASE WHEN s.sku_group='base' THEN s.net_revenue_usd ELSE 0 END), 2) AS ltd_base_rev,
                     ROUND(SUM(CASE WHEN s.sku_group='dlc' THEN s.net_revenue_usd ELSE 0 END), 2) AS ltd_dlc_rev,
                     COUNT(s.id) AS row_count
              FROM products p
              LEFT JOIN steam_sales_daily s ON s.product_id = p.id
              WHERE p.id IN (20, 19, 9, 14, 3)
              GROUP BY p.id, p.title
              ORDER BY p.id;
            "
          EOF
