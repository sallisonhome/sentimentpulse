name: SP IGDB Direct-Call Validation (one-off)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Validate Twitch creds, mint token, run IGDB ingestion, verify hype rows
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 'bash -s' << 'REMOTE'
          set -euo pipefail

          DB=/opt/sentimentpulse/signalpulse/data.db

          echo "== 1. Confirm Twitch credentials are stored =="
          sqlite3 "$DB" "SELECT key, CASE WHEN LENGTH(value) > 0 THEN 'SET (len=' || LENGTH(value) || ')' ELSE 'EMPTY' END AS status FROM app_settings WHERE key IN ('twitch_client_id','twitch_client_secret');"

          CID=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='twitch_client_id';")
          CSEC=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='twitch_client_secret';")

          if [ -z "$CID" ] || [ -z "$CSEC" ]; then
            echo "ABORT: Twitch credentials not saved in settings table"
            exit 1
          fi

          echo ""
          echo "== 2. Mint Twitch app access token directly =="
          TOKEN_RESP=$(curl -sS -X POST "https://id.twitch.tv/oauth2/token" -d "client_id=${CID}" -d "client_secret=${CSEC}" -d "grant_type=client_credentials")
          echo "Response (redacted): $(echo "$TOKEN_RESP" | sed 's/"access_token":"[^"]*"/"access_token":"REDACTED"/')"

          TOKEN=$(echo "$TOKEN_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "ABORT: Twitch token mint failed"
            exit 1
          fi
          echo "Token minted OK (len=${#TOKEN})"

          echo ""
          echo "== 3. Query IGDB for Space Marine 2 (appid 2183900) =="
          curl -sS -X POST "https://api.igdb.com/v4/games" -H "Client-ID: ${CID}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/json" --data 'fields id,name,hypes,external_games.uid,external_games.external_game_source; where external_games.uid = "2183900" & external_games.external_game_source = 1; limit 5;'
          echo ""

          echo ""
          echo "== 4. IGDB hype rows BEFORE ingestion =="
          sqlite3 -header -column "$DB" "SELECT p.name, ih.date, ih.igdb_id, ih.hype_score FROM igdb_hype_daily ih JOIN products p ON p.id = ih.product_id WHERE ih.date >= date('now','-3 days') ORDER BY ih.date DESC, p.name;"

          echo ""
          echo "== 5. Trigger full ingestion =="
          curl -sS -X POST "http://127.0.0.1:5000/api/ingestion/run" -w "\nHTTP %{http_code}\n" || true

          echo ""
          echo "== 6. Wait 90s for ingestion, then check status =="
          sleep 90
          curl -sS "http://127.0.0.1:5000/api/ingestion/status" | python3 -m json.tool | head -80 || true

          echo ""
          echo "== 7. IGDB-related journal logs (last 5 min) =="
          journalctl -u signalpulse --no-pager --since "5 minutes ago" 2>&1 | grep -iE "igdb|hype|twitch" | tail -40 || echo "No IGDB log lines"

          echo ""
          echo "== 8. IGDB hype rows AFTER ingestion =="
          sqlite3 -header -column "$DB" "SELECT p.name, ih.date, ih.igdb_id, ih.hype_score FROM igdb_hype_daily ih JOIN products p ON p.id = ih.product_id WHERE ih.date = (SELECT MAX(date) FROM igdb_hype_daily) ORDER BY p.name;"

          echo ""
          echo "== 9. Coverage summary =="
          sqlite3 -header -column "$DB" "SELECT (SELECT COUNT(*) FROM products WHERE is_saber_published=1 AND steam_app_id IS NOT NULL) AS eligible_products, (SELECT COUNT(*) FROM igdb_hype_daily WHERE date = date('now')) AS todays_hype_rows, (SELECT COUNT(*) FROM igdb_hype_daily WHERE date = date('now') AND hype_score IS NOT NULL) AS rows_with_score;"

          echo ""
          echo "== 10. Wishlist leaderboard API =="
          curl -sS "http://127.0.0.1:5000/api/leaderboards/wishlist" > /tmp/wishlist.json
          python3 -c "import json; d=json.load(open('/tmp/wishlist.json')); rows=d.get('rows',d) if isinstance(d,dict) else d; print('Rows:',len(rows) if isinstance(rows,list) else 'n/a'); [print(f\"  {r.get('name') or r.get('productName') or r.get('title')}: hype={r.get('igdbHype') or r.get('hypeScore') or r.get('hype')}\") for r in (rows if isinstance(rows,list) else [])]"

          REMOTE
