name: SP Off-Topic Drift Flag Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run backfill
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            dry-run) FLAG="--dry-run" ;;
            apply)   FLAG="--apply"   ;;
            *) echo "unknown mode: $MODE" >&2; exit 1 ;;
          esac
          echo "Running with: $FLAG"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 \
              "cd /opt/sentimentpulse/backend && .venv/bin/python -m scripts.backfill_off_topic_drift_flag $FLAG"
