name: SP download report diagnostic (one-off)

on:
  workflow_dispatch: {}

concurrency:
  group: sp-download-report-diag-oneoff
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch demo report landing pages server-side (cookie never printed)
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          cat > /tmp/diag.py <<'PYS'
          import sqlite3, re, urllib.request
          db = sqlite3.connect('file:/opt/sentimentpulse/signalpulse/data.db?mode=ro', uri=True)
          cookie = db.execute("SELECT cookie_value FROM steamworks_sessions WHERE id='default'").fetchone()[0]
          def fetch(appid):
              url = f'https://partner.steampowered.com/nav_regions.php?downloads=1&appID={appid}'
              req = urllib.request.Request(url, headers={'Cookie': cookie, 'User-Agent': 'SignalPulse/1.0', 'Accept-Language': 'en-US'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode('utf-8', 'replace')
          for appid, expected in [('5102100', 'Game: Rideshare "Stimulator" Demo - Downloads by Region'),
                                   ('5184670', "Game: Clive Barker's Hellraiser: Revival Demo - Downloads by Region")]:
              status, html = fetch(appid)
              print(f'=== appID {appid} HTTP {status} ===')
              headings = re.findall(r'<h[1-6]\b[^>]*>([\s\S]*?)</h[1-6]>', html, re.I)
              for h in headings:
                  t = re.sub(r'<[^>]+>', ' ', h)
                  t = re.sub(r'\s+', ' ', t).strip()
                  if 'Downloads by Region' in t:
                      print('HEADING_TEXT:', repr(t))
                      print('HEADING_HAS_QUOT_ENTITY:', '"' in h)
                      print('IDENTITY_MATCH_EXPECTED:', t == expected)
          PYS
          ssh -i ~/.ssh/id_ed25519 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -o StrictHostKeyChecking=accept-new root@104.236.239.46 'python3 -' < /tmp/diag.py
