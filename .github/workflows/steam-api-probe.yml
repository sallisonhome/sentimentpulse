name: Steam Partner API Probe

# Diagnostic-only workflow (2026-08-11). Reads the Steam Web API key from
# signalpulse's app_settings and probes the full set of Steamworks
# endpoints (Partner Financial + Partner Stats + Public) to see exactly
# which ones the current key can hit and what data comes back.
#
# Trigger: workflow_dispatch only. Nothing runs on push.
#
# Safety:
#   - The key is never echoed to logs (only first-4 / last-4 chars).
#   - The URLs are constructed on the droplet, not on the runner, so the
#     key never touches GitHub-side infrastructure or logs.
#   - Responses may include Valve error messages that reference the key
#     ID; response bodies are truncated to 400 chars to bound exposure.
#
# Inputs:
#   appid  — Steam AppID to probe. Defaults to 2183900 (Space Marine 2).
#   date   — YYYY-MM-DD in GMT for date-bounded endpoints. Defaults to
#            yesterday-GMT (computed on the droplet).

"on":
  workflow_dispatch:
    inputs:
      appid:
        description: 'Steam AppID (default 2183900 = Space Marine 2)'
        required: false
        default: '2183900'
      date:
        description: 'Report date YYYY-MM-DD in GMT (blank = yesterday)'
        required: false
        default: ''

concurrency:
  # Share the droplet concurrency group so a probe never races a deploy.
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Probe Steam API endpoints
        env:
          PROBE_APPID: ${{ inputs.appid }}
          PROBE_DATE: ${{ inputs.date }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 \
              PROBE_APPID="${PROBE_APPID}" PROBE_DATE="${PROBE_DATE}" \
              bash -s <<'REMOTEEOF'
          set -euo pipefail

          KEY=$(sqlite3 /opt/sentimentpulse/signalpulse/data.db \
              "SELECT value FROM app_settings WHERE key='steam_api_key';" 2>/dev/null || true)

          if [ -z "${KEY:-}" ]; then
            echo "ERROR: no steam_api_key in signalpulse's app_settings"
            exit 1
          fi

          APPID="${PROBE_APPID:-2183900}"
          DATE="${PROBE_DATE:-}"
          if [ -z "$DATE" ]; then
            DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          fi

          echo "=========================================="
          echo "Steam Partner API probe"
          echo "Key:   ${KEY:0:4}...${KEY: -4}  (${#KEY} chars)"
          echo "AppID: $APPID"
          echo "Date:  $DATE"
          echo "=========================================="

          # SIGPIPE-tolerant: `head -c 400` in a pipeline can close the
          # upstream write end early, which with set -euo pipefail would
          # kill the whole probe function on exit 141. Use bash string
          # slicing on the FULL response instead of piping through head.
          probe() {
            local label="$1"
            local url="$2"
            local resp code body
            resp=$(curl -sS -w "\n---HTTP:%{http_code}---" --max-time 15 "$url" 2>&1 || true)
            code=$(echo "$resp" | grep -oP "(?<=---HTTP:)\d+" | tail -1 || echo "???")
            body=$(echo "$resp" | sed 's/---HTTP:.*---//' | tr -d '\n')
            # Truncate to 400 chars using bash param expansion (no pipe).
            body="${body:0:1200}"
            printf "[%s] %s\n" "${code:-???}" "$label"
            printf "    host: %s\n" "$(echo "$url" | sed 's|https\?://||' | cut -d/ -f1)"
            printf "    body: %s\n\n" "$body"
            return 0
          }

          echo ""
          echo "── PARTNER FINANCIAL (Financial group required) ──"
          echo ""

          probe "GetChangedDatesForPartner (tests Financial access at all)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetChangedDatesForPartner/v001/?key=${KEY}"

          probe "GetAppWishlistReporting (adds/deletes/purchases/gifts)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetAppWishlistReporting/v001/?key=${KEY}&appid=${APPID}&date=${DATE}"

          # v6 (2026-08-11): permissions confirmed granted per admin screenshot.
          # Adding endpoint-variant tests to distinguish 'permission gap' from
          # 'wrong endpoint' as cause of empty responses.
          YESTERDAY_PT=$(TZ=America/Los_Angeles date -d "yesterday" +%Y-%m-%d)

          # Variant A: GetDetailedSales (key-based, no partnerid)
          probe "GetDetailedSales key+date only (PT=2025-12-15, hwm=0)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-12-15&highwatermark_id=0"

          probe "GetDetailedSales key+date+view_grants (PT=2025-12-15)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-12-15&highwatermark_id=0&include_view_grants=true"

          # Variant B: GetChangedDatesForPartner — tells us all dates with any
          # data ever (highwatermark=0). Empty here = key sees no dates ever.
          probe "GetChangedDatesForPartner (hwm=0, view_grants=true)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetChangedDatesForPartner/v001/?key=${KEY}&highwatermark=0&include_view_grants=true"

          # Variant C: try the api.steampowered.com host instead of partner.
          # xpaw.me API browser (unofficial but usually accurate) lists
          # GetDetailedSales at api.steampowered.com/.../v1/ (note: v1 not v001).
          probe "GetDetailedSales v1 (PUBLIC HOST, PT=2025-12-15)" \
            "https://api.steampowered.com/IPartnerFinancialsService/GetDetailedSales/v1/?key=${KEY}&date=2025-12-15&highwatermark_id=0"

          probe "GetDetailedSales v1 (PUBLIC HOST, PT=${YESTERDAY_PT})" \
            "https://api.steampowered.com/IPartnerFinancialsService/GetDetailedSales/v1/?key=${KEY}&date=${YESTERDAY_PT}&highwatermark_id=0"

          # Variant D: GetDetailedSalesForDate — legacy variant that needs
          # partnerid. If this works and GetDetailedSales doesn't, canonical
          # endpoint may have moved. Trying without partnerid to see if the
          # error hints at what value to use.
          probe "GetDetailedSalesForDate WITHOUT partnerid (PT=2025-12-15)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSalesForDate/v001/?key=${KEY}&date=2025-12-15"

          # Variant E: GetSupportedAPIList — confirmed empty (only public
          # interfaces listed; IPartnerFinancialsService doesn't appear even
          # though wishlist calls succeed. GetSupportedAPIList is unreliable
          # for partner-only interfaces).

          # Variant F: sanity — hit GetAppWishlistReporting alongside
          # GetDetailedSales in the SAME curl session against SAME host with
          # SAME auth path. Rules out any per-endpoint routing weirdness.
          echo "[BACK-TO-BACK] wishlist THEN sales for same day/appid/key:"
          echo "  wishlist yesterday-GMT ($DATE):"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetAppWishlistReporting/v001/?key=${KEY}&appid=${APPID}&date=${DATE}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('response',{}); s=r.get('wishlist_summary'); print(f'    HAS DATA: adds={s.get(\"wishlist_adds\")}, deletes={s.get(\"wishlist_deletes\")}, purchases={s.get(\"wishlist_purchases\")}' if s else '    EMPTY response')" 2>&1
          echo "  sales yesterday-PT ($YESTERDAY_PT):"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=${YESTERDAY_PT}&highwatermark_id=0" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('response',{}); items=r.get('results') or r.get('items') or []; print(f'    HAS DATA: {len(items)} results, max_id={r.get(\"max_id\")}' if r else '    EMPTY response'); print(f'    keys present in response: {sorted(r.keys())}')" 2>&1
          echo "  sales 2025-09-15 (launch day):"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-09-15&highwatermark_id=0" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('response',{}); print(f'    top-level keys: {sorted(d.keys())}, response keys: {sorted(r.keys())}')" 2>&1

          # Variant G: try v2 endpoint (in case Valve migrated)
          probe "GetDetailedSales v002 (2025-09-15)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v002/?key=${KEY}&date=2025-09-15&highwatermark_id=0"

          # Variant H: try IPublisherFinancials (alternative service name)
          probe "IPublisherFinancials/GetDetailedSales v001 (2025-09-15)" \
            "https://partner.steam-api.com/IPublisherFinancials/GetDetailedSales/v001/?key=${KEY}&date=2025-09-15&highwatermark_id=0"

          probe "IPublisherFinancialsService/GetDetailedSales v001 (2025-09-15)" \
            "https://partner.steam-api.com/IPublisherFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-09-15&highwatermark_id=0"

          # Variant I: totally bogus method to see what a REAL error looks like.
          probe "GARBAGE method (control: what does real 400 look like?)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/ThisDoesNotExist/v001/?key=${KEY}"

          # Variant J: sanity — try highwatermark=1 instead of 0. Docs say 0
          # is correct as an initial cursor value, but confirming Valve isn't
          # specifically treating 0 as 'send nothing'. Extremely unlikely to
          # help but rules out one last possibility.
          probe "GetDetailedSales hwm_id=1 (control: hwm=0 might be special?)" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-09-15&highwatermark_id=1"
          probe "GetChangedDatesForPartner hwm=1" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetChangedDatesForPartner/v001/?key=${KEY}&highwatermark=1"

          # ─── v7 (2026-08-11 evening): raw-headers dump ───────────────
          # User says the key CAN see financial data in portal. Something
          # about our request is being rejected silently. Dump the raw
          # HTTP response headers (esp. x-eresult, x-error_message) which
          # Valve uses to signal per-endpoint errors even under 200 OK.
          echo ""
          echo "── RAW HEADERS on GetDetailedSales (look for x-eresult, x-error_message) ──"
          curl -sSD - -o /tmp/body_sales.txt --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-09-15&highwatermark_id=0&include_view_grants=true" \
            | head -c 2000
          echo ""
          echo "  body: $(head -c 400 /tmp/body_sales.txt)"
          echo

          echo "── RAW HEADERS on GetAppWishlistReporting (CONTROL, works) ──"
          curl -sSD - -o /tmp/body_wl.txt --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetAppWishlistReporting/v001/?key=${KEY}&appid=${APPID}&date=${DATE}" \
            | head -c 2000
          echo ""
          echo "  body: $(head -c 400 /tmp/body_wl.txt)"
          echo

          echo "── RAW HEADERS on GetChangedDatesForPartner (should list all dates ever) ──"
          curl -sSD - -o /tmp/body_gcd.txt --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetChangedDatesForPartner/v001/?key=${KEY}&highwatermark=0" \
            | head -c 2000
          echo ""
          echo "  body: $(head -c 400 /tmp/body_gcd.txt)"
          echo

          # Try with 'appid' param (which is not documented but wishlist requires it).
          echo "── GetDetailedSales WITH appid=${APPID} (undocumented but try) ──"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&appid=${APPID}&date=2025-09-15&highwatermark_id=0" \
            | head -c 800
          echo
          echo

          # Try with 'partnerid' (docs example shows partnerid in response — maybe input too?)
          echo "── GetDetailedSales WITH partnerid=10500 (test docs example value) ──"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&partnerid=10500&date=2025-09-15&highwatermark_id=0" \
            | head -c 800
          echo
          echo

          # x-webapi-key header instead of query param — docs say this works
          echo "── GetDetailedSales via x-webapi-key HEADER (not query) ──"
          curl -sS --max-time 15 \
            -H "x-webapi-key: ${KEY}" \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?date=2025-09-15&highwatermark_id=0" \
            | head -c 800
          echo
          echo

          # format=json param — check if response format is off
          echo "── GetDetailedSales with format=json ──"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2025-09-15&highwatermark_id=0&format=json" \
            | head -c 800
          echo
          echo

          # POST body instead of query params
          echo "── GetDetailedSales as POST with form body ──"
          curl -sS -X POST --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/" \
            -d "key=${KEY}&date=2025-09-15&highwatermark_id=0" \
            | head -c 800
          echo
          echo

          # GetPartnerAppListForWebAPIKey — tells us which apps the key sees
          echo "── GetPartnerAppListForWebAPIKey (which apps does this key see?) ──"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/ISteamApps/GetPartnerAppListForWebAPIKey/v2/?key=${KEY}" \
            | head -c 1500
          echo

          # ─── v8 (2026-08-11 evening): Bus Bound vs SM2 side-by-side ───
          # User confirmed CSV export DOES return real Bus Bound sales.
          # Test whether GetDetailedSales also returns Bus Bound sales.
          # If yes: our SM2 issue is publisher-scope; sales API works for
          # titles Mad Dog owns.
          # If no: sales API is broken for the whole key regardless of app,
          # confirming Financial API Group needed.
          echo ""
          echo "── GetDetailedSales for Bus Bound (appid 2095420) launch dates ──"
          # Bus Bound is currently in early access / launched — recent dates
          # in the past week should have real sales per user's CSV.
          for D in 2026-08-04 2026-08-07 2026-08-10; do
            echo "[$D]"
            curl -sS --max-time 15 \
              "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=${D}&highwatermark_id=0" \
              | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    r = d.get('response', {})
    results = r.get('results') or []
    max_id = r.get('max_id')
    print(f'  keys={sorted(r.keys())}, results_count={len(results)}, max_id={max_id}')
    if results:
        print(f'  first result: {json.dumps(results[0])[:300]}')
        # count Bus Bound rows
        bb_rows = [x for x in results if x.get('appid') == 2095420 or x.get('primary_appid') == 2095420]
        sm_rows = [x for x in results if x.get('appid') == 2183900 or x.get('primary_appid') == 2183900]
        print(f'  Bus Bound rows: {len(bb_rows)}, SM2 rows: {len(sm_rows)}')
except Exception as e:
    print(f'  parse err: {e}')
"
          done
          echo

          echo "── Bus Bound WISHLIST as control (should work) ──"
          curl -sS --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetAppWishlistReporting/v001/?key=${KEY}&appid=2095420&date=2026-08-07" \
            | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    s = (d.get('response') or {}).get('wishlist_summary')
    if s:
        print(f'  WORKS: adds={s.get(\"wishlist_adds\")}, deletes={s.get(\"wishlist_deletes\")}, purchases={s.get(\"wishlist_purchases\")}')
    else:
        print(f'  EMPTY response: {json.dumps(d)[:200]}')
except Exception as e:
    print(f'  parse err: {e}')
"
          echo

          echo "── GetDetailedSales raw HEADERS for Bus Bound date 2026-08-07 ──"
          curl -sSD - -o /tmp/body_bb.txt --max-time 15 \
            "https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=2026-08-07&highwatermark_id=0" \
            | head -c 800
          echo ""
          echo "  body: $(head -c 400 /tmp/body_bb.txt)"
          echo

          echo ""
          echo "── PARTNER STATS (may or may not be scoped in) ──"
          echo ""

          probe "GetNumberOfCurrentPlayers (Partner host)" \
            "https://partner.steam-api.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?key=${KEY}&appid=${APPID}"

          probe "GetGlobalAchievementPercentagesForApp (Partner host)" \
            "https://partner.steam-api.com/ISteamUserStats/GetGlobalAchievementPercentagesForApp/v2/?key=${KEY}&gameid=${APPID}"

          probe "GetGlobalStatsForGame (Partner host, needs name whitelist)" \
            "https://partner.steam-api.com/ISteamUserStats/GetGlobalStatsForGame/v1/?key=${KEY}&appid=${APPID}&count=1&name%5B0%5D=games_played"

          probe "GetSchemaForGame (Partner host)" \
            "https://partner.steam-api.com/ISteamUserStats/GetSchemaForGame/v2/?key=${KEY}&appid=${APPID}"

          echo ""
          echo "── PUBLIC (should always work if key is valid) ──"
          echo ""

          probe "News (api.steampowered.com)" \
            "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?key=${KEY}&appid=${APPID}&count=1"

          probe "GetNumberOfCurrentPlayers (public host, no key needed)" \
            "https://api.steampowered.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?appid=${APPID}"

          probe "News (partner.steam-api.com) — same key, Partner host" \
            "https://partner.steam-api.com/ISteamNews/GetNewsForApp/v2/?key=${KEY}&appid=${APPID}&count=1"

          echo ""
          echo "── DONE ──"
          REMOTEEOF
