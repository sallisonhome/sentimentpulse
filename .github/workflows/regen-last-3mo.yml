name: Regenerate Last 3 Months (All Games)

# Deletes the last 3 months of monthly_summaries for every game, then runs
# the backfill to regenerate them so they pick up PR #7's tightened word caps
# (25-word actions, 120-word exec, 40-word bold ideas, neutral example labels).
#
# Scope from count-regen workflow (run 26126645642):
#   - 76 monthly summary rows
#   - ~228 Claude calls (3 per row)
#   - ~15-25 minutes wall-clock
#
# Safety:
#   - DELETE is scoped by (period_year, period_month) >= (today - 3 months).
#   - Backfill is idempotent — skips months that already exist after delete.
#   - --max-months-back 4 gives a one-month buffer so a 3-month rolling cap
#     doesn't accidentally regenerate older rows.

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Delete + regenerate
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend
            source .venv/bin/activate

            echo "── 1. Current monthly_summaries count (last 3 months) ──"
            sqlite3 sentimentpulse.db "
              SELECT COUNT(*) AS rows_to_delete FROM monthly_summaries
              WHERE (period_year * 100 + period_month) >=
                    (CAST(strftime('%Y', date('now', '-3 months')) AS INTEGER) * 100 +
                     CAST(strftime('%m', date('now', '-3 months')) AS INTEGER));
            "

            echo ""
            echo "── 2. DELETE last 3 months across all games ──"
            sqlite3 sentimentpulse.db "
              DELETE FROM monthly_summaries
              WHERE (period_year * 100 + period_month) >=
                    (CAST(strftime('%Y', date('now', '-3 months')) AS INTEGER) * 100 +
                     CAST(strftime('%m', date('now', '-3 months')) AS INTEGER));
            "
            echo "Deleted. Verifying:"
            sqlite3 sentimentpulse.db "
              SELECT COUNT(*) AS rows_remaining_last_3mo FROM monthly_summaries
              WHERE (period_year * 100 + period_month) >=
                    (CAST(strftime('%Y', date('now', '-3 months')) AS INTEGER) * 100 +
                     CAST(strftime('%m', date('now', '-3 months')) AS INTEGER));
            "

            echo ""
            echo "── 3. Run backfill (max 4 months back, generates only missing) ──"
            START=$(date +%s)
            python backfill_monthly_summaries.py --max-months-back 4 2>&1 | tail -120
            END=$(date +%s)
            echo ""
            echo "Backfill wall-clock: $((END - START)) seconds"

            echo ""
            echo "── 4. Verify final state ──"
            echo "Monthly summary counts per game (last 3 months only):"
            sqlite3 -header -column sentimentpulse.db "
              SELECT g.name, COUNT(*) AS n
              FROM monthly_summaries ms
              JOIN games g ON g.id = ms.game_id
              WHERE (ms.period_year * 100 + ms.period_month) >=
                    (CAST(strftime('%Y', date('now', '-3 months')) AS INTEGER) * 100 +
                     CAST(strftime('%m', date('now', '-3 months')) AS INTEGER))
              GROUP BY g.id
              ORDER BY n DESC, g.name;
            "

            echo ""
            echo "Sample SnowRunner April 2026 (preview first 200 chars of each field):"
            sqlite3 sentimentpulse.db "
              SELECT
                'EXEC: ' || substr(executive_summary, 1, 200),
                'ACTIONS: ' || substr(recommended_actions, 1, 200),
                'BOLD COUNT: ' || COALESCE(json_array_length(bold_ideas), 0)
              FROM monthly_summaries
              WHERE game_id = (SELECT id FROM games WHERE name='SnowRunner')
                AND period_year=2026 AND period_month=4;
            "

            deactivate
            echo ""
            echo "── REGEN COMPLETE ──"
          EOF
