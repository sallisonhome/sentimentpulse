name: Scan All Games for Poisoned Summaries

# Read-only scan to determine which games beyond John Wick have monthly
# summaries containing topics that the §14 relevance filter would now exclude.
#
# This does NOT delete or modify anything. It produces a per-game count of
# polluted summaries so we can decide whether targeted cleanup is needed.

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Scan
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend

            echo "── Per-game summary count + relevance posture ──"
            echo "(games with distinctive_keywords set have §14 protection going forward)"
            echo ""
            sqlite3 -header -column sentimentpulse.db "
              SELECT
                g.name                                    AS game,
                COUNT(ms.id)                              AS total_summaries,
                CASE WHEN g.distinctive_keywords IS NOT NULL
                          AND g.distinctive_keywords != '[]'
                     THEN json_array_length(g.distinctive_keywords)
                     ELSE 0 END                           AS keywords
              FROM games g
              LEFT JOIN monthly_summaries ms ON ms.game_id = g.id
              WHERE EXISTS (SELECT 1 FROM monthly_summaries WHERE game_id = g.id)
              GROUP BY g.id
              ORDER BY total_summaries DESC;
            "

            echo ""
            echo "── Games with summaries mentioning 'horror' or 'suspense' ──"
            sqlite3 -header -column sentimentpulse.db "
              SELECT g.name, COUNT(*) AS n_summaries
              FROM monthly_summaries ms
              JOIN games g ON g.id = ms.game_id
              WHERE ms.executive_summary LIKE '%horror%'
                 OR ms.executive_summary LIKE '%suspense%'
              GROUP BY g.id
              ORDER BY n_summaries DESC;
            "

            echo ""
            echo "── Games with summaries mentioning 'free to play' or 'F2P' ──"
            sqlite3 -header -column sentimentpulse.db "
              SELECT g.name, COUNT(*) AS n_summaries
              FROM monthly_summaries ms
              JOIN games g ON g.id = ms.game_id
              WHERE ms.executive_summary LIKE '%free to play%'
                 OR ms.executive_summary LIKE '%F2P%'
              GROUP BY g.id
              ORDER BY n_summaries DESC;
            "

            echo ""
            echo "── Topic_trends labels across all games (sample of suspicious labels) ──"
            sqlite3 -header -column sentimentpulse.db "
              SELECT g.name, tt.topic_label, tt.sentiment, tt.mention_count
              FROM topic_trends tt
              JOIN games g ON g.id = tt.game_id
              WHERE LOWER(tt.topic_label) LIKE '%horror%'
                 OR LOWER(tt.topic_label) LIKE '%suspense%'
                 OR LOWER(tt.topic_label) LIKE '%free to play%'
                 OR LOWER(tt.topic_label) LIKE '%f2p%'
              ORDER BY tt.mention_count DESC
              LIMIT 30;
            "

            echo ""
            echo "── Done ──"
          EOF
