name: SP Health Check (post-Reddit-upload)
on:
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read-only native Steam retry probe
        run: |
          set -euo pipefail
          DEST="/tmp/coverage-probe-${GITHUB_RUN_ID}"
          trap 'ssh root@104.236.239.46 "rm -rf $DEST"' EXIT
          ssh root@104.236.239.46 "mkdir -p $DEST/server $DEST/scripts"
          scp signalpulse/server/sales-catalog-steam-http.ts "root@104.236.239.46:$DEST/server/"
          scp signalpulse/scripts/probe-sales-coverage-steam.mts "root@104.236.239.46:$DEST/scripts/"
          ssh root@104.236.239.46 "/opt/sentimentpulse/signalpulse/node_modules/.bin/tsx $DEST/scripts/probe-sales-coverage-steam.mts 1665460,1222670,2592160,2569760,1062090,3624140,3787240,3041230,1943950,4317690,881020,2436940,1913120,1331550,3934270,3393280,3808690,1913370,435150,1368140,2477340,550,4465480,304930,252950"
