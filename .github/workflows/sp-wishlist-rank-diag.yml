name: SP Wishlist Rank Diagnostic (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/signalpulse

            echo "── 1. Service status / uptime ──"
            systemctl is-active signalpulse || true
            systemctl show signalpulse --property=ActiveEnterTimestamp || true

            echo ""
            echo "── 2. Server current date/time ──"
            date
            date -u

            echo ""
            echo "── 3. ALL ingestion/wishlist-rank/cron-scheduler log lines, last 48h ──"
            journalctl -u signalpulse --no-pager --since "-48hours" 2>&1 | grep -iE "ingestion|wishlist rank|cron scheduler|Ingesting Steam Leaderboards" | tail -80 || echo "(no matching log lines in last 48h)"

            echo ""
            echo "── 3b. Every service (re)start / boot line, last 7 days ──"
            journalctl -u signalpulse --no-pager --since "-7days" 2>&1 | grep -iE "Ingestion cron scheduler started|Started signalpulse|signalpulse.service: Deactivated|saber-auth. initialized" || true

            echo ""
            echo "── 4. Any errors in signalpulse log, last 24h ──"
            journalctl -u signalpulse --no-pager --since "-24hours" -p err 2>&1 | tail -60 || true

            echo ""
            echo "── 5. Latest steam_wishlist_rank_daily rows (last 5 days) ──"
            sqlite3 -header -column data.db "SELECT date, COUNT(*) as n FROM steam_wishlist_rank_daily GROUP BY date ORDER BY date DESC LIMIT 5;" || true

            echo ""
            echo "── 6. Full steam_wishlist_rank_daily rows for last 2 days, with created_at ──"
            sqlite3 -header -column data.db "SELECT product_id, date, rank, created_at FROM steam_wishlist_rank_daily WHERE date >= date('now','-1 day') ORDER BY date, product_id;" || true

            echo ""
            echo "── 6b. Server timezone/env check ──"
            timedatectl 2>&1 | head -10 || true
            echo "TZ env var (systemd unit):"
            systemctl show signalpulse --property=Environment || true

            echo ""
            echo "── 7. Last 40 log lines overall (tail) ──"
            journalctl -u signalpulse --no-pager -n 40 || true
          EOF
