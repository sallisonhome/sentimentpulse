name: SP Wishlist Rank Diagnostic (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/signalpulse

            echo "── 1. Service status / uptime ──"
            systemctl is-active signalpulse || true
            systemctl show signalpulse --property=ActiveEnterTimestamp || true

            echo ""
            echo "── 2. Server current date/time ──"
            date
            date -u

            echo ""
            echo "── 3. Ingestion / wishlist-rank cron log lines since midnight ET (04:00 UTC) ──"
            journalctl -u signalpulse --no-pager --since "today 04:00" 2>&1 | grep -iE "ingestion|wishlist rank|cron" || echo "(no matching log lines since 04:00 UTC today)"

            echo ""
            echo "── 4. Any errors in signalpulse log today ──"
            journalctl -u signalpulse --no-pager --since "today 00:00" -p err 2>&1 | tail -60 || true

            echo ""
            echo "── 5. Latest steam_wishlist_rank_daily rows (last 5 days) ──"
            sqlite3 -header -column data.db "SELECT date, COUNT(*) as n FROM steam_wishlist_rank_daily GROUP BY date ORDER BY date DESC LIMIT 5;" || true

            echo ""
            echo "── 6. Latest steam_wishlist_rank_daily raw rows for today ──"
            sqlite3 -header -column data.db "SELECT product_id, date, rank FROM steam_wishlist_rank_daily WHERE date = date('now') ORDER BY product_id LIMIT 20;" || true

            echo ""
            echo "── 7. Last 40 log lines overall (tail) ──"
            journalctl -u signalpulse --no-pager -n 40 || true
          EOF
