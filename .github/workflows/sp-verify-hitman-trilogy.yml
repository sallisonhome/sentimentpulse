name: SP Verify Hitman Trilogy (one-off)

# Direct-DB verification that Hitman Classic Trilogy Remastered was
# added correctly and would appear on the Pre-Release Wishlist Leaderboard.
# Read-only. Deleted after this diagnostic run per cleanup policy.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 'bash -s' << 'REMOTE_EOF'
          set -euo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db

          echo "── Products with steamAppId that qualify for Pre-Release Wishlist Leaderboard ──"
          TODAY=$(date -u +%Y-%m-%d)
          sqlite3 -header -column "$DB" "
            SELECT id, title, publisher, release_date, steam_app_id, is_saber_published
            FROM products
            WHERE is_saber_published=1
              AND steam_app_id IS NOT NULL
              AND (release_date IS NULL OR release_date > '$TODAY')
            ORDER BY id;
          "

          echo ""
          echo "── Hitman wishlist summary computed the way leaderboards does ──"
          # Latest reporting-daily row + sum-so-far (matches getSteamWishlistSummary logic)
          sqlite3 -header -column "$DB" "
            SELECT
              (SELECT MAX(date) FROM steam_wishlist_reporting_daily WHERE product_id=18) AS latest_reporting_date,
              (SELECT SUM(wishlist_adds - wishlist_deletes - wishlist_purchases)
                 FROM steam_wishlist_reporting_daily WHERE product_id=18) AS lifetime_net,
              (SELECT SUM(wishlist_adds)
                 FROM steam_wishlist_reporting_daily
                 WHERE product_id=18 AND date >= date('$TODAY', '-7 days')) AS adds_7d;
          "

          echo ""
          echo "── Announce + Product Page Live milestones (backfilled) ──"
          sqlite3 -header -column "$DB" "
            SELECT id, name, target_date, actual_date, category, sort_order
            FROM pls_milestones
            WHERE product_id=18
            ORDER BY sort_order;
          "
          REMOTE_EOF
