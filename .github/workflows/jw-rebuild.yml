name: John Wick Rebuild (§14+§15 cleanup)

# One-shot workflow:
#   1. Rebuild SentimentRecord.topics + topic_trends for John Wick using
#      §14 relevance filter + §15 critical-mass gate over ALL historical posts.
#   2. Delete the last 6 MonthlySummary rows for John Wick.
#   3. Re-run the backfill to regenerate them with cleaned topic data.
#   4. Print verification output.

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rebuild
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend
            source .venv/bin/activate

            echo "── 1. Rebuild John Wick topics (§14+§15) ──"
            python rebuild_topics_for_game.py "Untitled John Wick Game"

            echo ""
            echo "── 2. Delete last 6 monthly summaries for John Wick ──"
            sqlite3 sentimentpulse.db "DELETE FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') AND (period_year, period_month) IN (SELECT period_year, period_month FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') ORDER BY period_year DESC, period_month DESC LIMIT 6);"
            echo "Remaining JW monthly_summaries:"
            sqlite3 sentimentpulse.db "SELECT period_year, period_month FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') ORDER BY period_year DESC, period_month DESC LIMIT 10;"

            echo ""
            echo "── 3. Re-run backfill (last 6 months) ──"
            python backfill_monthly_summaries.py --max-months-back 6 2>&1 | tail -40

            echo ""
            echo "── 4. Verify John Wick state ──"
            echo "topic_trends sample:"
            sqlite3 sentimentpulse.db "SELECT topic_label, sentiment, mention_count FROM topic_trends WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') ORDER BY mention_count DESC LIMIT 20;"
            echo ""
            echo "Latest monthly summaries:"
            sqlite3 sentimentpulse.db "SELECT period_year, period_month, substr(executive_summary, 1, 200) FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') ORDER BY period_year DESC, period_month DESC LIMIT 6;"
            echo ""
            echo "Banned-word check (should be empty for clean run):"
            sqlite3 sentimentpulse.db "SELECT period_year, period_month FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') AND (executive_summary LIKE '%horror%' OR executive_summary LIKE '%free to play%' OR executive_summary LIKE '%F2P%' OR executive_summary LIKE '%suspense%') ORDER BY period_year DESC, period_month DESC;"

            deactivate
            echo ""
            echo "── REBUILD COMPLETE ──"
          EOF
