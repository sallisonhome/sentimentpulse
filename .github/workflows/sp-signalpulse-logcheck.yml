name: SP SignalPulse Log Check (cron + cookie sales)

on:
  workflow_dispatch:

jobs:
  logcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check cron scheduler + cookie-based sales ingestion logs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail

            echo "== 1. Service status =="
            systemctl is-active signalpulse || true
            systemctl show signalpulse -p ActiveEnterTimestamp || true

            echo ""
            echo "== 2. Cron scheduler start line since last restart =="
            journalctl -u signalpulse --no-pager | grep -i "cron scheduler" | tail -5 || echo "none found"

            echo ""
            echo "== 3. All steam_sales ingestion log lines, last 3 days =="
            journalctl -u signalpulse --no-pager --since "3 days ago" | grep -iE "steam_sales|ingestSteamSales|cookie|session.*steam|steamworks.*session" | tail -80 || echo "none found"

            echo ""
            echo "== 4. Any auth/401/403/expired errors related to steam sales/cookie, last 7 days =="
            journalctl -u signalpulse --no-pager --since "7 days ago" | grep -iE "steam" | grep -iE "401|403|expired|unauthorized|auth.*fail|login" || echo "none found"

            echo ""
            echo "== 5. Last 40 log lines overall =="
            journalctl -u signalpulse --no-pager -n 40 || true
          EOF
