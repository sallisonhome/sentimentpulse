name: SignalPulse — Country daily-window sequential chain

# Auto-fires the next chunk in the 24-month sequential backfill schedule
# when the previous country-daily-window run completes successfully.
#
# Sequence (all authoritative day-mode country ingestion):
#   Chunk 1: 2024-09-01 → 2025-02-28  (kicked off manually)
#   Chunk 2: 2025-03-01 → 2025-08-31  (fires after chunk 1)
#   Chunk 3: 2025-09-01 → 2026-02-28  (fires after chunk 2)
#   Chunk 4: 2026-03-01 → 2026-05-31  (fires after chunk 3)
#
# Decision logic: query the country-daily-window workflow's most recent
# successful runs, pull each's `event.inputs.from_date` +
# `event.inputs.to_date` via the workflow-run details API, find the
# highest `to_date` in our schedule, and fire the next-in-sequence.
# Stops when the last chunk finishes.

on:
  workflow_run:
    workflows: ["SignalPulse — Sales by Country daily window backfill"]
    types: [completed]

jobs:
  fire_next:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide next chunk and fire it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 4-chunk schedule.
          declare -a CHUNK_FROM=("2024-09-01" "2025-03-01" "2025-09-01" "2026-03-01")
          declare -a CHUNK_TO=(  "2025-02-28" "2025-08-31" "2026-02-28" "2026-05-31")

          # Which chunks have already succeeded? Look at the last 20 runs of
          # the country-daily-window workflow and note which (from, to)
          # windows appear as SUCCESS. Inputs live in the event.inputs of
          # each dispatched run; the workflow runs API returns them under
          # .display_title only when set via `name:`, so we fetch the event
          # payload.
          echo "Fetching recent country-daily-window runs..."
          RUNS_JSON=$(gh api "/repos/$REPO/actions/workflows/signalpulse-country-daily-window.yml/runs?per_page=20")

          # Extract [id, conclusion, event.inputs] per run. workflow_dispatch
          # runs put the input map at .inputs on the RunEvent, which the
          # runs API surfaces under .event.inputs is NOT available in this
          # endpoint. But the event that TRIGGERED the run stores its
          # payload at /repos/.../actions/runs/{id}/attempts/1's
          # triggering_actor / raw payload isn't there either. What DOES
          # work: the "workflow_dispatch" event's inputs are recorded on
          # the run object as .display_title? Actually, best is to hit
          # /repos/{repo}/actions/runs/{id} which returns a `.name` and
          # under `.jobs_url` we can grab the inputs from step envs.
          #
          # SIMPLER: our workflow prints "from=YYYY-MM-DD  to=YYYY-MM-DD"
          # in its very first step's tee log. gh run view --log returns
          # that for a completed run.

          # Collect completed-successful runs' (from, to) via log parsing.
          COMPLETED_TO=""
          for run_id in $(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.conclusion=="success") | .id'); do
            LOG=$(gh run view "$run_id" --log 2>/dev/null || echo "")
            F=$(echo "$LOG" | grep -m1 -oE 'from=[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d= -f2 || true)
            T=$(echo "$LOG" | grep -m1 -oE 'to=[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d= -f2 || true)
            if [ -n "$F" ] && [ -n "$T" ]; then
              echo "  Run $run_id succeeded: $F → $T"
              # Track the most recent to_date completion by string sort.
              if [ "$T" \> "$COMPLETED_TO" ]; then
                COMPLETED_TO="$T"
              fi
            fi
          done

          echo "Highest completed to_date in schedule: $COMPLETED_TO"

          # Find the next chunk in the schedule whose from_date is the day
          # AFTER $COMPLETED_TO (or fire chunk 1 if none completed yet).
          NEXT_FROM=""
          NEXT_TO=""
          for i in "${!CHUNK_FROM[@]}"; do
            F="${CHUNK_FROM[$i]}"
            T="${CHUNK_TO[$i]}"
            # A chunk is "next" if it hasn't been completed AND either
            # (a) no chunks have been completed yet, or
            # (b) its from_date > completed_to.
            if [ "$T" \> "$COMPLETED_TO" ]; then
              NEXT_FROM="$F"
              NEXT_TO="$T"
              break
            fi
          done

          if [ -z "$NEXT_FROM" ]; then
            echo "All 4 chunks complete. Chain done."
            exit 0
          fi

          # Guard: don't fire if that exact window is already in-progress.
          IN_PROGRESS=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.status=="in_progress" or .status=="queued") | .id')
          for pid in $IN_PROGRESS; do
            LOG=$(gh run view "$pid" --log 2>/dev/null || echo "")
            F=$(echo "$LOG" | grep -m1 -oE 'from=[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d= -f2 || true)
            T=$(echo "$LOG" | grep -m1 -oE 'to=[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d= -f2 || true)
            if [ "$F" = "$NEXT_FROM" ] && [ "$T" = "$NEXT_TO" ]; then
              echo "Next chunk ($NEXT_FROM → $NEXT_TO) already in progress as run $pid. Skipping."
              exit 0
            fi
          done

          echo "Firing next chunk: $NEXT_FROM → $NEXT_TO"
          gh workflow run signalpulse-country-daily-window.yml \
            -f from_date="$NEXT_FROM" \
            -f to_date="$NEXT_TO" \
            -f dry_run=false \
            --repo "$REPO"
