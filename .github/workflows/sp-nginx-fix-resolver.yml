name: SP Nginx Fix Resolver

# 2026-07-31 — Fix nginx crashing on DNS failure for upstream
# `howmanyareplaying.com`. The Genre Pulse reverse-proxy in
# /etc/nginx/sites-available/sentimentpulse uses `proxy_pass https://howmanyareplaying.com/api/`
# as a bare literal, which forces nginx to resolve DNS at STARTUP.
# A DNS blip crashes the whole vhost — took down all 4 sites on the
# droplet from 06:23 UTC to 12:32 UTC.
#
# Fix:
#   1. Insert a `resolver` directive at the top of the server block so
#      nginx has a nameserver to defer-resolve against.
#   2. Rewrite both `proxy_pass https://howmanyareplaying.com/...` lines
#      to use a variable (`set $upstream_hmap ...; proxy_pass https://$upstream_hmap/...`).
#      Once nginx sees a variable in proxy_pass it defers resolution to
#      request time and gracefully returns a 502 on DNS failure instead
#      of refusing to start.
#
# Safe:
#   * Idempotent — re-running is a no-op if the marker is already present.
#   * Timestamped backup before editing.
#   * `nginx -t` before reload — restore backup on any failure.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Patch nginx config
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail

            CONFIG=/etc/nginx/sites-available/sentimentpulse
            MARKER="# SP-RESOLVER-FIX-2026-07-31"

            echo "── Preflight: config exists ──"
            [ -f "$CONFIG" ] || { echo "ERR: $CONFIG missing"; exit 1; }

            echo ""
            echo "── Idempotency check ──"
            if grep -q "$MARKER" "$CONFIG"; then
              echo "Marker '$MARKER' already present — no-op."
              nginx -t
              exit 0
            fi

            TS=$(date +%s)
            BACKUP="${CONFIG}.bak.${TS}"
            echo ""
            echo "── Backup ──"
            cp "$CONFIG" "$BACKUP"
            echo "Wrote: $BACKUP"

            echo ""
            echo "── Patch ──"
            python3 << 'PY'
import re, pathlib
config_path = pathlib.Path("/etc/nginx/sites-available/sentimentpulse")
text = config_path.read_text()

MARKER = "# SP-RESOLVER-FIX-2026-07-31"

# 1. Inject a resolver directive at the top of the FIRST `server {` block.
#    nginx allows `resolver` in server{} context. Cloudflare + Google DNS,
#    5-minute cache, ipv6 off (the droplet is v4 only).
resolver_block = f"""
    {MARKER}: defer upstream DNS resolution to request time so a DNS blip
    # can't crash the whole vhost. Applies to the proxy_pass directives
    # for howmanyareplaying.com further down. See workflow sp-nginx-fix-resolver.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
"""

# Insert after the first `server {` line
new_text, n = re.subn(
    r"(server\s*\{\s*\n)",
    r"\1" + resolver_block + "\n",
    text,
    count=1,
)
if n != 1:
    raise SystemExit("ERR: could not find a `server {` block to inject resolver into")

# 2. Rewrite the two proxy_pass lines to use a variable.
#    Before: proxy_pass https://howmanyareplaying.com/api/;
#    After : set $sp_upstream_hmap "howmanyareplaying.com";
#            proxy_pass https://$sp_upstream_hmap/api/;
def rewrite_proxy_pass(match):
    indent = match.group(1)
    path   = match.group(2)  # e.g. "/api/" or "/api/platform-mix/"
    return (
        f"{indent}set $sp_upstream_hmap \"howmanyareplaying.com\";\n"
        f"{indent}proxy_pass https://$sp_upstream_hmap{path};"
    )

new_text, m = re.subn(
    r"^(\s*)proxy_pass\s+https://howmanyareplaying\.com(/[^;\s]*);",
    rewrite_proxy_pass,
    new_text,
    flags=re.MULTILINE,
)
if m != 2:
    raise SystemExit(
        f"ERR: expected exactly 2 proxy_pass rewrites, got {m}. "
        "Config drift — aborting so we don't half-patch."
    )

config_path.write_text(new_text)
print(f"Patched: injected 1 resolver block, rewrote {m} proxy_pass directives.")
PY

            echo ""
            echo "── nginx -t (validate patched config) ──"
            if ! nginx -t; then
              echo "!!! nginx -t FAILED — restoring backup"
              cp "$BACKUP" "$CONFIG"
              nginx -t
              exit 1
            fi

            echo ""
            echo "── nginx -s reload (graceful) ──"
            systemctl reload nginx

            echo ""
            echo "── Verify: still active + still listening ──"
            systemctl is-active nginx
            ss -tlnp 2>/dev/null | grep ':80 ' || { echo "!!! nothing on :80 after reload"; exit 1; }

            echo ""
            echo "── Loopback smoke: sentimentpulse API + the Genre Pulse proxy path ──"
            for path in "/api/ingest/status" "/genrepulse/api/wishlist?limit=1"; do
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "http://127.0.0.1${path}" || echo "000")
              echo "  127.0.0.1${path} -> ${CODE}"
            done

            echo ""
            echo "── Diff summary ──"
            diff -u "$BACKUP" "$CONFIG" | head -60 || true

            echo ""
            echo "── DONE ──"
          EOF
