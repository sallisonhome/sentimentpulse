name: SP Verify State 2 (one-off, read-only)

"on":
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "=== SnowRunner genre (for comparison) ==="
          sqlite3 "$DB" "SELECT id, title, genre FROM products WHERE title LIKE '%SnowRunner%';"
          echo "=== RoadCraft (id=19) ==="
          sqlite3 "$DB" "SELECT id, title, genre, steam_header_image_url, player_format FROM products WHERE id=19;"
          echo "=== Road Kings (id=20) ==="
          sqlite3 "$DB" "SELECT id, title, genre, steam_header_image_url, player_format, release_date FROM products WHERE id=20;"
          echo "=== RoadCraft sales row count ==="
          sqlite3 "$DB" "SELECT COUNT(*), MIN(date), MAX(date) FROM steam_sales_daily WHERE product_id=19;"
          echo "=== Road Kings wishlist row count ==="
          sqlite3 "$DB" "SELECT COUNT(*), MIN(date), MAX(date) FROM steam_wishlist_daily WHERE product_id=20;"
          echo "=== RoadCraft PLS milestones ==="
          sqlite3 -header -column "$DB" "SELECT id, category, name, target_date, actual_date, is_default, sort_order FROM pls_milestones WHERE product_id=19 AND deleted_at IS NULL ORDER BY sort_order;"
          echo "=== Road Kings PLS milestones ==="
          sqlite3 -header -column "$DB" "SELECT id, category, name, target_date, actual_date, is_default, sort_order FROM pls_milestones WHERE product_id=20 AND deleted_at IS NULL ORDER BY sort_order;"
          REMOTEEOF
