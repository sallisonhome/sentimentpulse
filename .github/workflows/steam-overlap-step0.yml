name: Steam overlap pilot - step 0 feasibility (read-only)

# Read-only. Reads steam_api_key from signalpulse's app_settings on the droplet (Steam Web API keys are free,
# self-issued and explicitly non-confidential per CLAUDE.md; this workflow still never prints the key).
# For each app id: store name/release status, community-group size, and on a random sample of group members the
# share with public profiles and public game details. Prints aggregates only; no Steam IDs are printed or stored.
# No database writes. Trigger: workflow_dispatch only.

"on":
  workflow_dispatch:
    inputs:
      appids:
        description: 'Comma-separated Steam app ids'
        required: true
        default: '1551980,5184670,3764200'
      sample:
        description: 'Profiles to probe per app (max 300)'
        required: true
        default: '200'

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  step0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run step 0
        env:
          APPIDS: ${{ inputs.appids }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          set -e
          case "$APPIDS" in *[!0-9,]*|'') echo "bad appids"; exit 1;; esac
          case "$SAMPLE" in *[!0-9]*|'') echo "bad sample"; exit 1;; esac
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 \
              APPIDS="$APPIDS" SAMPLE="$SAMPLE" bash -s <<'REMOTEEOF'
          set -uo pipefail
          KEY=$(sqlite3 /opt/sentimentpulse/signalpulse/data.db "SELECT value FROM app_settings WHERE key='steam_api_key';" 2>/dev/null || true)
          if [ -z "${KEY:-}" ]; then echo "ERROR: no steam_api_key in app_settings"; exit 1; fi
          echo "key_present true (${#KEY} chars)"
          STEAM_KEY="$KEY" python3 - <<'PY'
          import os, re, json, time, random, urllib.request, urllib.error
          KEY = os.environ["STEAM_KEY"]
          SAMPLE = min(300, int(os.environ["SAMPLE"]))
          UA = {"User-Agent": "Mozilla/5.0"}
          def get(url, timeout=30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return 0, ""
          for appid in [a for a in os.environ["APPIDS"].split(",") if a]:
              print("=" * 50, "app", appid)
              s, body = get(f"https://store.steampowered.com/api/appdetails?appids={appid}")
              try:
                  x = json.loads(body)[appid]["data"]
                  print("name", x.get("name"), "| coming_soon", x.get("release_date", {}).get("coming_soon"), "| demos", json.dumps(x.get("demos", [])))
              except Exception:
                  print("appdetails_http", s)
              ids = []
              total = None; pages = None
              s, xml = get(f"https://steamcommunity.com/games/{appid}/memberslistxml/?xml=1")
              print("group_http", s)
              if s == 200:
                  m = re.search(r"<memberCount>(\d+)</memberCount>", xml)
                  p = re.search(r"<totalPages>(\d+)</totalPages>", xml)
                  total = int(m.group(1)) if m else None
                  pages = int(p.group(1)) if p else 1
                  print("group_memberCount", total, "| totalPages", pages)
                  ids = re.findall(r"<steamID64>(\d+)</steamID64>", xml)
                  # random pages for an unbiased sample
                  if pages and pages > 1:
                      for pg in random.sample(range(2, pages + 1), min(4, pages - 1)):
                          time.sleep(1)
                          s2, x2 = get(f"https://steamcommunity.com/games/{appid}/memberslistxml/?xml=1&p={pg}")
                          if s2 == 200:
                              ids += re.findall(r"<steamID64>(\d+)</steamID64>", x2)
                          else:
                              print("page_http", s2)
              print("ids_collected", len(ids))
              if not ids:
                  print("cannot continue (no ids)")
                  continue
              random.shuffle(ids)
              pick = ids[:SAMPLE]
              pub = []; states = {}
              for i in range(0, len(pick), 100):
                  b = pick[i:i + 100]
                  s, body = get(f"https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v2/?key={KEY}&steamids={','.join(b)}")
                  if s != 200:
                      print("summaries_http", s); break
                  for pl in json.loads(body)["response"]["players"]:
                      v = pl.get("communityvisibilitystate")
                      states[v] = states.get(v, 0) + 1
                      if v == 3: pub.append(pl["steamid"])
                  time.sleep(0.5)
              print("probed", len(pick), "visibility_states", json.dumps(states), "public_profiles", len(pub))
              with_games = 0; ng = []; http = {}
              for sid in pub:
                  s, body = get(f"https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key={KEY}&steamid={sid}&include_played_free_games=1")
                  http[s] = http.get(s, 0) + 1
                  if s == 200:
                      g = json.loads(body).get("response", {})
                      if isinstance(g.get("game_count"), int):
                          with_games += 1; ng.append(g["game_count"])
                  time.sleep(0.5)
              ng.sort()
              print("owned_games_http", json.dumps(http), "public_with_game_details", with_games, "of", len(pub), "median_games", ng[len(ng)//2] if ng else None)
              print("usable_rate_of_probed", round(with_games / len(pick), 3) if pick else None)
          PY
          REMOTEEOF
