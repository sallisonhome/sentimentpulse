name: SP Audit pre-release wishlist eligibility gate (one-off, read-only)

"on":
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Audit
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "=== All products with steam_app_id: id, title, saber_published, release_date, prepurchase_actual ==="
          sqlite3 -header -column "$DB" "
            SELECT p.id, p.title, p.is_saber_published, p.release_date,
                   (SELECT actual_date FROM pls_milestones m WHERE m.product_id = p.id AND m.name = 'Prepurchase Start' AND m.deleted_at IS NULL) AS prepurchase_actual
            FROM products p
            WHERE p.steam_app_id IS NOT NULL
            ORDER BY p.id;
          "
          echo "=== Today (server clock) ==="
          date -u +%Y-%m-%d
          REMOTEEOF
