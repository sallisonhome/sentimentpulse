name: SignalPulse - Correct Samson Xbox LTD state (dry run by default)

# Lowers title_ltd_state for Samson - A Tyndalston Story (Xbox, 11202) to the largest capped window value,
# then reruns the estimator. apply=false prints the decision only. apply=true backs up data.db first.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true to write; anything else is a dry run'
        required: false
        default: 'false'

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Correct and verify
        env:
          APPLY_INPUT: ${{ github.event.inputs.apply }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 APPLY_INPUT="$APPLY_INPUT" bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"
          [ -f scripts/correct-ltd-state-2026-10-03-samson-xbox.ts ] || { echo "ERR: script missing, deploy first"; exit 1; }
          if [ -f /etc/signalpulse/env ]; then set -a; . /etc/signalpulse/env; set +a; fi
          export NODE_ENV="${NODE_ENV:-production}"
          if [ "$APPLY_INPUT" = "true" ]; then
            mkdir -p /opt/sentimentpulse/backups
            sqlite3 data.db ".backup '/opt/sentimentpulse/backups/data.pre-samson-ltd-$(date +%s).db'"
            APPLY=1 timeout 120 ./node_modules/.bin/tsx scripts/correct-ltd-state-2026-10-03-samson-xbox.ts
            LTD_ACCUMULATOR_ENABLED=$(systemctl show -p Environment signalpulse | tr ' ' '\n' | grep '^LTD_ACCUMULATOR_ENABLED=' | cut -d= -f2 || echo "")
            LTD_ACCUMULATOR_ENABLED="$LTD_ACCUMULATOR_ENABLED" timeout 600 ./node_modules/.bin/tsx scripts/estimate-console-units.ts | tail -15
          else
            timeout 120 ./node_modules/.bin/tsx scripts/correct-ltd-state-2026-10-03-samson-xbox.ts
          fi
          curl -sS "http://127.0.0.1:5000/signal/api/console/titles/11202" | jq '.windowKpisPerPlatform[0]|{unitsMid,revenueMidUsd,method,asOfDate}'
          REMOTE
