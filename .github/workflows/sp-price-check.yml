name: SP Price Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check target_retail_price_usd for all products
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db
            echo "── products.target_retail_price_usd (all rows) ──"
            sqlite3 "$DB" "SELECT id, title, target_retail_price_usd, is_saber_published, release_date FROM products ORDER BY id;"
            echo ""
            echo "── rows with NULL or 0 price ──"
            sqlite3 "$DB" "SELECT id, title FROM products WHERE target_retail_price_usd IS NULL OR target_retail_price_usd = 0;"
          EOF
