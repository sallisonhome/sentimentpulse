name: SP Diagnostic - Wishlist 7d Adds Data Coverage Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query wishlist reporting coverage for wishlist-board titles
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db

            echo "-- Products on the wishlist leaderboard (pre-release Saber titles) --"
            sqlite3 -header -column "$DB" "SELECT id, title, steam_app_id, release_date FROM products WHERE id IN (5,6,7,11,12);"

            echo ""
            echo "-- Row count + date range per product in steam_wishlist_reporting_daily --"
            sqlite3 -header -column "$DB" "
              SELECT product_id, COUNT(*) AS rows, MIN(date) AS earliest, MAX(date) AS latest
              FROM steam_wishlist_reporting_daily
              WHERE product_id IN (5,6,7,11,12)
              GROUP BY product_id;
            "

            echo ""
            echo "-- Last 10 days of raw rows per product (to inspect gaps) --"
            for pid in 5 6 7 11 12; do
              echo "product_id=$pid"
              sqlite3 -header -column "$DB" "
                SELECT date, wishlist_adds, wishlist_deletes, wishlist_purchases, source
                FROM steam_wishlist_reporting_daily
                WHERE product_id=$pid
                ORDER BY date DESC LIMIT 10;
              "
              echo ""
            done
          EOF
