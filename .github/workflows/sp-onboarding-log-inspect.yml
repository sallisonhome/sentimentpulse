name: SP Onboarding Log Inspect (one-off)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            echo "── Onboarding backfill activity in the last 3 hours ──"
            journalctl -u sentimentpulse --no-pager --since "3 hours ago" \
              | grep -E "Scheduled onboarding|Onboarding backfill DONE|Onboarding backfill CRASHED|_ONBOARDING_INFLIGHT" \
              | tail -50 || true
            echo ""
            echo "── Any exceptions / tracebacks in the last 3 hours ──"
            journalctl -u sentimentpulse --no-pager --since "3 hours ago" \
              | grep -iE "traceback|exception|error" \
              | grep -v "arctic_shift HTTP 422" \
              | grep -v "arctic_shift HTTP 429" \
              | tail -30 || true
          EOF
