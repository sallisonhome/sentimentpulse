name: SP Warmup Traceback (one-shot diagnostic)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull traceback + latest cache/warmup logs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            echo "── Trigger a fresh warmup so a traceback lands in the journal ──"
            curl -sS -X POST http://127.0.0.1:8000/api/games/dashboard/warmup -o /tmp/w.out -w "HTTP %{http_code}\n" || true
            head -c 400 /tmp/w.out || true
            echo ""
            echo ""
            sleep 2
            echo "── Journal — last 200 lines from sentimentpulse.service ──"
            journalctl -u sentimentpulse --no-pager -n 200 | tail -120
          EOF
