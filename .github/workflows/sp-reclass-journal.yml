name: SP Reclass Journal
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Journal
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 bash -s << 'REMOTE'
            echo "── recent reclass INFO/ERROR events ──"
            journalctl -u sentimentpulse --since "5 hours ago" --no-pager | grep -iE "reclassif|reclass|flipped|steam_hardrule|170004|170,004|165|168|169" | tail -60
            echo ""
            echo "── last 40 restarts / startups ──"
            journalctl -u sentimentpulse --since "5 hours ago" --no-pager | grep -iE "Started|Stopping|Stopped|Booting|reclassif.*completed|reclassif.*started|db=|reddit_comment" | tail -60
          REMOTE
