name: SP TikTok Catchup (fast)

# Fast, standalone TikTok comment import into SentimentPulse.
# Mirrors the YouTube catch-up pattern: idempotent, seconds-fast,
# only runs the TikTok import step for the specified titles.
# No full ingest required — this is the efficient iterative path.

on:
  workflow_dispatch:
    inputs:
      game_ids:
        description: 'Comma-separated SentimentPulse game IDs (default: 6 core titles)'
        required: false
        default: '20,21,23,24,27,36'

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run TikTok catch-up
        env:
          GAME_IDS: ${{ github.event.inputs.game_ids || '20,21,23,24,27,36' }}
        run: |
          set -euo pipefail
          case "$GAME_IDS" in *[!0-9,]*|'') echo "Invalid game IDs"; exit 2;; esac
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@104.236.239.46 "GAME_IDS=$GAME_IDS bash -s" <<'REMOTE'
          set -euo pipefail
          exec 9>/run/lock/signalpulse-maintenance.lock
          flock -w 600 9 || { echo "Maintenance busy; no catch-up performed"; exit 75; }
          cd /opt/sentimentpulse/backend
          .venv/bin/python scripts/catchup_tiktok.py --game-ids "$GAME_IDS" \
            --max-pages 200 --max-seconds 180
          REMOTE
