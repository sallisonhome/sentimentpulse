name: Deploy SignalPulse

# Signalpulse-only deploy (2026-08-11).
#
# Signalpulse lives inside the sentimentpulse monorepo at signalpulse/, but
# it's an independent Node app with its own service unit. Before this
# workflow, signalpulse's rebuild was bundled into the main sentimentpulse
# deploy.yml, so a single-line signalpulse fix triggered a full
# sentimentpulse+gtmstudio+triptracker+signalpulse deploy (5–10 min).
#
# This workflow triggers only when files under signalpulse/ change, pulls
# main, npm install + build INSIDE signalpulse/, touches its index.html
# for cache-busting, and restarts signalpulse.service only. Total runtime
# ~90s.
#
# Concurrency: shares the 'deploy-droplet' group with deploy.yml so if
# both trigger (a push that touches signalpulse/ AND another app), they
# serialize instead of racing npm installs on the shared filesystem.
#
# Required secrets (already configured on the sentimentpulse repo):
#   DROPLET_SSH_KEY — ed25519 private key whose pubkey is in
#                     /root/.ssh/authorized_keys on the droplet.
#
# Also: deploy.yml adds paths-ignore: ['signalpulse/**'] so a
# signalpulse-only push doesn't fire the big deploy anymore. When a PR
# touches signalpulse AND something else, both workflows fire; the
# concurrency group serializes them (signalpulse first, main second, or
# vice versa depending on queue order).

"on":
  push:
    branches: [main]
    paths:
      - 'signalpulse/**'
      - '.github/workflows/signalpulse-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, build, restart signalpulse on droplet
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -euo pipefail

          REPO_DIR=/opt/sentimentpulse
          SIGNALPULSE_DIR="${REPO_DIR}/signalpulse"

          echo "== Preflight =="
          [ -d "$SIGNALPULSE_DIR" ] || { echo "ERR: $SIGNALPULSE_DIR missing"; exit 1; }
          [ -f "$SIGNALPULSE_DIR/package.json" ] || { echo "ERR: signalpulse/package.json missing"; exit 1; }

          echo ""
          echo "== HEAD before pull =="
          cd "$REPO_DIR"
          git log --oneline -1

          echo ""
          echo "== git pull =="
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "HEAD now: $(git log --oneline -1)"

          echo ""
          echo "== npm install (signalpulse) =="
          cd "$SIGNALPULSE_DIR"
          npm install --no-audit --no-fund

          echo ""
          echo "== npm run build =="
          npm run build

          echo ""
          echo "== Cache-bust: touch dist/public/index.html =="
          # Match the same cache-bust the main deploy does. If the SPA
          # index moves in a future signalpulse version, this becomes a
          # no-op (touch failure is not fatal).
          for html in "${SIGNALPULSE_DIR}/dist/public/index.html"; do
            if [ -f "$html" ]; then
              touch "$html" && echo "touched $html"
            else
              echo "skip (missing): $html"
            fi
          done

          echo ""
          echo "== Ensure /etc/signalpulse/env has saber-auth vars =="
          # Phase 2 (2026-08-13): SignalPulse now reads SABER_AUTH_JWT_SECRET
          # and AUTH_MODE from /etc/signalpulse/env. We reuse the JWT_SECRET
          # from /etc/saber-auth/env so both services agree.
          mkdir -p /etc/signalpulse
          if [ ! -f /etc/signalpulse/env ]; then
            echo "AUTH_MODE=both" > /etc/signalpulse/env
            chmod 600 /etc/signalpulse/env
            echo "created /etc/signalpulse/env (AUTH_MODE=both)"
          fi
          # Copy JWT_SECRET from saber-auth if not already present here.
          # saber-auth stores its env at /opt/saber-auth/.env (per its
          # deploy/saber-auth.service unit, EnvironmentFile=/opt/saber-auth/.env).
          if ! grep -q '^SABER_AUTH_JWT_SECRET=' /etc/signalpulse/env; then
            SABER_ENV=""
            for candidate in /opt/saber-auth/.env /etc/saber-auth/env; do
              if [ -f "$candidate" ] && grep -q '^JWT_SECRET=' "$candidate"; then
                SABER_ENV="$candidate"; break
              fi
            done
            if [ -n "$SABER_ENV" ]; then
              SECRET=$(grep '^JWT_SECRET=' "$SABER_ENV" | head -1 | cut -d= -f2-)
              echo "SABER_AUTH_JWT_SECRET=${SECRET}" >> /etc/signalpulse/env
              chmod 600 /etc/signalpulse/env
              echo "copied SABER_AUTH_JWT_SECRET from ${SABER_ENV}"
            else
              echo "WARN: no saber-auth env file with JWT_SECRET found in \
                   /opt/saber-auth/.env or /etc/saber-auth/env — signalpulse \
                   will start in advisory-only mode (no session validation)."
            fi
          else
            echo "SABER_AUTH_JWT_SECRET already present in /etc/signalpulse/env"
          fi
          # Show non-secret vars for debugging (mask the JWT).
          echo "env contents (JWT masked):"
          sed 's/^\(SABER_AUTH_JWT_SECRET=\).*/\1***MASKED***/' /etc/signalpulse/env

          echo ""
          echo "== Ensure signalpulse.service reads /etc/signalpulse/env =="
          UNIT=/etc/systemd/system/signalpulse.service
          if [ -f "$UNIT" ] && ! grep -q '^EnvironmentFile=-/etc/signalpulse/env' "$UNIT"; then
            # Insert EnvironmentFile line right after the existing Environment= line.
            sed -i '/^Environment="NODE_ENV=production"/a EnvironmentFile=-/etc/signalpulse/env' "$UNIT"
            systemctl daemon-reload
            echo "patched signalpulse.service to load /etc/signalpulse/env"
          else
            echo "signalpulse.service already loads /etc/signalpulse/env (or unit missing)"
          fi

          echo ""
          echo "== Restart signalpulse.service =="
          installed_units=$(systemctl list-unit-files --type=service --no-legend | awk '{print $1}')
          if echo "$installed_units" | grep -qx "signalpulse.service"; then
            systemctl restart signalpulse
            sleep 3
            if systemctl is-active --quiet signalpulse; then
              echo "signalpulse: active"
            else
              echo "signalpulse: FAILED"
              systemctl status signalpulse --no-pager -n 30 || true
              exit 1
            fi
          else
            echo "ERR: signalpulse.service not installed on this droplet"
            exit 1
          fi

          echo ""
          echo "== Loopback smoke test =="
          # signalpulse listens on 5000 per the nginx proxy config.
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 \
              http://127.0.0.1:5000/api/settings || echo "000")
          echo "127.0.0.1:5000/api/settings -> ${CODE}"
          if [ "$CODE" = "000" ]; then
            echo "ERR: signalpulse not responding on :5000 after restart"
            exit 1
          fi

          echo ""
          echo "== Phase 2 saber-auth smoke tests =="
          echo "-- /api/health (must be 200 JSON):"
          curl -sS --max-time 5 http://127.0.0.1:5000/api/health || echo "HEALTH ERR"
          echo ""
          echo "-- /api/config (must include authMode, authReady):"
          curl -sS --max-time 5 http://127.0.0.1:5000/api/config || echo "CONFIG ERR"
          echo ""
          echo "-- confirm AUTH_MODE in effect matches env file:"
          MODE_ENV=$(grep '^AUTH_MODE=' /etc/signalpulse/env | cut -d= -f2- || echo 'both')
          MODE_RUN=$(curl -sS --max-time 5 http://127.0.0.1:5000/api/config \
            | grep -o '"authMode":"[^"]*"' | cut -d'"' -f4 || echo unknown)
          echo "env AUTH_MODE=${MODE_ENV}   runtime authMode=${MODE_RUN}"
          if [ "$MODE_ENV" != "$MODE_RUN" ]; then
            echo "ERR: AUTH_MODE env (${MODE_ENV}) does not match runtime (${MODE_RUN})"
            exit 1
          fi
          READY=$(curl -sS --max-time 5 http://127.0.0.1:5000/api/config \
            | grep -o '"authReady":[a-z]*' | cut -d: -f2 || echo unknown)
          echo "authReady=${READY} (true means SABER_AUTH_JWT_SECRET is loaded)"
          if [ "$READY" != "true" ] && [ "$MODE_ENV" != "legacy" ]; then
            echo "WARN: authReady=false — sessions cannot be validated. Check /etc/signalpulse/env."
          fi

          echo ""
          echo "== DONE =="
          # (External smoke test via nginx removed 2026-08-11 — curl to
          # 127.0.0.1 without a Host header hits a different server
          # block than /signal/ traffic, producing false 404s. The
          # loopback :5000 test above is sufficient to verify the app
          # is running post-restart.)
          REMOTEEOF
