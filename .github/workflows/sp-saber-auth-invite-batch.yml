name: sp-saber-auth-invite-batch
on: workflow_dispatch
jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH invite
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

          # Write the invite script locally, then scp + run
          cat > /tmp/invite-batch.js << 'JS'
          /**
           * One-off: create 9 saber-auth invites without sending saber-auth's
           * built-in invite email. We'll send a custom deadline email from
           * the SignalPulse Resend account separately.
           *
           * Duplicates the logic of routes/admin.js POST /admin/invite,
           * minus the sendEmail() call.
           */
          'use strict';

          const path = require('path');
          const crypto = require('crypto');

          // Load saber-auth internals
          process.chdir('/opt/saber-auth');
          const { getDb } = require('./server/db/schema');
          const { INVITE_EXPIRY_DAYS, KNOWN_SCOPES } = require('./server/constants');

          const RECIPIENTS = [
            'steve.allison.home@gmail.com',
            'iones@saber3d.com',
            'karch@saber3d.com',
            'cwade@saber3d.com',
            'krupkin@saber3d.com',
            'twillits@saber3d.com',
            'jburnham@saber3d.com',
            'jortmann@saber3d.com',
            'snorton@saber3d.com',
          ];
          const SCOPES = ['signalpulse', 'sentimentpulse', 'triptracker', 'genrepulse', 'gtm', 'launcher'];
          const BASE_URL = process.env.BASE_URL || 'http://104.236.239.46';

          // Verify scopes against constants
          for (const s of SCOPES) {
            if (!KNOWN_SCOPES.includes(s)) {
              console.error(`Unknown scope: ${s}`);
              process.exit(1);
            }
          }

          // Find bootstrap admin user for created_by
          const db = getDb();
          const admin = db.prepare("SELECT id, email FROM users WHERE is_admin = 1 ORDER BY created_at ASC LIMIT 1").get();
          if (!admin) {
            console.error('No admin user found');
            process.exit(1);
          }
          console.log(`created_by admin: ${admin.email} (${admin.id})`);

          const results = [];
          for (const email of RECIPIENTS) {
            try {
              const existing = db.prepare('SELECT id, status FROM users WHERE LOWER(email) = LOWER(?)').get(email);
              if (existing && existing.status !== 'revoked') {
                results.push({ email, ok: false, error: `already ${existing.status}`, userId: existing.id });
                continue;
              }
              const userId = existing?.id || crypto.randomUUID();
              const rawToken = crypto.randomBytes(32).toString('hex');
              const tokenHash = crypto.createHash('sha256').update(rawToken).digest('hex');
              const expiresAt = new Date(Date.now() + INVITE_EXPIRY_DAYS * 86400 * 1000).toISOString();

              const tx = db.transaction(() => {
                if (existing) {
                  db.prepare(`
                    UPDATE users SET status = 'invited', scopes = ?, is_admin = 0,
                                     revoked_at = NULL, token_version = token_version + 1
                    WHERE id = ?
                  `).run(JSON.stringify(SCOPES), userId);
                } else {
                  db.prepare(`
                    INSERT INTO users (id, email, display_name, status, scopes, is_admin)
                    VALUES (?, ?, ?, 'invited', ?, 0)
                  `).run(userId, email, null, JSON.stringify(SCOPES));
                }
                db.prepare(`
                  INSERT INTO invites (id, user_id, token_hash, created_by, expires_at)
                  VALUES (?, ?, ?, ?, ?)
                `).run(crypto.randomUUID(), userId, tokenHash, admin.id, expiresAt);

                db.prepare(`
                  INSERT INTO audit_log (id, actor_id, action, target_id, details)
                  VALUES (?, ?, 'invite', ?, ?)
                `).run(crypto.randomUUID(), admin.id, userId, JSON.stringify({ email, scopes: SCOPES, isAdmin: false, source: 'batch-onboard-2026-08-13' }));
              });
              tx();

              const acceptUrl = `${BASE_URL}/auth/accept-invite.html?token=${rawToken}`;
              results.push({ email, ok: true, userId, acceptUrl, expiresAt });
            } catch (err) {
              results.push({ email, ok: false, error: err.message });
            }
          }

          console.log('\n=== INVITE RESULTS (JSON) ===');
          console.log(JSON.stringify(results, null, 2));
          console.log('=== END INVITE RESULTS ===\n');

          const okCount = results.filter(r => r.ok).length;
          console.log(`Successful invites: ${okCount}/${RECIPIENTS.length}`);
          JS

          scp -i ~/.ssh/id_ed25519 /tmp/invite-batch.js root@104.236.239.46:/tmp/invite-batch.js
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 'cd /opt/saber-auth && node /tmp/invite-batch.js && rm /tmp/invite-batch.js'
