name: Approved demo review priority September 28
on:
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [inspect, backup, verify, backfill, report]
      expected_sha:
        required: false
        default: ""
concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Validate review priority guardrails
        run: node --test .github/scripts/demo-review-priority.test.cjs
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts
      - name: Approved operation
        env:
          PHASE: ${{ inputs.phase }}
          EXPECTED: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$PHASE" in inspect|backup|verify|backfill|report) ;; *) exit 1;; esac
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p out
          scp .github/scripts/demo-history-rollout.cjs .github/scripts/demo-history-bounded.cjs .github/scripts/demo-history-resume.mts .github/scripts/demo-review-priority.cjs root@104.236.239.46:/tmp/
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 root@104.236.239.46 \
            "exec 9>/run/lock/signalpulse-maintenance.lock; flock -w 300 9 || exit 75; cd /opt/sentimentpulse/signalpulse; set -a; . /etc/signalpulse/env; set +a; node /tmp/demo-history-rollout.cjs '$PHASE' '$EXPECTED'" \
            | tee out/summary.jsonl
          if [ "$PHASE" = backfill ] || [ "$PHASE" = report ]; then
            scp root@104.236.239.46:/tmp/demo-review-priority-sep28-coverage.json out/coverage.json
            scp root@104.236.239.46:/tmp/demo-review-priority-sep28-before.json out/before.json
          fi
          if [ "$PHASE" = backup ]; then
            scp root@104.236.239.46:/tmp/demo-review-priority-sep28-before.json out/before.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-review-priority-${{ inputs.phase }}-${{ github.run_id }}
          path: out/
          retention-days: 14
