name: SP Add Hitman Classic Trilogy Remastered

# One-off workflow that adds "Hitman Classic Trilogy Remastered" (Saber x IOI,
# AppID 4716160) to SignalPulse.
#
# Under AUTH_MODE=saber, POST /api/products isn't reachable from an
# unattended workflow (no browser session, and /api/products isn't in the
# OPS_TOKEN_PATHS allowlist). So this workflow does everything by direct
# SQLite writes to /opt/sentimentpulse/signalpulse/data.db — the same
# pattern the Twisted Tower PLS insert workflow used.
#
# Sequence (on the droplet):
#   0. Guard against active ingestion runs.
#   1. INSERT into products.
#   2. INSERT the default PLS milestones (mirrors pls-generator.ts).
#   3. Backfill Announce + Product Page Live actualDate = 2026-06-05 (IOI
#      Showcase reveal at Summer Game Fest 2026; Steam page live same day).
#   4. Read steam_api_key from app_settings; loop yesterday-back-to-app_min_date
#      calling Steam's IPartnerFinancialsService/GetAppWishlistReporting at
#      1 req/sec; INSERT rows into steam_wishlist_reporting_daily; compute
#      and INSERT running cumulative into steam_wishlist_daily.
#   5. Verify final leaderboard/product state.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Add product + backfill
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 'bash -s' << 'REMOTE_EOF'
          set -euo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          API=http://127.0.0.1:5000
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d)

          echo "── 0. Sanity ──"
          test -f "$DB" || { echo "ERR: DB not at $DB"; exit 1; }
          curl -sS "$API/api/health" | head -c 200; echo ""

          echo ""
          echo "── 0a. Already-present guard ──"
          COUNT=$(sqlite3 "$DB" "SELECT COUNT(*) FROM products WHERE steam_app_id='4716160' OR title LIKE '%Hitman Classic Trilogy%';")
          if [ "$COUNT" != "0" ]; then
            echo "ERR: Hitman Classic Trilogy already exists in products (count=$COUNT) — abort."
            exit 1
          fi

          echo ""
          echo "── 1. INSERT products row ──"
          sqlite3 "$DB" <<SQL
          INSERT INTO products (
            title, publisher, is_saber_published, platforms, player_format,
            genre, release_date, target_retail_price_usd, per_platform_pricing,
            steam_app_id, steam_header_image_url, forecast_mode,
            created_at, updated_at
          ) VALUES (
            'Hitman Classic Trilogy Remastered',
            'Saber Interactive',
            1,
            '["PC (Steam)","PS5","Xbox","Switch 2"]',
            'single_player',
            'Action Adventure',
            '2027-09-14',
            29.99,
            NULL,
            '4716160',
            NULL,
            'auto_generate',
            '$NOW',
            '$NOW'
          );
          SQL
          PRODUCT_ID=$(sqlite3 "$DB" "SELECT id FROM products WHERE steam_app_id='4716160';")
          echo "Created product id=$PRODUCT_ID"

          echo ""
          echo "── 2. INSERT default PLS milestones (mirrors pls-generator.ts) ──"
          # Anchor: release_date 2027-09-14. Offsets in months/weeks per Section 4.1-4.4.
          #   Announce, Product Page Live: release − 12mo → 2026-09-14
          #   Prepurchase Start:            release − 3mo  → 2027-06-14
          #   First Teaser:                 release − 12mo → 2026-09-14
          #   Official Trailer 1:           release − 6mo  → 2027-03-14
          #   Launch Trailer:               release − 2wk  → 2027-08-31
          # Single-player title: no beta/demo/multiplayer milestones from the
          # generator (per README of pls-generator, those are for multiplayer/co-op).
          # promotion + press_coverage categories in the generator are pre-seeded
          # with generic entries at release-anchored dates. We insert the core
          # + video milestones the generator would produce, mark Announce +
          # Product Page Live with actualDate = 2026-06-05 (SGF 2026 reveal /
          # Steam page live).
          sqlite3 "$DB" <<SQL
          INSERT INTO pls_milestones (product_id, category, name, target_date, actual_date, is_default, sort_order, created_at, updated_at) VALUES
            ($PRODUCT_ID, 'core',  'Announce',                              '2026-09-14', '2026-06-05', 1, 1,  '$NOW', '$NOW'),
            ($PRODUCT_ID, 'core',  'Product Page Live',                     '2026-09-14', '2026-06-05', 1, 2,  '$NOW', '$NOW'),
            ($PRODUCT_ID, 'core',  'Prepurchase Start',                     '2027-06-14', NULL,         1, 3,  '$NOW', '$NOW'),
            ($PRODUCT_ID, 'video', 'First Teaser / World Premiere Video',   '2026-09-14', '2026-06-05', 1, 10, '$NOW', '$NOW'),
            ($PRODUCT_ID, 'video', 'Official Trailer 1',                    '2027-03-14', NULL,         1, 11, '$NOW', '$NOW'),
            ($PRODUCT_ID, 'video', 'Launch Trailer',                        '2027-08-31', NULL,         1, 12, '$NOW', '$NOW');
          SQL
          echo "Inserted $(sqlite3 "$DB" "SELECT COUNT(*) FROM pls_milestones WHERE product_id=$PRODUCT_ID;") milestones"

          echo ""
          echo "── 3. Fetch Steam Wishlist history ──"
          STEAM_API_KEY=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='steam_api_key';")
          if [ -z "$STEAM_API_KEY" ]; then
            echo "ERR: no steam_api_key in app_settings — abort backfill (product row still created)."
            exit 1
          fi
          echo "steam_api_key present (len=$(echo -n "$STEAM_API_KEY" | wc -c))"

          echo "Fetching canonical day $YESTERDAY to discover app_min_date..."
          CANON=$(curl -sS "https://partner.steam-api.com/IPartnerFinancialsService/GetAppWishlistReporting/v1/?key=$STEAM_API_KEY&appid=4716160&date=$YESTERDAY")
          echo "$CANON" | head -c 500; echo ""
          APP_MIN_DATE=$(echo "$CANON" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('response') or {}).get('app_min_date') or '')")
          if [ -z "$APP_MIN_DATE" ]; then
            echo "ERR: app_min_date not returned from Steam. Only yesterday's row will be written."
            APP_MIN_DATE="$YESTERDAY"
          fi
          echo "app_min_date = $APP_MIN_DATE"

          echo ""
          echo "── 4. Historical daily-row backfill $APP_MIN_DATE → $YESTERDAY ──"
          # Loop each date, fetch, upsert into steam_wishlist_reporting_daily.
          d="$APP_MIN_DATE"
          total_days=0
          success_days=0
          while [ "$d" \< "$YESTERDAY" ] || [ "$d" = "$YESTERDAY" ]; do
            total_days=$((total_days+1))
            RESP=$(curl -sS "https://partner.steam-api.com/IPartnerFinancialsService/GetAppWishlistReporting/v1/?key=$STEAM_API_KEY&appid=4716160&date=$d")
            SUM=$(echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);s=(d.get('response') or {}).get('wishlist_summary') or {};print(json.dumps(s))")
            HAS=$(echo "$SUM" | python3 -c "import json,sys;s=json.load(sys.stdin);print('yes' if s else 'no')")
            if [ "$HAS" != "yes" ]; then
              echo "$d: no wishlist_summary — skipping"
            else
              ADDS=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_adds',0))")
              DELS=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_deletes',0))")
              PURS=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_purchases',0))")
              GIFT=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_gifts',0))")
              WIN=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_adds_windows',0))")
              MAC=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_adds_mac',0))")
              LIN=$(echo "$SUM" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wishlist_adds_linux',0))")
              sqlite3 "$DB" "INSERT OR REPLACE INTO steam_wishlist_reporting_daily
                (product_id, date, wishlist_adds, wishlist_deletes, wishlist_purchases, wishlist_gifts, wishlist_adds_windows, wishlist_adds_mac, wishlist_adds_linux, country_summary_json, language_summary_json, fetched_at, source)
                VALUES ($PRODUCT_ID, '$d', $ADDS, $DELS, $PURS, $GIFT, $WIN, $MAC, $LIN, NULL, NULL, '$NOW', 'api');"
              success_days=$((success_days+1))
              if [ $((success_days % 10)) -eq 0 ] || [ "$d" = "$YESTERDAY" ]; then
                echo "$d: adds=$ADDS deletes=$DELS purchases=$PURS gifts=$GIFT (day #$success_days)"
              fi
            fi
            d=$(date -u -d "$d + 1 day" +%Y-%m-%d)
            sleep 1
          done
          echo "Reporting-daily rows written: $success_days / $total_days queried"

          echo ""
          echo "── 5. Compute cumulative into steam_wishlist_daily ──"
          # Running cumulative = sum(adds - deletes - purchases) up to and
          # including each date. Gifts are neutral (per persistSteamWishlistReportingDay).
          sqlite3 "$DB" <<SQL
          DELETE FROM steam_wishlist_daily WHERE product_id=$PRODUCT_ID AND source='api';
          INSERT INTO steam_wishlist_daily (product_id, date, cumulative_count, daily_delta, source, created_at)
          SELECT
            r.product_id,
            r.date,
            MAX(0, (SELECT COALESCE(SUM(r2.wishlist_adds - r2.wishlist_deletes - r2.wishlist_purchases), 0)
                    FROM steam_wishlist_reporting_daily r2
                    WHERE r2.product_id = r.product_id AND r2.date <= r.date)),
            (r.wishlist_adds - r.wishlist_deletes - r.wishlist_purchases),
            'api',
            '$NOW'
          FROM steam_wishlist_reporting_daily r
          WHERE r.product_id = $PRODUCT_ID
          ORDER BY r.date;
          SQL
          echo "Cumulative rows written: $(sqlite3 "$DB" "SELECT COUNT(*) FROM steam_wishlist_daily WHERE product_id=$PRODUCT_ID;")"

          echo ""
          echo "── 6. Verify final state ──"
          echo ""
          echo "Product:"
          sqlite3 -header -column "$DB" "SELECT id, title, publisher, platforms, release_date, target_retail_price_usd, steam_app_id, forecast_mode FROM products WHERE id=$PRODUCT_ID;"
          echo ""
          echo "PLS milestones:"
          sqlite3 -header -column "$DB" "SELECT id, category, name, target_date, actual_date, sort_order FROM pls_milestones WHERE product_id=$PRODUCT_ID ORDER BY sort_order;"
          echo ""
          echo "Wishlist reporting daily (first & last 5):"
          sqlite3 -header -column "$DB" "SELECT date, wishlist_adds, wishlist_deletes, wishlist_purchases FROM steam_wishlist_reporting_daily WHERE product_id=$PRODUCT_ID ORDER BY date LIMIT 5;"
          echo "..."
          sqlite3 -header -column "$DB" "SELECT date, wishlist_adds, wishlist_deletes, wishlist_purchases FROM steam_wishlist_reporting_daily WHERE product_id=$PRODUCT_ID ORDER BY date DESC LIMIT 5;"
          echo ""
          echo "Cumulative (last 5):"
          sqlite3 -header -column "$DB" "SELECT date, cumulative_count, daily_delta FROM steam_wishlist_daily WHERE product_id=$PRODUCT_ID ORDER BY date DESC LIMIT 5;"
          echo ""
          echo "Latest cumulative & total days:"
          sqlite3 -header -column "$DB" "SELECT MIN(date) AS first_day, MAX(date) AS last_day, COUNT(*) AS days, MAX(cumulative_count) AS peak_cum FROM steam_wishlist_daily WHERE product_id=$PRODUCT_ID;"
          REMOTE_EOF
