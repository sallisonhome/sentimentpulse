name: sp-diagnose-cookie
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SSH diag
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 << 'REMOTE'
            echo "=== saber-auth env (redacted) ==="
            cat /opt/saber-auth/.env | sed -E 's/(RESEND_API_KEY=|JWT_SECRET=|ADMIN_BOOTSTRAP_TOKEN=)([^=]{4}).*/\1\2..REDACTED/'
            echo ""
            echo "=== NODE_ENV in running process ==="
            ps auxe | grep '[s]aber-auth' | tr ' ' '\n' | grep NODE_ENV || echo "(no NODE_ENV in process env — will default to non-prod)"
            echo ""
            echo "=== recent saber-auth logs ==="
            journalctl -u saber-auth -n 30 --no-pager | tail -30
          REMOTE
