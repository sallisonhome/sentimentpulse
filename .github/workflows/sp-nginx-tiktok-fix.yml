name: SP Nginx TikTok Fix

# One-off: check nginx status, test config, and reload nginx.
# The /signal/api/tiktok/ route returns 404 HTML even though the config
# has location /signal/api/ — likely nginx needs a reload.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check and reload nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            echo "── 1. nginx service status ──"
            systemctl status nginx --no-pager 2>&1 | head -10

            echo "── 2. Test nginx config ──"
            nginx -t 2>&1

            echo "── 3. Check if /signal/api/ location is in the LIVE config ──"
            nginx -T 2>/dev/null | grep -A 3 "location /signal/api/" | head -10

            echo "── 4. Reload nginx ──"
            systemctl reload nginx 2>&1
            echo "Reload exit: $?"

            echo "── 5. Re-test /signal/api/tiktok/leaderboard ──"
            HTTP_CODE=$(curl -sS -o /tmp/tt_lb.json -w "%{http_code}" --max-time 30 \
              "http://127.0.0.1:80/signal/api/tiktok/leaderboard?window=d1&sort=views&direction=desc&scope=saber" 2>&1)
            echo "HTTP_CODE: $HTTP_CODE"
            head -c 200 /tmp/tt_lb.json
            echo ""
          EOF
EOF
