name: SP Fire Remaining Onboarding Jobs (one-off)

# Fast, non-blocking: fires RoadCraft's sales portal-daily-backfill, creates
# the Road Kings product, and fires Road Kings' wishlist backfill. Prints
# job/product IDs and returns immediately -- polling for completion is done
# separately (short round-trips) to avoid a long-idle SSH session dying.

"on":
  workflow_dispatch: {}

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fire jobs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          cat > /tmp/fire.js <<'JSEOF'
          const fs = require('fs');
          const jwt = require('/opt/sentimentpulse/signalpulse/node_modules/jsonwebtoken');
          const envRaw = fs.readFileSync('/etc/signalpulse/env', 'utf8');
          function readEnvVar(name) {
            const m = envRaw.match(new RegExp('^' + name + '=(.*)$', 'm'));
            return m ? m[1].trim().replace(/^["']|["']$/g, '') : null;
          }
          const JWT_SECRET = readEnvVar('SABER_AUTH_JWT_SECRET');
          function mintToken() {
            return jwt.sign(
              { sub: 'onboard-script', email: 'ops@saber.internal', scopes: ['signalpulse'], is_admin: true, jti: 'fire-' + Date.now() + '-' + Math.random().toString(36).slice(2) },
              JWT_SECRET, { expiresIn: '30m' }
            );
          }
          const BASE = 'http://localhost:5000';
          async function apiJwt(method, path, body) {
            const res = await fetch(BASE + path, {
              method, headers: { 'Authorization': 'Bearer ' + mintToken(), 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await res.text();
            let json; try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) throw new Error('HTTP ' + res.status + ' on ' + method + ' ' + path + ': ' + JSON.stringify(json));
            return json;
          }
          (async () => {
            try {
              const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
              console.log('=== Firing RoadCraft (id=19) sales portal-daily backfill ===');
              const rcSales = await apiJwt('POST', '/api/products/19/steam/portal-daily-backfill', { fromDate: '2025-05-20', toDate: yesterday });
              console.log('RoadCraft sales backfill jobId:', rcSales.jobId || rcSales.id);

              console.log('=== Creating Road Kings ===');
              const rk = await apiJwt('POST', '/api/products', {
                title: 'Road Kings',
                publisher: 'Focus x Saber Interactive',
                platforms: ['PC (Steam)', 'PS5', 'Xbox Series X|S'],
                playerFormat: 'multiplayer',
                genre: 'Driving Sim',
                releaseDate: '2027-03-11',
                steamAppId: '2141130',
                targetRetailPriceUsd: null,
              });
              console.log('Road Kings created, id =', rk.id);

              console.log('=== Firing Road Kings wishlist backfill ===');
              const rkWl = await apiJwt('POST', '/api/steam/backfill/' + rk.id, {});
              console.log('Road Kings wishlist backfill jobId:', rkWl.jobId || rkWl.id);

              console.log('=== JOB IDS (for polling) ===');
              console.log(JSON.stringify({ rcSalesJobId: rcSales.jobId || rcSales.id, roadKingsId: rk.id, rkWlJobId: rkWl.jobId || rkWl.id }));
            } catch (e) {
              console.error('FATAL:', e.message);
              process.exit(1);
            }
          })();
          JSEOF
          node /tmp/fire.js
          RC=$?
          rm -f /tmp/fire.js
          exit $RC
          REMOTEEOF
