name: One-off — probe saber-auth routing

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Probe both direct and via-nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 'bash -s' <<'REMOTE'
          echo "=== direct /health on port 5100 ==="
          curl -si http://127.0.0.1:5100/health | head -3
          echo ""
          echo "=== direct /auth/login.html on port 5100 ==="
          curl -si http://127.0.0.1:5100/auth/login.html | head -5
          echo ""
          echo "=== direct /login.html on port 5100 (no /auth prefix) ==="
          curl -si http://127.0.0.1:5100/login.html | head -3
          echo ""
          echo "=== through nginx /auth/login.html ==="
          curl -si http://127.0.0.1/auth/login.html | head -8
          echo ""
          echo "=== through nginx /auth/api/me (should 401) ==="
          curl -si http://127.0.0.1/auth/api/me | head -5
          echo ""
          echo "=== nginx sentimentpulse config /auth/ block ==="
          grep -B1 -A15 "location /auth/" /etc/nginx/sites-available/sentimentpulse
          echo ""
          echo "=== saber-auth journal last 15 lines ==="
          journalctl -u saber-auth -n 15 --no-pager
          REMOTE
