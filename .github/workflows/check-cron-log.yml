name: Check Cron Log Lines
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Grep signalpulse service log for cron startup lines
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -euo pipefail
          echo "== systemctl unit names matching signalpulse =="
          systemctl list-units --all --no-pager | grep -i signalpulse || echo "(no matches)"
          echo ""
          echo "== journalctl grep: ingestion cron scheduler line =="
          journalctl -u signalpulse --no-pager -n 500 2>&1 | grep -i "ingestion.*cron\|cron.*ingestion" || echo "(no matches for signalpulse unit)"
          echo ""
          echo "== journalctl grep: weekly digest cron scheduler line =="
          journalctl -u signalpulse --no-pager -n 500 2>&1 | grep -i "digest.*cron\|cron.*digest" || echo "(no matches for signalpulse unit)"
          echo ""
          echo "== fallback: search all journalctl units since last boot for both lines =="
          journalctl --no-pager --since "-30 minutes" 2>&1 | grep -i "Ingestion cron scheduler started\|Weekly leaderboard digest cron scheduler started" || echo "(no matches in last 30 minutes across all units)"
          REMOTEEOF
