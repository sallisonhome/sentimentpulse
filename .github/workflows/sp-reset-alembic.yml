name: SP Reset Alembic Version
# Reverts alembic_version from 0022 back to 0021 so `alembic upgrade head`
# succeeds after the PR 249 rollback. The 0022 migration only added a
# Postgres enum value (no-op on SQLite) and no data used it.
# One-off: safe to delete after use.
on: workflow_dispatch
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read then reset
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/backend/sentimentpulse.db
            echo "── before ──"
            sqlite3 "$DB" "SELECT version_num FROM alembic_version;"
            echo "── reset to 0021 (idempotent) ──"
            sqlite3 "$DB" "UPDATE alembic_version SET version_num='0021' WHERE version_num='0022';"
            echo "── after ──"
            sqlite3 "$DB" "SELECT version_num FROM alembic_version;"
            echo "── confirm no tiktok_comment rows leaked ──"
            sqlite3 "$DB" "SELECT COUNT(*) FROM raw_posts WHERE source='tiktok_comment';"
          EOF
