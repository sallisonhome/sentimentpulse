name: SignalPulse — probe GetDetailedSales response shape

# One-shot debug workflow, 2026-09-05. Confirms whether Valve's
# IPartnerFinancialsService/GetDetailedSales endpoint returns country_code
# on line items when called with the user's configured API key. Needed
# before building the Sales-by-Country feature.
#
# User pre-approved 2026-09-05.
# Delete this file after confirming.

"on":
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch one recent day + dump non-secret shape
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 "bash -s" <<'REMOTEEOF'
          set -euo pipefail

          DB=/opt/sentimentpulse/signalpulse/data.db
          KEY=$(sqlite3 "$DB" "SELECT value FROM settings WHERE key='steam_api_key' LIMIT 1;")
          KEY_LEN=${#KEY}
          echo "== API key configured: length ${KEY_LEN} =="
          if [ "$KEY_LEN" -lt 20 ]; then
            echo "ERR: API key missing or too short"
            exit 1
          fi

          DATE="2026-08-15"
          URL="https://partner.steam-api.com/IPartnerFinancialsService/GetDetailedSales/v001/?key=${KEY}&date=${DATE}&highwatermark_id=0&include_view_grants=true"

          echo ""
          echo "== HTTP call: date=${DATE} =="
          RESP=$(curl -sS --max-time 30 "$URL")
          BYTES=${#RESP}
          echo "response bytes: ${BYTES}"

          echo ""
          echo "== Top-level keys =="
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d.keys()))"

          echo ""
          echo "== response object keys =="
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(list((d.get('response') or {}).keys()))"

          echo ""
          echo "== Total result rows =="
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); r=(d.get('response') or {}).get('results') or []; print(len(r))"

          echo ""
          echo "== KEYS on a single row (row 0) =="
          echo "$RESP" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          r = (d.get('response') or {}).get('results') or []
          if not r:
              print('EMPTY - no rows for this date')
          else:
              print(sorted(r[0].keys()))
          "

          echo ""
          echo "== SAMPLE row 0 (numeric + short-string fields only) =="
          echo "$RESP" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          r = (d.get('response') or {}).get('results') or []
          if r:
              row = r[0]
              safe = {k: v for k, v in row.items() if isinstance(v, (int, float, bool)) or (isinstance(v, str) and len(str(v)) <= 12)}
              print(json.dumps(safe, indent=2))
          "

          echo ""
          echo "== Distinct country_code values in this batch =="
          echo "$RESP" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          r = (d.get('response') or {}).get('results') or []
          countries = sorted(set(row.get('country_code','?') for row in r))
          print(f'{len(countries)} distinct countries:', countries[:40])
          "

          echo ""
          echo "== Distinct appids in this batch =="
          echo "$RESP" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          r = (d.get('response') or {}).get('results') or []
          apps = sorted(set(row.get('appid') or row.get('primary_appid') for row in r if row.get('appid') or row.get('primary_appid')))
          print(f'{len(apps)} distinct appids:', apps[:20])
          "

          echo ""
          echo "== Sample: distinct (appid, country_code) combos =="
          echo "$RESP" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          r = (d.get('response') or {}).get('results') or []
          combos = sorted(set((row.get('appid') or row.get('primary_appid'), row.get('country_code','?')) for row in r if (row.get('appid') or row.get('primary_appid'))))
          print(f'{len(combos)} distinct (appid, country) pairs')
          for c in combos[:10]:
              print(' ', c)
          "

          echo ""
          echo "== DONE =="
          REMOTEEOF
