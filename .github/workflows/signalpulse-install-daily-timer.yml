name: SignalPulse — Install/Update daily systemd timer

# Installs signalpulse-daily.{service,timer} on the droplet and enables
# the timer. Idempotent — re-run any time to refresh the unit files.
#
# Purpose: replace the unreliable GitHub Actions cron with a host-local
# systemd timer that fires on time (Persistent=true catches up if the
# droplet was down at the scheduled instant).

on:
  workflow_dispatch:
    inputs:
      action:
        description: '"install" (default), "disable", or "status"'
        required: false
        default: "install"
        type: choice
        options: [install, disable, status]

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  manage-timer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply
        env:
          ACTION_INPUT: ${{ inputs.action }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 "ACTION=$ACTION_INPUT bash -s" <<'REMOTE'
          set -euo pipefail
          ACTION="${ACTION:-install}"
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          [ -n "$WD" ] || { echo "ERR: signalpulse not installed"; exit 1; }
          echo "WD=$WD  ACTION=$ACTION"

          case "$ACTION" in
            install)
              exec 9>/run/lock/signalpulse-maintenance.lock
              flock -n 9 || { echo "Refresh busy; no unit changes performed"; exit 75; }
              state=$(systemctl show -p ActiveState --value signalpulse-daily.service)
              case "$state" in active|activating|deactivating) echo "Refresh active; refusing unit changes"; exit 75;; esac
              before=$(systemctl show -p InvocationID --value signalpulse-daily.service)
              # Preflight: verify BOTH unit files AND the runner wrapper are deployed.
              # `enable --now` fires the service immediately, so a missing wrapper
              # would cause an immediate exit 2 (INVALIDARGUMENT) — exactly the bug
              # this rewrite is fixing. Bail before enabling if anything is missing.
              [ -f "$WD/deploy/signalpulse-daily.service" ] || { echo "ERR: service unit not deployed";   exit 1; }
              [ -f "$WD/deploy/signalpulse-daily.timer"   ] || { echo "ERR: timer unit not deployed";     exit 1; }
              [ -x "$WD/deploy/signalpulse-daily.sh"      ] || { echo "ERR: daily runner wrapper missing or not executable at $WD/deploy/signalpulse-daily.sh"; exit 1; }

              install -m 0644 "$WD/deploy/signalpulse-daily.service" /etc/systemd/system/signalpulse-daily.service
              install -m 0644 "$WD/deploy/signalpulse-daily.timer"   /etc/systemd/system/signalpulse-daily.timer
              systemctl daemon-reload
              # `enable` WITHOUT --now — the timer starts on schedule; a controlled
              # first run is done via signalpulse-run-daily.yml so we capture its
              # journal output and gate GHA-cron retirement on a clean invocation.
              systemctl enable signalpulse-daily.timer
              systemctl start signalpulse-daily.timer
              after=$(systemctl show -p InvocationID --value signalpulse-daily.service)
              [ "$before" = "$after" ] || { echo "Unexpected refresh activation during timer update"; exit 1; }
              echo "── Timer status ──"
              systemctl status signalpulse-daily.timer --no-pager | head -20 || true
              echo ""
              echo "── Timer schedule ──"
              systemctl list-timers signalpulse-daily.timer --no-pager
              ;;

            disable)
              systemctl disable --now signalpulse-daily.timer || true
              echo "── Post-disable status ──"
              systemctl is-active signalpulse-daily.timer || echo "(inactive — good)"
              ;;

            status)
              echo "── Timer status ──"
              systemctl status signalpulse-daily.timer --no-pager | head -20 || true
              echo ""
              echo "── Timer schedule ──"
              systemctl list-timers signalpulse-daily.timer --no-pager || true
              echo ""
              echo "── Installed refresh units ──"
              systemctl cat signalpulse-daily.service signalpulse-daily.timer
              systemctl show signalpulse-daily.service -p ActiveState -p SubState -p InvocationID -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p TimeoutStartUSec
              echo "── Completed oneshot invocation retention probe (read-only) ──"
              systemctl show sysstat-collect.service -p ActiveState -p InvocationID -p Result -p ExecMainStatus
              echo "── All scheduled host timers ──"
              systemctl list-timers --all --no-pager
              echo "── Refresh-related OS schedule locations (names only) ──"
              grep -rlE 'signalpulse-daily|verify-discovery|verify-console-collectors|estimate-console-units' /etc/cron.d /etc/crontab /var/spool/cron/crontabs 2>/dev/null || true
              echo "── Recent daily journal (last 1000 lines) ──"
              journalctl -u signalpulse-daily.service -n 1000 --no-pager || true
              ;;

            *)
              echo "unknown action: $ACTION"; exit 1
              ;;
          esac
          REMOTE
