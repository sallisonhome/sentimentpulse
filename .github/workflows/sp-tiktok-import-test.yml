name: SP TikTok Import Direct Test

# One-off diagnostic: curl the TikTok leaderboard through the exact nginx
# path the SPA uses (/signal/api/tiktok/leaderboard) with the correct Host header.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test TikTok leaderboard via exact SPA path with Host header
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            echo "── 1. GET /signal/api/tiktok/leaderboard with Host: 104.236.239.46 ──"
            HTTP_CODE=$(curl -sS -o /tmp/tt_lb1.json -w "%{http_code}" --max-time 30 \
              -H "Host: 104.236.239.46" \
              "http://127.0.0.1:80/signal/api/tiktok/leaderboard?window=d1&sort=views&direction=desc&scope=saber" 2>&1)
            echo "HTTP_CODE: $HTTP_CODE"
            echo "--- Response (first 300 chars) ---"
            head -c 300 /tmp/tt_lb1.json
            echo ""

            echo "── 2. GET /signal/api/tiktok/leaderboard with Host: 104.236.239.46 + fake cookie ──"
            HTTP_CODE_2=$(curl -sS -o /tmp/tt_lb2.json -w "%{http_code}" --max-time 30 \
              -H "Host: 104.236.239.46" \
              -H "Cookie: saber_session=fake" \
              "http://127.0.0.1:80/signal/api/tiktok/leaderboard?window=d1&sort=views&direction=desc&scope=saber" 2>&1)
            echo "HTTP_CODE_2: $HTTP_CODE_2"
            echo "--- Response (first 300 chars) ---"
            head -c 300 /tmp/tt_lb2.json
            echo ""
          EOF
