name: SP TikTok Import Direct Test

# One-off diagnostic: directly test the TikTok comment feed and leaderboard
# endpoints via curl from the droplet.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test TikTok leaderboard and feed endpoints
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            echo "── 1. GET /api/tiktok/leaderboard (d1, saber) ──"
            HTTP_CODE=$(curl -sS -o /tmp/tt_lb.json -w "%{http_code}" --max-time 30 \
              "http://127.0.0.1:5000/api/tiktok/leaderboard?window=d1&sort=views&direction=desc&scope=saber" 2>&1)
            echo "HTTP_CODE: $HTTP_CODE"
            echo "--- Response (first 800 chars) ---"
            head -c 800 /tmp/tt_lb.json
            echo ""

            echo "── 2. GET /api/tiktok/status ──"
            HTTP_CODE_2=$(curl -sS -o /tmp/tt_status.json -w "%{http_code}" --max-time 30 \
              "http://127.0.0.1:5000/api/tiktok/status" 2>&1)
            echo "STATUS_HTTP_CODE: $HTTP_CODE_2"
            echo "--- Status response (first 500 chars) ---"
            head -c 500 /tmp/tt_status.json
            echo ""

            echo "── 3. GET /api/tiktok/leaderboard via nginx (external) ──"
            HTTP_CODE_3=$(curl -sS -o /tmp/tt_lb_ext.json -w "%{http_code}" --max-time 30 \
              -H "Host: saber-apps-suite.local" \
              "http://127.0.0.1:80/api/tiktok/leaderboard?window=d1&sort=views&direction=desc&scope=saber" 2>&1)
            echo "EXT_HTTP_CODE: $HTTP_CODE_3"
            head -c 300 /tmp/tt_lb_ext.json
            echo ""
          EOF
