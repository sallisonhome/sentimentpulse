name: One-off — dump conf again after fix
on:
  workflow_dispatch: {}
concurrency:
  group: deploy-droplet
  cancel-in-progress: false
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Dump current conf + list bak files
        run: |
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 'echo "=== CURRENT sentimentpulse conf ==="; cat /etc/nginx/sites-available/sentimentpulse; echo ""; echo "=== BACKUPS ==="; ls -lat /etc/nginx/sites-available/ | head -12'
