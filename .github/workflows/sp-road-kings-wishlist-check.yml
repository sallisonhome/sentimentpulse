name: SP Road Kings Wishlist Rank Check (read-only, one-off)

"on":
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query Road Kings wishlist rank state
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "── Product record for Road Kings (pid=20) ──"
          sqlite3 -header -column "$DB" "SELECT id, title, steam_app_id, release_date, is_saber_published FROM products WHERE id=20;"
          echo
          echo "── Last 10 wishlist rank rows for pid=20 ──"
          sqlite3 -header -column "$DB" "SELECT date, rank FROM steam_wishlist_rank_daily WHERE product_id=20 ORDER BY date DESC LIMIT 10;"
          echo
          echo "── All Saber-published pre-release titles and their latest wishlist rank ──"
          sqlite3 -header -column "$DB" "
          SELECT p.id, p.title, p.steam_app_id, p.release_date,
                 (SELECT rank FROM steam_wishlist_rank_daily w WHERE w.product_id = p.id ORDER BY date DESC LIMIT 1) AS latest_rank,
                 (SELECT date FROM steam_wishlist_rank_daily w WHERE w.product_id = p.id ORDER BY date DESC LIMIT 1) AS latest_date
          FROM products p
          WHERE p.is_saber_published = 1
            AND p.steam_app_id IS NOT NULL
            AND (p.release_date IS NULL OR p.release_date > date('now'))
          ORDER BY p.id;
          "
          echo
          echo "── Total row count for pid=20 in steam_wishlist_rank_daily (all-time) ──"
          sqlite3 "$DB" "SELECT COUNT(*) FROM steam_wishlist_rank_daily WHERE product_id=20;"

          REMOTEEOF
