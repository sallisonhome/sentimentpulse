name: SignalPulse CI

# Type check, build and the full regression suite on every pull request touching signalpulse, plus a
# daily audit of the live boards for shared-rating-pool double counting (the Mafia / Minecraft Deluxe /
# GTA Online class of defect). A failing run means a regression reached production or is about to.

on:
  pull_request:
    paths: ["signalpulse/**", ".github/workflows/signalpulse-ci.yml"]
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: signalpulse } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: signalpulse/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  live-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: signalpulse } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: signalpulse/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/audit-shared-pool-duplicates.ts
