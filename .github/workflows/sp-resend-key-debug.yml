name: SP Resend Key Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check shape of stored value (no content printed)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db

            echo "── Does stored resend_api_key match standard UUID shape (8-4-4-4-12 lowercase hex with hyphens)? ──"
            sqlite3 "$DB" "SELECT CASE WHEN value GLOB '[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]' THEN 'true (looks like a UUID)' ELSE 'false' END FROM app_settings WHERE key='resend_api_key';"

            echo ""
            echo "── Does it contain any underscore? (Resend keys are re_<id>_<secret> shaped) ──"
            sqlite3 "$DB" "SELECT CASE WHEN value LIKE '%\_%' ESCAPE '\\' THEN 'true' ELSE 'false' END FROM app_settings WHERE key='resend_api_key';"

            echo ""
            echo "── Does it look like all-lowercase-hex-and-hyphens only (no other chars)? ──"
            sqlite3 "$DB" "SELECT CASE WHEN value GLOB '*[^0-9a-f-]*' THEN 'false (has other chars)' ELSE 'true (only hex+hyphens)' END FROM app_settings WHERE key='resend_api_key';"
          EOF
