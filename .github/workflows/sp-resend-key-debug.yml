name: SP Resend Key Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test stored key with re_ prefix prepended (read-only, no save)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db

            STORED=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='resend_api_key';")
            FROM=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='resend_from';")
            CANDIDATE="re_${STORED}"

            echo "── stored value length: $(echo -n "$STORED" | wc -c) ──"
            echo "── candidate (re_ + stored) length: $(echo -n "$CANDIDATE" | wc -c) ──"

            echo ""
            echo "── Testing candidate against Resend (key never echoed) ──"
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST https://api.resend.com/emails \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CANDIDATE" \
              -H "User-Agent: SignalPulse/1.0 (+https://github.com/sallisonhome/sentimentpulse)" \
              -d "{\"from\":\"$FROM\",\"to\":[\"delivered@resend.dev\"],\"subject\":\"debug test with re_ prefix\",\"html\":\"<p>test</p>\"}"
          EOF
