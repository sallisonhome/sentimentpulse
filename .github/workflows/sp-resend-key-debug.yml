name: SP Resend Key Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect stored key + test direct call to Resend
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db

            echo "── 1. Stored resend_api_key metadata (length + last-updated only, no key content) ──"
            sqlite3 "$DB" "SELECT length(value) AS key_length, updated_at FROM app_settings WHERE key='resend_api_key';"
            echo "(sanity: does the stored value start with the expected 're_' prefix? true/false only, no content printed)"
            sqlite3 "$DB" "SELECT CASE WHEN value LIKE 're\_%' ESCAPE '\\' THEN 'true' ELSE 'false' END FROM app_settings WHERE key='resend_api_key';"
            echo "(sanity: any leading/trailing whitespace or newline present? true/false only)"
            sqlite3 "$DB" "SELECT CASE WHEN value != trim(value) THEN 'true (has whitespace)' ELSE 'false (clean)' END FROM app_settings WHERE key='resend_api_key';"

            echo ""
            echo "── 2. resend_from value (not secret) ──"
            sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='resend_from';"

            echo ""
            echo "── 3. Direct curl to Resend using the EXACT stored key, from the droplet (key never echoed) ──"
            KEY=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='resend_api_key';")
            FROM=$(sqlite3 "$DB" "SELECT value FROM app_settings WHERE key='resend_from';")
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST https://api.resend.com/emails \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -H "User-Agent: SignalPulse/1.0 (+https://github.com/sallisonhome/sentimentpulse)" \
              -d "{\"from\":\"$FROM\",\"to\":[\"delivered@resend.dev\"],\"subject\":\"debug test\",\"html\":\"<p>test</p>\"}"

            echo ""
            echo "── 4. Same call but WITHOUT the custom User-Agent (control) ──"
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST https://api.resend.com/emails \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -d "{\"from\":\"$FROM\",\"to\":[\"delivered@resend.dev\"],\"subject\":\"debug test 2\",\"html\":\"<p>test</p>\"}"
          EOF
