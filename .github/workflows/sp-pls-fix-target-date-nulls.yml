name: SP PLS Fix target_date NULLs for gamescom batch (one-off)

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Null target_date on the 4 gamescom rows (ids 719-722)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          sqlite3 "$DB" "
            UPDATE pls_milestones SET target_date = NULL, updated_at = '$NOW'
            WHERE id IN (719, 720, 721, 722);
          "

          echo "── Verification ──"
          sqlite3 -header -column "$DB" "
            SELECT id, product_id, category, target_date, actual_date, sort_order
            FROM pls_milestones
            WHERE id IN (719, 720, 721, 722)
            ORDER BY id;
          "
          REMOTEEOF
