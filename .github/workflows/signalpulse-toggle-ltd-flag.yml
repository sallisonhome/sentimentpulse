name: SignalPulse — Toggle LTD_ACCUMULATOR_ENABLED flag

# Sets or clears LTD_ACCUMULATOR_ENABLED on the signalpulse systemd unit
# via a drop-in override. Restarts the service. Idempotent.

on:
  workflow_dispatch:
    inputs:
      enable:
        description: '"1" to enable accumulator, "0" to disable'
        required: true
        default: "0"

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply flag
        env:
          ENABLE_INPUT: ${{ inputs.enable }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 "ENABLE=$ENABLE_INPUT bash -s" <<'REMOTE'
          set -euo pipefail
          ENABLE="${ENABLE:-0}"
          mkdir -p /etc/systemd/system/signalpulse.service.d
          cat > /etc/systemd/system/signalpulse.service.d/ltd-flag.conf <<CONF
          [Service]
          Environment=LTD_ACCUMULATOR_ENABLED=${ENABLE}
          CONF
          systemctl daemon-reload
          systemctl restart signalpulse
          sleep 2
          echo "── Service status ──"
          systemctl is-active signalpulse
          echo "── Environment observed ──"
          systemctl show -p Environment signalpulse | tr ' ' '\n' | grep -i LTD || echo "(LTD env not set)"
          REMOTE
