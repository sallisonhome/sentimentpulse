name: SP PLS Sort Order Check (batch3 minor events, one-off)

"on":
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check max sort_order
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "── Max sort_order per product (3,7,10,12,14,15,16,17) ──"
          sqlite3 -header -column "$DB" "SELECT product_id, MAX(sort_order) AS max_sort, COUNT(*) AS row_count FROM pls_milestones WHERE product_id IN (3,7,10,12,14,15,16,17) AND deleted_at IS NULL GROUP BY product_id ORDER BY product_id;"
          echo ""
          echo "── Check for any existing rows matching our planned dates (avoid dupes) ──"
          sqlite3 -header -column "$DB" "SELECT product_id, id, actual_date, substr(name,1,50) FROM pls_milestones WHERE product_id IN (3,7,10,12,14,15,16,17) AND deleted_at IS NULL AND actual_date IN ('2026-08-11','2026-08-19','2026-07-23','2026-08-17','2026-07-15','2026-07-20','2026-07-28','2026-08-13','2026-08-20','2026-07-30','2026-08-21','2026-08-25') ORDER BY product_id, actual_date;"
          REMOTEEOF
