name: SignalPulse — Force Wolverine PS5 LTD floor down -15% + re-estimate

# One-off dispatchable workflow that:
#   1. Runs scripts/force-ltd-state-2026-09-19-wolverine-minus15pct.ts to
#      directly reset title_ltd_state.ltd_units for Marvel's Wolverine (PS5)
#      down to the anchor implied by the already-revised 49.045x multiplier
#      override, bypassing the LTD accumulator's "floor, not ceiling" rule
#      for this one title/day. See the script's header comment for the full
#      background: the multiplier revision (PR #85) alone did not move the
#      visible number because the prior higher state (2,688,061, from the
#      original 57.7x override) was kept as a floor.
#   2. Reruns scripts/estimate-console-units.ts so window_estimates_daily
#      reflects the forced state and confirms it resolves stably.
#
# Explicit user direction 2026-09-19: "Force the stored value down." This
# does not change the accumulator's floor logic for any other title — it
# corrects one stale high-water mark left over from the pre-revision
# multiplier.
#
# Idempotent: the force script recomputes from live data each run and is a
# no-op if the stored value is already at or below the computed anchor.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  force-and-estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preflight
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          [ -n "$WD" ] || { echo "ERR: could not resolve signalpulse WorkingDirectory"; exit 1; }
          echo "Working dir: $WD"
          [ -f "$WD/data.db" ] || { echo "ERR: DB missing"; exit 1; }
          [ -f "$WD/scripts/force-ltd-state-2026-09-19-wolverine-minus15pct.ts" ] || { echo "ERR: force script missing — deploy first"; exit 1; }
          [ -f "$WD/scripts/estimate-console-units.ts" ] || { echo "ERR: estimator missing"; exit 1; }
          [ -x "$WD/node_modules/.bin/tsx" ] || { echo "ERR: tsx missing — deploy first"; exit 1; }

          echo ""
          echo "── Pre-run: title_multiplier_overrides state (ps5, title 10302) ──"
          sqlite3 -header -column "$WD/data.db" "
            SELECT title_id, platform, multiplier, digital_unit_share, method, effective_from
              FROM title_multiplier_overrides
              WHERE title_id = 10302 AND platform = 'ps5'
              ORDER BY effective_from DESC LIMIT 5;
          "

          echo ""
          echo "── Pre-run: title_ltd_state for title_id=10302 (Wolverine) ──"
          sqlite3 -header -column "$WD/data.db" "
            SELECT * FROM title_ltd_state WHERE title_id = 10302;
          "

          echo ""
          echo "── Pre-run: Wolverine PS5 ltd row (baseline for comparison) ──"
          curl -sS "http://127.0.0.1:5000/signal/api/console/leaderboards/ps5?window=ltd&sort=revenue&dir=desc&limit=200" \
            | jq '.titles[] | select(.name | test("wolverine"; "i")) | {name, unitsMid, revenueMidUsd, ratingCount, estimateMethod}' \
            || echo "(no wolverine row found or endpoint unreachable)"
          REMOTE

      - name: Run force-ltd-state-2026-09-19-wolverine-minus15pct
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"

          if [ -f /etc/signalpulse/env ]; then
            set -a
            . /etc/signalpulse/env
            set +a
          fi
          export NODE_ENV="${NODE_ENV:-production}"

          echo "════════════════════════════════════════════════════════"
          echo "  force-ltd-state-2026-09-19-wolverine-minus15pct.ts"
          echo "════════════════════════════════════════════════════════"
          t0=$(date +%s)
          timeout 120 ./node_modules/.bin/tsx scripts/force-ltd-state-2026-09-19-wolverine-minus15pct.ts
          rc=$?
          t1=$(date +%s)
          echo ""
          echo "Elapsed: $((t1 - t0))s  exit=$rc"
          exit $rc
          REMOTE

      - name: Rerun estimate-console-units
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"

          if [ -f /etc/signalpulse/env ]; then
            set -a
            . /etc/signalpulse/env
            set +a
          fi
          export NODE_ENV="${NODE_ENV:-production}"

          echo "════════════════════════════════════════════════════════"
          echo "  estimate-console-units.ts (rerun to confirm forced state resolves stably)"
          echo "════════════════════════════════════════════════════════"
          t0=$(date +%s)
          LTD_ACCUMULATOR_ENABLED=$(systemctl show -p Environment signalpulse | tr ' ' '\n' | grep '^LTD_ACCUMULATOR_ENABLED=' | cut -d= -f2 || echo "")
          echo "LTD_ACCUMULATOR_ENABLED=${LTD_ACCUMULATOR_ENABLED:-<unset>}"
          LTD_ACCUMULATOR_ENABLED="${LTD_ACCUMULATOR_ENABLED}" timeout 600 ./node_modules/.bin/tsx scripts/estimate-console-units.ts
          rc=$?
          t1=$(date +%s)
          echo ""
          echo "Elapsed: $((t1 - t0))s  exit=$rc"
          exit $rc
          REMOTE

      - name: Post-run audit
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)

          echo "── Post-run: title_ltd_state for title_id=10302 (Wolverine) ──"
          sqlite3 -header -column "$WD/data.db" "
            SELECT * FROM title_ltd_state WHERE title_id = 10302;
          "

          echo ""
          echo "── Post-run: Wolverine PS5 ltd row (should reflect the forced ~2,284,852 units) ──"
          curl -sS "http://127.0.0.1:5000/signal/api/console/leaderboards/ps5?window=ltd&sort=revenue&dir=desc&limit=200" \
            | jq '.titles[] | select(.name | test("wolverine"; "i")) | {name, unitsMid, revenueMidUsd, ratingCount, estimateMethod}' \
            || echo "(no wolverine row found or endpoint unreachable)"
          REMOTE
