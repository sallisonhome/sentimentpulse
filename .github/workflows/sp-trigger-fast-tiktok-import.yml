name: SP Trigger Fast TikTok Import

# One-off: trigger a SentimentPulse ingest that skips the 5 slow sources
# (reddit, bluesky, steam_review, steam_forum, dtf) so only YouTube + TikTok
# + analysis run. Much faster than the full ingest (~minutes vs ~1 hour).

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger fast ingest
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            echo "── Triggering fast ingest (skip: reddit,bluesky,steam_review,steam_forum,dtf) ──"
            HTTP_CODE=$(curl -sS -o /tmp/ingest_resp.json -w "%{http_code}" --max-time 30 -X POST \
              "http://127.0.0.1:8000/api/ingest/run?skip_sources=reddit,bluesky,steam_review,steam_forum,dtf" 2>&1)
            echo "HTTP: $HTTP_CODE"
            cat /tmp/ingest_resp.json
          EOF
