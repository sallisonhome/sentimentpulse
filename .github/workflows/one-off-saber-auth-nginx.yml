name: One-off — fix nginx /auth/ proxy for saber-auth

# Replaces the /auth/ block with a variant that uses proxy_pass without a URI
# (nginx then forwards the full original URI), which is more predictable.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write installer and run
        run: |
          cat > /tmp/install-saber-nginx.py <<'PY'
          #!/usr/bin/env python3
          import os, re, sys, shutil, subprocess, time
          CONF = None
          for c in ['/etc/nginx/sites-enabled/sentimentpulse',
                    '/etc/nginx/sites-enabled/sentimentpulse.conf']:
              if os.path.exists(c):
                  CONF = c
                  break
          if CONF is None:
              sys.exit("no sentimentpulse conf found")
          REAL = os.path.realpath(CONF)
          with open(REAL) as f:
              src = f.read()
          # Remove any existing /auth/ block (idempotent replacement)
          pattern = re.compile(r'\n?\s*# saber-auth[^\n]*\n\s*location /auth/ \{[^}]*\}\n?', re.DOTALL)
          src = pattern.sub('\n', src)
          # Fresh snippet — proxy_pass WITHOUT a URI so nginx forwards the full request URI.
          snippet = """
              # saber-auth (Saber Suite SSO)
              location /auth/ {
                  proxy_pass http://127.0.0.1:5100;
                  proxy_http_version 1.1;
                  proxy_set_header Host              $host;
                  proxy_set_header X-Real-IP         $remote_addr;
                  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 30s;
              }
          """
          new = re.sub(r'(server_name[^;]+;\s*\n)', r'\1' + snippet + '\n', src, count=1)
          if new == src:
              sys.exit("could not find server_name in " + REAL)
          shutil.copy(REAL, f"{REAL}.bak.{int(time.time())}.saber-auth-fix")
          with open(REAL, 'w') as f:
              f.write(new)
          print("Updated /auth/ block in", REAL)
          r = subprocess.run(['nginx', '-t'], capture_output=True, text=True)
          print(r.stderr)
          if r.returncode != 0:
              sys.exit("nginx -t failed")
          subprocess.run(['systemctl', 'reload', 'nginx'], check=True)
          print("nginx reloaded")
          PY
          scp -i ~/.ssh/id_ed25519 /tmp/install-saber-nginx.py root@104.236.239.46:/tmp/install-saber-nginx.py
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 'python3 /tmp/install-saber-nginx.py'
          echo ""
          echo "==> Smoke tests via nginx:"
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 'set -e; curl -sf -o /dev/null -w "  /auth/login.html: HTTP %{http_code}\n" http://127.0.0.1/auth/login.html && curl -si http://127.0.0.1/auth/api/me | head -1 | sed "s/^/  /"; curl -sf -o /dev/null -w "  /health (sp still ok): HTTP %{http_code}\n" http://127.0.0.1/health; curl -sf -o /dev/null -w "  / (launcher still ok): HTTP %{http_code}\n" http://127.0.0.1/; rm /tmp/install-saber-nginx.py'
