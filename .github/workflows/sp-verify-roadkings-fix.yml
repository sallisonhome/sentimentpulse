name: SP Verify Road Kings eligibility fix (one-off, read-only)

"on":
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "=== Road Kings product row ==="
          sqlite3 -header -column "$DB" "
            SELECT id, title, steam_app_id, is_saber_published, release_date
            FROM products WHERE id = 20;
          "
          echo "=== Latest 3 steam_wishlist_daily rows for Road Kings (id=20) ==="
          sqlite3 -header -column "$DB" "
            SELECT date, cumulative_count, daily_delta, source FROM steam_wishlist_daily
            WHERE product_id = 20 ORDER BY date DESC LIMIT 3;
          "
          echo "=== Latest 3 steam_followers_daily rows for Road Kings (id=20) ==="
          sqlite3 -header -column "$DB" "
            SELECT date, follower_count, daily_delta FROM steam_followers_daily
            WHERE product_id = 20 ORDER BY date DESC LIMIT 3;
          "
          echo "=== Latest 3 steam_wishlist_rank_daily rows for Road Kings (id=20) ==="
          sqlite3 -header -column "$DB" "
            SELECT date, rank FROM steam_wishlist_rank_daily
            WHERE product_id = 20 ORDER BY date DESC LIMIT 3;
          "
          echo "=== Today (server clock) ==="
          date -u +%Y-%m-%d
          REMOTEEOF
