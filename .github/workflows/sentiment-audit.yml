name: Sentiment Classifier Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Audit
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend
            source .venv/bin/activate

            echo "── 1. Which classifier is loaded? ──"
            python <<'PY'
import os
from config import settings
print('lightweight_nlp setting:', settings.lightweight_nlp)
print('NLP_MODE env var:', os.environ.get('NLP_MODE', '(unset)'))
from services import nlp_service
nlp_service.load_model()
print('_use_vader (after load):', nlp_service._use_vader)
print('_pipeline loaded:', nlp_service._pipeline is not None)
print('Model name constant:', nlp_service._MODEL_NAME)
PY
            deactivate

            echo ""
            echo "── 2. Overall sentiment distribution (last 30 days) ──"
            sqlite3 -header -column sentimentpulse.db "
              SELECT sr.sentiment, COUNT(*) AS n, ROUND(AVG(sr.sentiment_score), 3) AS avg_conf
              FROM sentiment_records sr
              JOIN raw_posts rp ON rp.id = sr.raw_post_id
              WHERE COALESCE(rp.post_date, rp.collected_at) >= datetime('now','-30 days')
              GROUP BY sr.sentiment;
            "

            echo ""
            echo "── 3. Confidence-score distribution by label ──"
            sqlite3 -header -column sentimentpulse.db "
              SELECT sr.sentiment,
                     SUM(CASE WHEN sr.sentiment_score < 0.55 THEN 1 ELSE 0 END) AS conf_lt_55,
                     SUM(CASE WHEN sr.sentiment_score BETWEEN 0.55 AND 0.70 THEN 1 ELSE 0 END) AS conf_55_70,
                     SUM(CASE WHEN sr.sentiment_score BETWEEN 0.70 AND 0.85 THEN 1 ELSE 0 END) AS conf_70_85,
                     SUM(CASE WHEN sr.sentiment_score > 0.85 THEN 1 ELSE 0 END) AS conf_gt_85
              FROM sentiment_records sr
              JOIN raw_posts rp ON rp.id = sr.raw_post_id
              WHERE COALESCE(rp.post_date, rp.collected_at) >= datetime('now','-30 days')
              GROUP BY sr.sentiment;
            "

            echo ""
            echo "── 4. The two SM2 posts from the screenshot ──"
            sqlite3 sentimentpulse.db "
              SELECT rp.title, sr.sentiment, ROUND(sr.sentiment_score, 3) AS score, substr(rp.body, 1, 300) AS body_preview
              FROM raw_posts rp
              JOIN sentiment_records sr ON sr.raw_post_id = rp.id
              WHERE rp.game_id = (SELECT id FROM games WHERE name LIKE '%Warhammer%Space Marine 2%')
                AND (rp.title LIKE '%Lone White Wolf%'
                  OR rp.title LIKE '%patch just straight up break%');
            "

            echo ""
            echo "── 5. Sample 'positive'-tagged posts whose body contains bug/break/broken/issue ──"
            sqlite3 sentimentpulse.db "
              SELECT g.name, sr.sentiment_score, substr(rp.title, 1, 80) AS title
              FROM raw_posts rp
              JOIN sentiment_records sr ON sr.raw_post_id = rp.id
              JOIN games g ON g.id = rp.game_id
              WHERE sr.sentiment = 'positive'
                AND (LOWER(rp.title || ' ' || COALESCE(rp.body,'')) LIKE '%bugged%'
                  OR LOWER(rp.title || ' ' || COALESCE(rp.body,'')) LIKE '%broke%'
                  OR LOWER(rp.title || ' ' || COALESCE(rp.body,'')) LIKE '%doesnt work%'
                  OR LOWER(rp.title || ' ' || COALESCE(rp.body,'')) LIKE \"%doesn't work%\"
                  OR LOWER(rp.title || ' ' || COALESCE(rp.body,'')) LIKE '%crash%'
                  OR LOWER(rp.title || ' ' || COALESCE(rp.body,'')) LIKE '%unplayable%')
                AND COALESCE(rp.post_date, rp.collected_at) >= datetime('now','-30 days')
              ORDER BY sr.sentiment_score DESC
              LIMIT 15;
            "

            echo ""
            echo "── 6. Sample 'negative'-tagged posts whose body is empty or very short ──"
            sqlite3 sentimentpulse.db "
              SELECT g.name, sr.sentiment_score, length(COALESCE(rp.body,'')) AS body_len, substr(rp.title, 1, 80) AS title
              FROM raw_posts rp
              JOIN sentiment_records sr ON sr.raw_post_id = rp.id
              JOIN games g ON g.id = rp.game_id
              WHERE sr.sentiment = 'negative'
                AND length(COALESCE(rp.body, '')) < 20
                AND COALESCE(rp.post_date, rp.collected_at) >= datetime('now','-30 days')
              ORDER BY sr.sentiment_score DESC
              LIMIT 15;
            "
          EOF
