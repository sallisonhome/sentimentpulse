name: PromoCalendar — tail service log (one-shot)

# One-shot debug workflow, 2026-09-04. Tails the last N lines of
# journalctl -u promocalendar so a live 500 can be diagnosed. Delete
# this file after the incident is resolved.

"on":
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SSH + tail
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 "bash -s" <<'EOF'
          set -euo pipefail
          echo "== service status =="
          systemctl status promocalendar --no-pager | head -10
          echo ""
          echo "== last 80 log lines =="
          journalctl -u promocalendar --no-pager -n 80 | tail -80
          EOF
