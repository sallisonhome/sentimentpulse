name: SP Check Ingest Status

# One-off diagnostic: check SentimentPulse's ingest status via
# GET /api/ingest/status on 127.0.0.1:8000 (loopback, no auth).

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check ingest status
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            echo "── GET /api/ingest/status ──"
            curl -sS --max-time 10 http://127.0.0.1:8000/api/ingest/status 2>&1 | python3 -m json.tool 2>/dev/null || \
              curl -sS --max-time 10 http://127.0.0.1:8000/api/ingest/status 2>&1 | head -20
            echo ""
            echo "── SentimentPulse journalctl (ingest window 04:30-05:35 UTC Oct 14, tiktok/ingest related) ──"
            journalctl -u sentimentpulse --since "2026-10-14 04:30:00" --until "2026-10-14 05:35:00" --no-pager -n 5000 2>/dev/null | grep -iE "tiktok|ingest_phase|ERROR|WARNING|import" | grep -v "GET /api/settings\|GET /api/tiktok/status\|GET /api/tiktok/series\|GET /api/tiktok/comments" | tail -50
          EOF
