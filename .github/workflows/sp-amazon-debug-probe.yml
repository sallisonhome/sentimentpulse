name: DEBUG - Amazon movers_and_shakers raw probe (temporary, delete after use)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH probe (read-only) — one live Rainforest movers_and_shakers call
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

          B64=$(base64 -w0 .github/workflows/probe_remote.sh)
          echo "$B64" | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 root@104.236.239.46 \
            'base64 -d > /tmp/probe_remote.sh && chmod +x /tmp/probe_remote.sh && /tmp/probe_remote.sh; rc=$?; rm -f /tmp/probe_remote.sh; exit $rc'

          rm -f ~/.ssh/id_ed25519
