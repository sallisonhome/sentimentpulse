name: SP Road Kings Wishlist Check 2 (read-only, one-off)

"on":
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query Road Kings full wishlist/followers state
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "── Full product record for Road Kings (pid=20) ──"
          sqlite3 -header -column "$DB" "SELECT id, title, publisher, is_saber_published, steam_app_id, release_date, created_at, updated_at, forecast_mode FROM products WHERE id=20;"
          echo
          echo "── All wishlist_rank rows for pid=20 (should be all-time) ──"
          sqlite3 -header -column "$DB" "SELECT * FROM steam_wishlist_rank_daily WHERE product_id=20 ORDER BY date;"
          echo
          echo "── steam_wishlist_daily (raw wishlist count, not rank) rows for pid=20, last 10 ──"
          sqlite3 -header -column "$DB" "SELECT * FROM steam_wishlist_daily WHERE product_id=20 ORDER BY date DESC LIMIT 10;"
          echo
          echo "── Compare: does Road Kings show up in the leaderboards.ts query set (Saber-published check)? publisher field for pid=20 ──"
          sqlite3 -header -column "$DB" "SELECT id, title, publisher, is_saber_published FROM products WHERE id IN (19,20);"

          echo
          echo "── Latest steam_followers row for pid=20 ──"
          sqlite3 -header -column "$DB" "SELECT * FROM steam_followers_daily WHERE product_id=20 ORDER BY date DESC LIMIT 3;"
          echo
          echo "── PLS milestones for pid=20 (check for Prepurchase Start) ──"
          sqlite3 -header -column "$DB" "SELECT category, name, actual_date, sort_order FROM pls_milestones WHERE product_id=20 AND deleted_at IS NULL ORDER BY sort_order;"
          echo
          echo "── steam_header_image_url for pid=20 (key art check) ──"
          sqlite3 -header -column "$DB" "SELECT id, title, steam_header_image_url FROM products WHERE id=20;"
          REMOTEEOF
