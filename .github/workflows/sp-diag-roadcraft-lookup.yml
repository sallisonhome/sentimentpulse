name: SP Diag RoadCraft Onboarding Lookup (one-off, read-only)

# 2026-08-27 — Read-only diagnostic ahead of onboarding RoadCraft (steam_app_id
# 2104890) into SignalPulse. Confirms: (1) RoadCraft isn't already a product,
# (2) column conventions used by comparable released Saber/Focus titles
# (SnowRunner, Insurgency: Sandstorm, Docked, World War Z, Toxic Commando,
# Tempest Rising) for publisher/platforms/playerFormat/genre, (3) current max
# product id, (4) confirms ingestion is not in-flight isn't checked here (done
# separately via the ops-token endpoint) - this is DB-read only.
# Deleted immediately after this diagnostic run per cleanup policy.

"on":
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query products conventions + RoadCraft existence check
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db

          echo "── RoadCraft already present? ──"
          sqlite3 -header -column "$DB" "
            SELECT id, title, steam_app_id FROM products
            WHERE title LIKE '%Road%Craft%' OR steam_app_id = '2104890';
          "

          echo ""
          echo "── Comparable released titles: full column values ──"
          sqlite3 -header -column "$DB" "
            SELECT id, title, publisher, is_saber_published, platforms,
                   player_format, genre, release_date, steam_app_id,
                   target_retail_price_usd, per_platform_pricing, forecast_mode
            FROM products
            WHERE title IN ('SnowRunner', 'Clive Barker''s Hellraiser: Revival',
                             'World War Z', 'John Carpenter''s Toxic Commando',
                             'Tempest Rising')
               OR title LIKE '%Insurgency%' OR title LIKE '%Docked%';
          "

          echo ""
          echo "── Max product id ──"
          sqlite3 -header -column "$DB" "SELECT MAX(id) AS max_id FROM products;"

          echo ""
          echo "── steam_wishlist_daily / steam_sales_daily row counts for SnowRunner (id 16, precedent for post-release backfill) ──"
          sqlite3 -header -column "$DB" "
            SELECT COUNT(*) AS wishlist_rows, MIN(date) AS first, MAX(date) AS last
            FROM steam_wishlist_daily WHERE product_id = 16;
          "
          sqlite3 -header -column "$DB" "
            SELECT COUNT(*) AS sales_rows, MIN(date) AS first, MAX(date) AS last
            FROM steam_sales_daily WHERE product_id = 16;
          "
          REMOTEEOF
