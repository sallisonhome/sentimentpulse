name: SignalPulse — Audited Steam overlap repair
"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry, apply]
        default: dry
        required: true
      expected_sha:
        description: Fresh reviewed manifest SHA (apply only)
        default: none
        required: true
concurrency:
  group: deploy-droplet
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts
      - name: Review or apply exact approved repair
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$MODE" == dry || "$MODE" == apply ]]
          [[ "$EXPECTED_SHA" == none || "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p evidence
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            root@104.236.239.46 "MODE=$MODE EXPECTED_SHA=$EXPECTED_SHA bash -s" <<'REMOTE' | tee evidence/operation.log
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"
          [ "$(git rev-parse HEAD)" = 0060341047bf4354e57da90cf87ee1cb8984f69b ]
          [ -f data.db ] && [ -x node_modules/.bin/tsx ]
          [ -f scripts/repair-steam-review-overlap.ts ]
          systemctl is-active --quiet signalpulse
          daily_state=$(systemctl show -p ActiveState --value signalpulse-daily.service)
          [[ "$daily_state" == inactive || "$daily_state" == failed ]]
          # Refuse concurrent collectors/estimators; do not kill someone else's work.
          if pgrep -af '(tsx|node).*(scripts/collect-|scripts/estimate-console|scripts/discover-|scripts/seed-|scripts/evaluate-daily|scripts/repair-steam-review)'; then
            echo 'Refusing: maintenance process already active'; exit 1
          fi
          curl -fsS --max-time 15 http://127.0.0.1:8000/api/ingest/status |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["is_running"] is False; print("Sentiment ingestion idle")'
          export DB_PATH="$WD/data.db" AS_OF=2026-09-25
          OUT="$WD/repair-backups/overlap-ops-2026-09-25"
          if [ "$MODE" = dry ]; then
            node_modules/.bin/tsx scripts/repair-steam-review-overlap.ts
            exit 0
          fi
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          timer_was_active=0
          if systemctl is-active --quiet signalpulse-daily.timer; then
            timer_was_active=1
            systemctl stop signalpulse-daily.timer
          fi
          restore_timer() { if [ "$timer_was_active" = 1 ]; then systemctl start signalpulse-daily.timer; fi; }
          trap restore_timer EXIT
          daily_state=$(systemctl show -p ActiveState --value signalpulse-daily.service)
          [[ "$daily_state" == inactive || "$daily_state" == failed ]]
          mkdir -p "$OUT"; chmod 700 "$WD/repair-backups" "$OUT"
          export OUT
          node <<'NODE'
          const D=require('better-sqlite3'),fs=require('fs'),crypto=require('crypto');
          const db=new D(process.env.DB_PATH,{readonly:true});
          const tables=['steam_review_history','store_rating_signal_daily','ownership_multipliers','title_multiplier_overrides','revenue_calibration_anchors'];
          const hash=t=>crypto.createHash('sha256').update(JSON.stringify(db.prepare(`SELECT * FROM ${t} ORDER BY rowid`).all())).digest('hex');
          fs.writeFileSync(process.env.OUT+'/before.json',JSON.stringify({
            states:db.prepare('SELECT * FROM title_ltd_state ORDER BY title_id,platform').all(),
            hashes:Object.fromEntries(tables.map(t=>[t,hash(t)]))
          })); db.close();
          NODE
          node_modules/.bin/tsx scripts/repair-steam-review-overlap.ts \
            --apply --confirm CONFIRM --expected-sha "$EXPECTED_SHA" | tee "$OUT/result.json"
          node <<'NODE'
          const D=require('better-sqlite3'),fs=require('fs'),assert=require('assert/strict'),crypto=require('crypto');
          const db=new D(process.env.DB_PATH,{readonly:true});
          const out=process.env.OUT,b=JSON.parse(fs.readFileSync(out+'/before.json')),r=JSON.parse(fs.readFileSync(out+'/result.json'));
          assert.equal(r.repaired,127); assert.ok(fs.statSync(r.backup).size>0);
          const audit=db.prepare('SELECT * FROM steam_overlap_repair_audit WHERE run_id=?').all(r.runId);
          assert.equal(audit.length,127);
          const ids=new Set(audit.map(a=>a.title_id));
          for(const old of b.states) {
            if(old.platform==='steam'&&ids.has(old.title_id)) continue;
            assert.deepEqual(db.prepare('SELECT * FROM title_ltd_state WHERE title_id=? AND platform=?').get(old.title_id,old.platform),old);
          }
          for(const [t,h] of Object.entries(b.hashes)) assert.equal(crypto.createHash('sha256').update(JSON.stringify(db.prepare(`SELECT * FROM ${t} ORDER BY rowid`).all())).digest('hex'),h);
          assert.equal(db.prepare("SELECT ltd_units FROM title_ltd_state WHERE title_id=10014 AND platform='steam'").get().ltd_units,838342);
          console.log(JSON.stringify({repairOnlyVerified:true,repaired:127,untouchedStates:b.states.length-127,backup:r.backup,runId:r.runId}));
          db.close();
          NODE
          LTD_FLAG=$(systemctl show -p Environment --value signalpulse | tr ' ' '\n' | sed -n 's/^LTD_ACCUMULATOR_ENABLED=//p' | head -n1)
          [ "$LTD_FLAG" = 1 ]
          export LTD_ACCUMULATOR_ENABLED="$LTD_FLAG"
          timeout 180 node_modules/.bin/tsx scripts/estimate-console-units.ts > "$OUT/estimator-first.log" 2>&1
          sqlite3 -json data.db "SELECT title_id,platform,window,signal_value,units_mid,method,gated_reason FROM window_estimates_daily WHERE as_of_date='$AS_OF' ORDER BY title_id,platform,window" > "$OUT/first-numeric.json"
          timeout 180 node_modules/.bin/tsx scripts/estimate-console-units.ts > "$OUT/estimator-second.log" 2>&1
          sqlite3 -json data.db "SELECT title_id,platform,window,signal_value,units_mid,method,gated_reason FROM window_estimates_daily WHERE as_of_date='$AS_OF' ORDER BY title_id,platform,window" > "$OUT/second-numeric.json"
          cmp "$OUT/first-numeric.json" "$OUT/second-numeric.json"
          timeout 60 node_modules/.bin/tsx scripts/evaluate-daily-revenue-mix.ts | tee "$OUT/daily-mix.log"
          node <<'NODE'
          const D=require('better-sqlite3'),fs=require('fs'),assert=require('assert/strict'),crypto=require('crypto');
          const db=new D(process.env.DB_PATH,{readonly:true});
          const b=JSON.parse(fs.readFileSync(process.env.OUT+'/before.json'));
          for(const [t,h] of Object.entries(b.hashes)) assert.equal(crypto.createHash('sha256').update(JSON.stringify(db.prepare(`SELECT * FROM ${t} ORDER BY rowid`).all())).digest('hex'),h, t+' changed');
          const rows=db.prepare('SELECT window,signal_value,units_mid,method FROM window_estimates_daily WHERE title_id=10014 AND platform=? AND as_of_date=? ORDER BY window').all('steam',process.env.AS_OF);
          assert.equal(rows.length,5);
          assert.equal(rows.find(r=>r.window==='ltd').units_mid,838342);
          for(const r of rows) { assert.ok(r.signal_value<=20854); assert.ok(r.method.includes('steam_histogram_nonoverlap_v1')); }
          console.log(JSON.stringify({estimatorIdempotent:true,protectedInputsUnchanged:true,zeroCompany:rows}));
          db.close();
          NODE
          echo 'Repair, estimator refresh, repeat-run and daily-mix verification completed'
          REMOTE
      - name: Retain non-secret repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-overlap-operation-${{ inputs.mode }}
          path: evidence/
          retention-days: 30
