name: SignalPulse — Classification and timer safety rollout
"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, install]
        default: preflight
        required: true
      expected_head:
        description: Exact approved deployed commit
        required: true
concurrency:
  group: deploy-droplet
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts
      - name: Verify idle state and apply approved timer unit only
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          [[ "$MODE" == preflight || "$MODE" == install ]]
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p evidence
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            root@104.236.239.46 "MODE=$MODE EXPECTED_HEAD=$EXPECTED_HEAD bash -s" <<'REMOTE' | tee evidence/safety.log
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          systemctl is-active --quiet signalpulse
          systemctl is-active --quiet signalpulse-daily.timer
          daily_state=$(systemctl show -p ActiveState --value signalpulse-daily.service)
          [[ "$daily_state" == inactive || "$daily_state" == failed ]]
          if pgrep -af '(tsx|node).*(scripts/verify-discovery|scripts/verify-console-collectors|scripts/estimate-console|scripts/collect-|scripts/discover-|scripts/seed-|scripts/evaluate-daily|scripts/repair-steam-review)'; then
            echo 'Refusing: another maintenance process is active'; exit 1
          fi
          curl -fsS --max-time 15 http://127.0.0.1:8000/api/ingest/status |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["is_running"] is False; print("Sentiment ingestion idle")'
          TOKEN=$(sed -n 's/^INGESTION_OPS_TOKEN=//p' /etc/signalpulse/env)
          [ -n "$TOKEN" ]
          curl -fsS --max-time 15 -H "x-ops-token: $TOKEN" http://127.0.0.1:5000/api/ingestion/status |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["inFlight"] is False; print("SignalPulse ingestion idle")'
          unset TOKEN
          START_BEFORE=$(systemctl show -p ExecMainStartTimestamp --value signalpulse-daily.service)
          NEXT_BEFORE=$(systemctl show -p NextElapseUSecRealtime --value signalpulse-daily.timer)
          UNIT=$(systemctl show -p FragmentPath --value signalpulse-daily.timer)
          [ -f "$UNIT" ]
          echo "Deployed head: $EXPECTED_HEAD"
          echo "Daily state: $daily_state; last start: $START_BEFORE"
          echo "Next scheduled activation before: $NEXT_BEFORE"
          systemctl show -p Requires,TimersCalendar,Persistent,RandomizedDelayUSec signalpulse-daily.timer
          node <<'NODE'
          const D=require('better-sqlite3'),assert=require('assert/strict');
          const db=new D('data.db',{readonly:true});
          const sku=db.prepare("SELECT business_model FROM platform_sku_map WHERE platform='steam' AND external_sku='2075800'").get();
          assert.equal(sku.business_model,'paid');
          const ltd=db.prepare("SELECT ltd_units FROM title_ltd_state WHERE title_id=10014 AND platform='steam'").get();
          assert.equal(ltd.ltd_units,838342);
          console.log(JSON.stringify({zeroCompanyPaid:true,steamLifetimeUnits:ltd.ltd_units}));db.close();
          NODE
          if [ "$MODE" = preflight ]; then exit 0; fi
          SOURCE="$WD/deploy/signalpulse-daily.timer"
          # Ensure installation changes only the unwanted activation dependency,
          # never the existing calendar, persistence, jitter or target service.
          python3 - "$UNIT" "$SOURCE" <<'PY'
          import configparser,sys
          old,new=(configparser.ConfigParser(interpolation=None) for _ in range(2))
          old.read(sys.argv[1]);new.read(sys.argv[2])
          assert dict(old["Timer"])==dict(new["Timer"]), "Timer schedule/settings changed"
          assert dict(old["Install"])==dict(new["Install"])
          assert not new.has_option("Unit","Requires")
          PY
          node_modules/.bin/tsx --test server/steam-classification-preservation.test.ts
          BACKUP="$WD/repair-backups/timer-before-safety-$(date -u +%Y%m%dT%H%M%SZ).timer"
          install -m 0600 "$UNIT" "$BACKUP"
          install -m 0644 "$SOURCE" "$UNIT"
          systemctl daemon-reload
          # No stop/start/restart of timer or daily service, and no collectors.
          systemctl is-active --quiet signalpulse-daily.timer
          START_AFTER=$(systemctl show -p ExecMainStartTimestamp --value signalpulse-daily.service)
          [ "$START_BEFORE" = "$START_AFTER" ]
          daily_after=$(systemctl show -p ActiveState --value signalpulse-daily.service)
          [[ "$daily_after" == inactive || "$daily_after" == failed ]]
          REQUIREMENTS=$(systemctl show -p Requires --value signalpulse-daily.timer)
          if [[ " $REQUIREMENTS " == *" signalpulse-daily.service "* ]]; then
            echo 'Unexpected activation dependency remains'; exit 1
          fi
          cmp "$SOURCE" "$UNIT"
          echo "Retained timer backup: $BACKUP"
          echo "Daily service not started: $START_AFTER"
          echo "Next scheduled activation after: $(systemctl show -p NextElapseUSecRealtime --value signalpulse-daily.timer)"
          systemctl show -p Requires,TimersCalendar,Persistent,RandomizedDelayUSec signalpulse-daily.timer
          echo 'PASS: deployed classifier regressions, unchanged schedule, active timer, no discovery activation'
          REMOTE
      - name: Retain non-secret safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-timer-safety-${{ inputs.mode }}
          path: evidence/
          retention-days: 30
