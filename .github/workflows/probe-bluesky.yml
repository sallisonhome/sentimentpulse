name: Probe Bluesky from Droplet

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Probe
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            echo "## droplet outbound IP"
            curl -sS https://api.ipify.org && echo

            echo ""
            echo "## Bluesky search response from droplet"
            curl -sS -A "SentimentPulse/1.0 (Saber Interactive game intel)" \
                 -H "Accept: application/json" \
                 -o /tmp/bsky.json \
                 -w "HTTP_CODE=%{http_code} TIME=%{time_total}s\n" \
                 "https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=%22Warhammer%2040%2C000%3A%20Space%20Marine%202%22&limit=5&sort=latest"

            echo ""
            echo "## response body (first 400 chars)"
            head -c 400 /tmp/bsky.json
            echo ""

            echo ""
            echo "## valid JSON with posts?"
            python3 -c "
            import json
            try:
                d = json.load(open('/tmp/bsky.json'))
                posts = d.get('posts', [])
                print(f'posts: {len(posts)}')
                if posts:
                    print(f'first author: {posts[0].get(\"author\", {}).get(\"handle\", \"?\")}')
                    text = posts[0].get('record', {}).get('text', '')
                    print(f'first text: {text[:100]}')
            except Exception as e:
                print(f'parse error: {e}')
            "
          EOF
