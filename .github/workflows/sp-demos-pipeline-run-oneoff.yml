name: SP demos pipeline run (one-off, Rideshare fix)

on:
  workflow_dispatch: {}

concurrency:
  group: sp-demos-pipeline-oneoff
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run demos pipeline server-side (ops token never leaves droplet)
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          cat > /tmp/run.py <<'PYS'
          import json, re, shlex, urllib.request
          env = open('/etc/signalpulse/env').read()
          m = re.search(r'^INGESTION_OPS_TOKEN=["\']?([^"\'\n]+)', env, re.M)
          token = shlex.split(m.group(1), comments=True, posix=True)[0] if m else ''
          if not token:
              raise SystemExit('ops token not found')
          # Synchronous full demos pipeline (discovery now runs BEFORE the
          # Saber collectors; includes the fixed download-report parser).
          req = urllib.request.Request(
              'http://127.0.0.1:5000/api/ops/demos-pipeline-run',
              data=b'{}', method='POST',
              headers={'x-ops-token': token, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=2700) as r:
              result = json.loads(r.read())
          keep = {k: result.get(k) for k in
                  ('seeded', 'discovery', 'eligibility', 'reviewHistory', 'ccu',
                   'estimates', 'portalActualsFetch', 'actuals',
                   'dashboardActuals', 'datedActuals', 'friendsPass')}
          print('PIPELINE_RESULT=' + json.dumps(keep)[:3500])
          PYS
          ssh -i ~/.ssh/id_ed25519 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=80 \
              -o StrictHostKeyChecking=accept-new root@104.236.239.46 'python3 -' < /tmp/run.py
