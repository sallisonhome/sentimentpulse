name: sp-saber-auth-status
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 << 'REMOTE'
            echo "=== systemctl status ==="
            systemctl status saber-auth --no-pager -n 50 || true
            echo ""
            echo "=== journalctl last 60 ==="
            journalctl -u saber-auth -n 60 --no-pager
            echo ""
            echo "=== auth.js first 55 lines (post-patch) ==="
            head -55 /opt/saber-auth/server/routes/auth.js
          REMOTE
