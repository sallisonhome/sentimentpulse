name: Count Regen Scope

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Count
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            cd /opt/sentimentpulse/backend

            echo "── window_summaries: rows per window_days ──"
            sqlite3 -header -column sentimentpulse.db "SELECT window_days, COUNT(*) AS n FROM window_summaries GROUP BY window_days ORDER BY window_days;"

            echo ""
            echo "── window_summaries total ──"
            sqlite3 sentimentpulse.db "SELECT COUNT(*) FROM window_summaries;"

            echo ""
            echo "── monthly_summaries: last 3 months per game ──"
            sqlite3 -header -column sentimentpulse.db "
              SELECT g.name,
                     COUNT(*) AS rows_in_last_3mo
              FROM monthly_summaries ms
              JOIN games g ON g.id = ms.game_id
              WHERE (ms.period_year * 100 + ms.period_month) >=
                    (CAST(strftime('%Y', date('now', '-3 months')) AS INTEGER) * 100 +
                     CAST(strftime('%m', date('now', '-3 months')) AS INTEGER))
              GROUP BY g.id
              ORDER BY rows_in_last_3mo DESC;
            "

            echo ""
            echo "── monthly_summaries total last 3 months across all games ──"
            sqlite3 sentimentpulse.db "
              SELECT COUNT(*) FROM monthly_summaries
              WHERE (period_year * 100 + period_month) >=
                    (CAST(strftime('%Y', date('now', '-3 months')) AS INTEGER) * 100 +
                     CAST(strftime('%m', date('now', '-3 months')) AS INTEGER));
            "
          EOF
