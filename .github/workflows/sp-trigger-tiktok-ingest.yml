name: SP Trigger TikTok Comment Ingest

# One-off: trigger SentimentPulse's full ingestion so the TikTok comment
# importer (newly enabled for the 6 core titles via app_settings) runs now
# instead of waiting for tomorrow's 02:00 local APScheduler slot.
#
# POSTs to SentimentPulse's /api/ingest/run on 127.0.0.1:8000 (loopback,
# no auth dependency on that endpoint). Returns 202 immediately; the
# ingestion runs in the background. Poll GET /api/ingest/status for progress.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger SentimentPulse ingestion
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            echo "── SentimentPulse health check ──"
            curl -sS --max-time 10 http://127.0.0.1:8000/api/health 2>&1 | head -3
            echo ""
            echo "── POST /api/ingest/run ──"
            HTTP_CODE=$(curl -sS -o /tmp/ingest_resp.json -w "%{http_code}" --max-time 30 -X POST http://127.0.0.1:8000/api/ingest/run 2>&1)
            echo "HTTP: $HTTP_CODE"
            cat /tmp/ingest_resp.json | head -5
          EOF
