name: Inspect Droplet Layout

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            cd /opt/sentimentpulse/backend
            echo "── alembic current ──"
            source .venv/bin/activate
            alembic current
            deactivate
            echo ""
            echo "── games with distinctive_keywords ──"
            sqlite3 sentimentpulse.db "SELECT name, json_array_length(distinctive_keywords) AS kw_count FROM games WHERE distinctive_keywords IS NOT NULL AND distinctive_keywords != '[]' ORDER BY name;"
            echo ""
            echo "── games WITHOUT keywords (filter passes all posts) ──"
            sqlite3 sentimentpulse.db "SELECT id, name FROM games WHERE distinctive_keywords IS NULL OR distinctive_keywords = '[]' ORDER BY id;"
            echo ""
            echo "── John Wick game info ──"
            sqlite3 sentimentpulse.db "SELECT id, name, distinctive_keywords FROM games WHERE name LIKE '%John Wick%';"
            echo ""
            echo "── John Wick topic_trends (recent 30 days) ──"
            sqlite3 sentimentpulse.db "SELECT label, sentiment, post_count FROM topic_trends WHERE game_id IN (SELECT id FROM games WHERE name LIKE '%John Wick%') AND created_at > datetime('now','-30 days') ORDER BY post_count DESC LIMIT 20;"
            echo ""
            echo "── service status ──"
            systemctl is-active sentimentpulse
          EOF
