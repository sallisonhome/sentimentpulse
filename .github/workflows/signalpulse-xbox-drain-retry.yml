name: SignalPulse — Drain Xbox title retry queue

# Hourly worker. Any bigId that failed all 3 resolvers when first sighted
# (chart-position-driven discovery) lives in xbox_bigid_retry_queue with
# next_attempt_at set by the resolver. Retry cadence:
#   - hourly for the first 24 attempts
#   - daily after that
# A landed row is inserted immutably into xbox_title_cache and removed
# from the queue.
#
# This workflow is a cheap no-op when nothing is due. It runs on cron and
# is dispatchable for on-demand kicks.

on:
  schedule:
    # Every hour on the top of the hour, UTC. Cheap when nothing due.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: xbox-title-retry
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run drain-xbox-retry-queue
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          [ -n "$WD" ] || { echo "ERR: no signalpulse WorkingDirectory"; exit 1; }
          cd "$WD"

          if [ ! -f scripts/drain-xbox-retry-queue.ts ]; then
            echo "drain script missing on droplet — nothing to do this pass"
            exit 0
          fi
          [ -x node_modules/.bin/tsx ] || { echo "ERR: tsx missing"; exit 1; }

          if [ -f /etc/signalpulse/env ]; then
            set -a
            . /etc/signalpulse/env
            set +a
          fi
          export NODE_ENV="${NODE_ENV:-production}"

          # ~10s per bigId * 50 due max = 500s; 8 min ceiling.
          timeout 480 ./node_modules/.bin/tsx scripts/drain-xbox-retry-queue.ts
          REMOTE
