name: SP PLS Insert RoadCraft + Road Kings Full Backfill (one-off)

"on":
  workflow_dispatch: {}

jobs:
  insert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Insert RoadCraft + Road Kings PLS backfill
