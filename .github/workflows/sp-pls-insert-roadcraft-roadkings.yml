            (20, 'core', 'Steam store page updated to March 11, 2027; simultaneous PC/PS5/Xbox launch confirmed', NULL, '2026-08-25', 0, 46, '$NOW', '$NOW'),
            (20, 'press_coverage', 'Gamescom ONL 2026 press wave confirms delay to 2027-03-11 (PC Gamer, TechRadar, Gematsu, Push Square, IXBT)', NULL, '2026-08-25', 0, 47, '$NOW', '$NOW');
          COMMIT;
          "
          echo "── Post-insert verification: RoadCraft (pid=19) ──"
          sqlite3 -header -column "$DB" "SELECT id, sort_order, category, actual_date, substr(name,1,60) FROM pls_milestones WHERE product_id=19 AND deleted_at IS NULL ORDER BY sort_order;"
          echo "── Post-insert verification: Road Kings (pid=20) ──"
          sqlite3 -header -column "$DB" "SELECT id, sort_order, category, actual_date, substr(name,1,60) FROM pls_milestones WHERE product_id=20 AND deleted_at IS NULL ORDER BY sort_order;"
          echo "── Row count check ──"
          sqlite3 "$DB" "SELECT 'RoadCraft rows: ' || COUNT(*) FROM pls_milestones WHERE product_id=19 AND deleted_at IS NULL;"
