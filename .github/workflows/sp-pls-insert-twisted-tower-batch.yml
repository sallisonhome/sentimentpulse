name: SP PLS Insert Twisted Tower Batch (one-off)

# 2026-08-23 — One-off insert of new PLS milestones for Twisted Tower
# (product_id=17) discovered via web research of the last 30 days,
# post-launch (existing milestone id=630 already covers the Aug 18
# Steam Launch day, so these two are strictly new/distinct events).
# Deleted immediately after this diagnostic run per cleanup policy.

"on":
  workflow_dispatch: {}

jobs:
  insert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Insert Twisted Tower PLS milestones
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          echo "── Inserting new Twisted Tower (product_id=17) milestones ──"
          sqlite3 "$DB" "
            INSERT INTO pls_milestones (product_id, category, name, target_date, actual_date, is_default, sort_order, created_at, updated_at)
            VALUES
              (17, 'press_coverage', 'Steam reviews reach Overwhelmingly Positive (~96%%, 590+ reviews)', '2026-08-20', '2026-08-20', 0, 51, '$NOW', '$NOW'),
              (17, 'press_coverage', 'Kotaku Review: A Creepier, Shorter BioShock-like FPS', '2026-08-20', '2026-08-20', 0, 52, '$NOW', '$NOW');
          "

          echo ""
          echo "── Verification: all Twisted Tower milestones, newest actualDate first ──"
          sqlite3 -header -column "$DB" "
            SELECT m.id, m.category, m.name, m.target_date, m.actual_date, m.is_default, m.sort_order
            FROM pls_milestones m
            JOIN products p ON p.id = m.product_id
            WHERE p.id = 17
              AND m.deleted_at IS NULL
            ORDER BY m.sort_order DESC
            LIMIT 6;
          "
          REMOTEEOF
