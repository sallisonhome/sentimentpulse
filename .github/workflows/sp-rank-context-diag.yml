name: SP Rank Context Diagnostic (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/signalpulse

            echo "── Products on the sales/wishlist leaderboard with their Steam appid ──"
            sqlite3 -header -column data.db "SELECT id, name, steam_app_id FROM products WHERE steam_app_id IS NOT NULL ORDER BY id;" || true

            echo ""
            echo "── steam_wishlist_rank_daily, last 10 days, all products ──"
            sqlite3 -header -column data.db "SELECT product_id, date, rank FROM steam_wishlist_rank_daily WHERE date >= date('now','-10 day') ORDER BY product_id, date;" || true

            echo ""
            echo "── Best (lowest/highest-profile) rank ever recorded per product ──"
            sqlite3 -header -column data.db "SELECT product_id, MIN(rank) as best_rank, MAX(rank) as worst_rank, COUNT(*) as n_days FROM steam_wishlist_rank_daily WHERE rank IS NOT NULL GROUP BY product_id ORDER BY product_id;" || true
          EOF
