name: sp-diag-wishlist-card
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Check nginx location-block context for proxy_cache
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -e
          echo "=== nginx sentimentpulse config, lines 60-140 (location blocks) ==="
          sed -n '60,140p' /etc/nginx/sites-available/sentimentpulse
          REMOTEEOF
