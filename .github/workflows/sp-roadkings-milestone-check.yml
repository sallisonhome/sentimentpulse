name: SP Road Kings Milestone Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check Road Kings (product_id=20) PLS milestones and products.release_date
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            DB=/opt/sentimentpulse/signalpulse/data.db

            echo "── products.release_date for id=20 ──"
            sqlite3 -header -column "$DB" "SELECT id, title, release_date FROM products WHERE id = 20;"

            echo ""
            echo "── pls_milestones for product_id=20 ──"
            sqlite3 -header -column "$DB" "SELECT id, product_id, category, name, target_date, actual_date, is_default, deleted_at FROM pls_milestones WHERE product_id = 20 ORDER BY id;"
          EOF
