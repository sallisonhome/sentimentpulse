name: SignalPulse — PS5 discovery rollback (one-shot cleanup)

# One-shot cleanup for the botched PS5 auto-discovery run on 2026-09-11.
#
# What happened: commit 478a9fc shipped discoverPs5TopSelling() which wrote
# npTitleId-only external_sku values (e.g. PPSA01547_00) into
# platform_sku_map. The PS collector's productRetrieve endpoint requires
# full PSN concept-productIds (UP****-PPSA*****_00-****), so every one of
# those 100 rows fails collection.
#
# This workflow:
#   1. Prints the pre-delete count for the audit trail.
#   2. Deletes ONLY rows matching business_model_source =
#      'ps_categoryGridRetrieve.sales30' AND is_manual_override = 0.
#      Manual seeds (is_manual_override=1) are untouched.
#   3. Prints the post-delete count.
#
# Concurrency: shares deploy-droplet with the deploy + seed workflows.
#
# After running this, the follow-up fix in discovery.ts will enrich
# npTitleIds to full productIds before writing, and the seed workflow
# can be re-run cleanly.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm'
        required: true
        default: ''

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "ERR: input 'confirm' must be exactly 'DELETE' (got: $CONFIRM)"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Delete PS5 auto-discovered rows
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          DB="$WD/data.db"
          [ -f "$DB" ] || { echo "ERR: DB missing"; exit 1; }

          echo "── Pre-delete PS5 row counts by source ──"
          sqlite3 -header -column "$DB" "
            SELECT business_model_source,
                   COUNT(*) AS n,
                   SUM(is_manual_override) AS manual
              FROM platform_sku_map
             WHERE platform = 'ps5'
             GROUP BY business_model_source
             ORDER BY n DESC;"

          echo ""
          echo "── Deleting auto-discovered rows (guarded: is_manual_override=0) ──"
          sqlite3 "$DB" "
            DELETE FROM platform_sku_map
             WHERE platform = 'ps5'
               AND business_model_source = 'ps_categoryGridRetrieve.sales30'
               AND is_manual_override = 0;"
          echo "deleted rows: $(sqlite3 "$DB" 'SELECT changes();')"

          echo ""
          echo "── Post-delete PS5 row counts by source ──"
          sqlite3 -header -column "$DB" "
            SELECT business_model_source,
                   COUNT(*) AS n,
                   SUM(is_manual_override) AS manual
              FROM platform_sku_map
             WHERE platform = 'ps5'
             GROUP BY business_model_source
             ORDER BY n DESC;"
          REMOTE
