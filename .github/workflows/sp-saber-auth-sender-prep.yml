name: sp-saber-auth-sender-prep
on: workflow_dispatch
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 << 'REMOTE'
            set -e
            ENV=/opt/saber-auth/.env
            echo "== Before =="
            grep -E '^(RESEND_FROM|RESEND_API_KEY)' $ENV | sed -E 's/(RESEND_API_KEY=)([^=]{4}).*/\1\2..REDACTED/'
            # Save current key so we can restore later
            grep -E '^RESEND_API_KEY=' $ENV > /root/.saber-auth-resend-key.bak
            # Blank the key and set the new FROM
            sed -i -E 's|^RESEND_API_KEY=.*|RESEND_API_KEY=|' $ENV
            if grep -qE '^RESEND_FROM=' $ENV; then
              sed -i -E "s|^RESEND_FROM=.*|RESEND_FROM=Saber Suite <saber-suite@mail.howmanyareplaying.com>|" $ENV
            else
              echo 'RESEND_FROM=Saber Suite <saber-suite@mail.howmanyareplaying.com>' >> $ENV
            fi
            echo "== After =="
            grep -E '^(RESEND_FROM|RESEND_API_KEY)' $ENV | sed -E 's/(RESEND_API_KEY=)([^=]{4}).*/\1\2..REDACTED/'
            systemctl restart saber-auth
            sleep 2
            systemctl is-active saber-auth
            curl -sS http://127.0.0.1:5100/auth/api/me -w '\n[status %{http_code}]\n' || true
          REMOTE
