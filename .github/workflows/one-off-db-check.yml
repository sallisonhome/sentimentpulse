name: One-off SignalPulse DB Check

on:
  workflow_dispatch:

jobs:
  verify-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify steamworks_sessions schema (read-only)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -euo pipefail
          DB_PATH=/opt/sentimentpulse/signalpulse/data.db
          [ -f "$DB_PATH" ] || { echo "ERR: missing $DB_PATH"; exit 1; }
          echo "== PRAGMA table_info(steamworks_sessions) =="
          sqlite3 "$DB_PATH" "PRAGMA table_info(steamworks_sessions);"
          REMOTEEOF
