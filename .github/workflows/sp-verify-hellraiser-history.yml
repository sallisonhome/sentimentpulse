name: One-off - verify Hellraiser wishlist rank history
on:
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test whether the stored Steam session bypasses the age-gate (no secret ever leaves the droplet)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -euo pipefail
          COOKIE=$(sqlite3 /opt/sentimentpulse/signalpulse/data.db "SELECT cookie_value FROM steamworks_sessions LIMIT 1;")
          echo "cookie length: ${#COOKIE}"
          echo "--- anonymous request (control) ---"
          curl -s -o /dev/null -w "http_code=%{http_code} final_url=%{url_effective}\n" \
            -A "Mozilla/5.0" \
            "https://store.steampowered.com/app/1551980/"
          echo "--- with stored steamLoginSecure cookie ---"
          curl -s -o /dev/null -w "http_code=%{http_code} final_url=%{url_effective}\n" \
            -A "Mozilla/5.0" -H "Cookie: ${COOKIE}" -L \
            "https://store.steampowered.com/app/1551980/"
          echo "--- with cookie, check search endpoint finds it ---"
          RESULT=$(curl -s -A "Mozilla/5.0" -H "Cookie: ${COOKIE}" \
            "https://store.steampowered.com/search/results/?term=Hellraiser+Revival&json=1&count=10")
          echo "search result: $RESULT"
          unset COOKIE
          REMOTEEOF
