name: One-off - verify today's wishlist ingestion run for Hellraiser
on:
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Find how the app process is managed and pull today's wishlist logs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          echo "=== Process manager check ==="
          command -v pm2 || echo "no pm2 on PATH"
          su - root -c 'command -v pm2' 2>/dev/null || echo "no pm2 via login shell"
          ls -la /root/.nvm/versions/node/*/bin/pm2 2>/dev/null || echo "no nvm pm2"
          systemctl list-units --type=service --all 2>/dev/null | grep -i sentiment || echo "no systemd service matching sentiment"
          ps aux | grep -i "node\|signalpulse" | grep -v grep

          echo ""
          echo "=== journalctl for the service (if systemd) ==="
          systemctl list-units --type=service --all 2>/dev/null | grep -iE "signal|sentiment"

          echo ""
          echo "=== Recent log files on disk ==="
          find /opt/sentimentpulse -iname "*.log" -mmin -1440 2>/dev/null
          find /root/.pm2/logs -iname "*.log" 2>/dev/null
          REMOTEEOF
