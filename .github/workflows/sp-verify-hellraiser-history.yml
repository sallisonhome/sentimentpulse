name: One-off - verify today's wishlist ingestion run for Hellraiser
on:
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull today's signalpulse.service journal around the 07:00 UTC ingestion run
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          echo "=== journal entries mentioning wishlist, 06:55-07:15 UTC today ==="
          journalctl -u signalpulse.service --since "2026-08-20 06:55:00" --until "2026-08-20 07:15:00" --no-pager | grep -i "wishlist" 

          echo ""
          echo "=== journal entries mentioning wishlist/error/429, full day so far ==="
          journalctl -u signalpulse.service --since "2026-08-20 00:00:00" --no-pager | grep -iE "wishlist|429|error" | head -100

          echo ""
          echo "=== Was there a service restart between 06:55 and 07:15 that could have interrupted the run? ==="
          journalctl -u signalpulse.service --since "2026-08-20 06:55:00" --until "2026-08-20 07:15:00" --no-pager | grep -iE "start|stop|restart" || echo "no restart in that window"
          REMOTEEOF
