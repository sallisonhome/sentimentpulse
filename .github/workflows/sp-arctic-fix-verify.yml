name: SP Arctic Shift Fix Verify (one-off)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend

            echo "── 1. Confirm deployed commit is a2e60fb ──"
            git log -1 --format="%H  %s" || true
            echo ""

            echo "── 2. In-process smoke test: is _game_search_query importable & shared? ──"
            .venv/bin/python -c "
          from services.arctic_shift_service import _game_search_query as ass_gsq
          from services.reddit_service import _game_search_query as rs_gsq
          import inspect
          print(f'arctic_shift._game_search_query source file: {inspect.getsourcefile(ass_gsq)}')
          print(f'reddit_service._game_search_query source file: {inspect.getsourcefile(rs_gsq)}')
          print(f'same object: {ass_gsq is rs_gsq}')
          print(f'signature: {inspect.signature(ass_gsq)}')
          # Sanity: call with the exact shape production uses
          r1 = ass_gsq('Halloween: The Game')
          r2 = ass_gsq('Halloween: The Game', game=None)
          print(f'positional call result: {r1!r}')
          print(f'game=None kwarg call result: {r2!r}')
          "
            echo ""

            echo "── 3. Live arctic_shift call to a general sub with a game kwarg ──"
            # This is the exact call path that was raising TypeError.
            # We hit r/gaming for game=Halloween (140), one of the games in
            # the morning journal errors. Only 5 posts to keep it quick.
            .venv/bin/python -c "
          from services.arctic_shift_service import fetch_arctic_shift_subreddit_posts
          from db.database import SessionLocal
          from db.models import Game
          db = SessionLocal()
          game = db.query(Game).filter(Game.id == 140).first()
          if game is None:
              print('game 140 not found — skipping live call')
          else:
              print(f'Testing r/gaming general-sub fetch for game={game.name!r} (id={game.id})')
              posts = fetch_arctic_shift_subreddit_posts(
                  'gaming', limit=5, game_name=game.name,
                  is_general_sub=True, game=game,
              )
              print(f'result: got {len(posts)} posts (no TypeError = fix working)')
              for p in posts[:3]:
                  print(f'  - {p[\"title\"][:100]!r}')
          db.close()
          "
            echo ""

            echo "── 4. Count 'unexpected keyword argument' errors in last 30 min ──"
            journalctl -u sentimentpulse --no-pager --since "30 minutes ago" \
              | grep -c "unexpected keyword argument 'game'" || echo "0"
          EOF
