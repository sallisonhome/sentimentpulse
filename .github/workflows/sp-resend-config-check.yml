name: SP Resend - Align SignalPulse with SentimentPulse config

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy working Resend key + verified domain into SignalPulse settings
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail

            # Read SentimentPulse's confirmed-working Resend API key from the
            # shared .env. Never echoed — used only inline in curl calls below.
            KEY=$(grep -E '^RESEND_API_KEY=' /opt/sentimentpulse/.env | head -1 | cut -d'=' -f2-)
            if [ -z "$KEY" ]; then
              echo "ERROR: could not read RESEND_API_KEY from .env"
              exit 1
            fi

            echo "── 1. Push key into SignalPulse settings (response is masked, safe to print) ──"
            curl -s -X PUT http://127.0.0.1:5000/api/settings/resend_api_key \
              -H "x-app-password: SABER" -H "Content-Type: application/json" \
              -d "{\"value\":\"$KEY\"}" | python3 -m json.tool

            unset KEY

            echo ""
            echo "── 2. Set resend_from to the already-verified domain (same one SentimentPulse uses) ──"
            curl -s -X PUT http://127.0.0.1:5000/api/settings/resend_from \
              -H "x-app-password: SABER" -H "Content-Type: application/json" \
              -d '{"value":"signalpulse@mail.howmanyareplaying.com"}' | python3 -m json.tool

            echo ""
            echo "── 3. Confirm settings updated (masked) ──"
            curl -s http://127.0.0.1:5000/api/settings -H "x-app-password: SABER" | python3 -c "
import json,sys
for s in json.load(sys.stdin):
    if 'resend' in s['key']:
        print(s)
"

            echo ""
            echo "── 4. Send real test digest to the FULL production recipient list ──"
            curl -s -w '\nHTTP_STATUS:%{http_code}\n' -X POST http://127.0.0.1:5000/api/leaderboards/email-recipients/test-send \
              -H "x-app-password: SABER" -H "Content-Type: application/json"
          EOF
