name: One-off — list nginx sites-enabled

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: List nginx configs + saber-auth status
        run: |
          ssh -i ~/.ssh/id_ed25519 root@104.236.239.46 'bash -s' <<'REMOTE'
          set -e
          echo "=== /etc/nginx/sites-enabled/ ==="
          ls -la /etc/nginx/sites-enabled/
          echo ""
          echo "=== /etc/nginx/sites-available/ ==="
          ls -la /etc/nginx/sites-available/
          echo ""
          echo "=== saber-auth service status ==="
          systemctl status saber-auth --no-pager | head -12
          echo ""
          echo "=== saber-auth /health via loopback ==="
          curl -sf http://127.0.0.1:5100/health && echo ""
          echo ""
          echo "=== saber-auth recent journal (last 60 lines) ==="
          journalctl -u saber-auth -n 60 --no-pager
          REMOTE
