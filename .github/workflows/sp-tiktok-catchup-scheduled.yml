name: SP TikTok Catchup (scheduled)

# Scheduled TikTok comment import into SentimentPulse.
# Runs AFTER SignalPulse's TikTok Pulse cron (4:30 AM ET) so the latest
# TikTok comments are imported and available in SentimentPulse by the time
# the daily SentimentPulse ingest runs at 2:00 AM local time.
#
# This is the fast, idempotent path — no full ingest needed.
# Idempotent: re-running is safe; dedup by game/source/external_id.

on:
  schedule:
    # 6:05 UTC = 1:05 AM ET (after the 4:30 AM ET TikTok Pulse cron completes)
    - cron: '5 6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run TikTok catch-up (6 core titles)
        run: |
          set -euo pipefail
          GAME_IDS="20,21,23,24,27,36"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@104.236.239.46 "GAME_IDS=$GAME_IDS bash -s" <<'REMOTE'
          set -euo pipefail
          exec 9>/run/lock/signalpulse-maintenance.lock
          flock -w 600 9 || { echo "Maintenance busy; no catch-up performed"; exit 75; }
          cd /opt/sentimentpulse/backend
          .venv/bin/python scripts/catchup_tiktok.py --game-ids "$GAME_IDS" \
            --max-pages 200 --max-seconds 180
          REMOTE
