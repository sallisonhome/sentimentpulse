name: SP TikTok Catchup (scheduled)

# Scheduled TikTok comment import into SentimentPulse.
# Runs AFTER SignalPulse's TikTok Pulse cron (4:30 AM ET, ~6:00 AM UTC)
# so the latest TikTok comments are imported and available in SentimentPulse
# by the time the daily SentimentPulse ingest runs at 2:00 AM local time.
#
# This is the fast, idempotent path — no full ingest needed.
# Idempotent: re-running is safe; dedup by game/source/external_id.

on:
  schedule:
    # 6:05 UTC = 1:05 AM ET (after the 4:30 AM ET TikTok Pulse cron completes)
    - cron: '5 6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run TikTok catch-up (6 core titles)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -uo pipefail
            cd /opt/sentimentpulse/backend
            echo "── Scheduled TikTok catch-up for games: 20,21,23,24,27,36 ──"
            source venv/bin/activate 2>/dev/null || true
            python3 scripts/catchup_tiktok.py --game-ids "20,21,23,24,27,36"
            echo "── Exit: $? ──"
          EOF
