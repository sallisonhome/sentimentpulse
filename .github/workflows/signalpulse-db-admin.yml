name: SignalPulse DB Admin (write)

# TEMPORARY BRANCH-ONLY workflow variant. Do not merge into main.
# Executes the owner's approved Expeditions onboarding without deploy/restart.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM for the approved Expeditions onboarding'
        required: true
      apply:
        description: 'Apply product, milestones and resumable historical backfills'
        type: boolean
        default: false
      through:
        description: 'Last completed UTC reporting day'
        required: true
        default: '2026-09-20'

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate scoped operation
        env:
          CONFIRM: ${{ inputs.confirm }}
          THROUGH: ${{ inputs.through }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = CONFIRM
          [[ "$THROUGH" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$GITHUB_REF" = refs/heads/ops/expeditions-onboarding
      - name: Configure existing maintenance SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts
      - name: Copy reviewed one-title runner
        run: |
          set -euo pipefail
          scp signalpulse/scripts/onboard-expeditions.ts \
            root@104.236.239.46:/opt/sentimentpulse/signalpulse/scripts/.ops-expeditions-${GITHUB_RUN_ID}.ts
          scp signalpulse/scripts/expeditions-milestones.json \
            root@104.236.239.46:/opt/sentimentpulse/signalpulse/scripts/.ops-expeditions-${GITHUB_RUN_ID}.json
      - name: Run independent maintenance process
        env:
          APPLY: ${{ inputs.apply }}
          THROUGH: ${{ inputs.through }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@104.236.239.46 \
            RUN_ID="$GITHUB_RUN_ID" APPLY="$APPLY" THROUGH="$THROUGH" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/sentimentpulse/signalpulse
          SCRIPT="scripts/.ops-expeditions-${RUN_ID}.ts"
          MANIFEST="$PWD/scripts/.ops-expeditions-${RUN_ID}.json"
          trap 'rm -f "$SCRIPT" "$MANIFEST"' EXIT
          mkdir -p /var/lib/signalpulse
          chmod 700 /var/lib/signalpulse
          export EXPEDITIONS_MANIFEST="$MANIFEST"
          export EXPEDITIONS_CONFIRM=CONFIRM
          export EXPEDITIONS_THROUGH="$THROUGH"
          if [ "$APPLY" = true ]; then
            if [ ! -f /var/lib/signalpulse/pre-expeditions.db ]; then
              sqlite3 data.db ".backup '/var/lib/signalpulse/pre-expeditions.db'"
            fi
            chmod 600 /var/lib/signalpulse/pre-expeditions.db
            flock -n /var/lib/signalpulse/expeditions-onboarding.lock \
              timeout 10000 ./node_modules/.bin/tsx "$SCRIPT" --apply
          else
            ./node_modules/.bin/tsx "$SCRIPT"
          fi
          REMOTE
