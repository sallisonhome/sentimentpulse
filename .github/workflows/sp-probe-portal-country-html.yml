name: SignalPulse — probe portal country HTML shape

# One-shot debug, 2026-09-05. Fetches ONE Steamworks portal page for SM2
# using the SAME already-authorized session cookie the daily cron uses,
# then prints ONLY the HTML fragment around each 'country'/'heatmap'
# occurrence (short excerpts, no dollar values, no cookies, no full HTML).
# Needed to extend the existing daily-sales portal parser to also capture
# country data.
#
# User pre-approved 2026-09-05. Delete file after this run.

"on":
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch + excerpt
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 "bash -s" <<'REMOTEEOF'
          set -euo pipefail

          DB=/opt/sentimentpulse/signalpulse/data.db

          # Read the same cookie the daily cron already uses. Comes back as
          # `steamLoginSecure=<value>`; we forward it exactly as-is (that
          # matches how server/steamworks-portal.ts builds the header).
          COOKIE=$(sqlite3 "$DB" "SELECT cookie_value FROM steamworks_sessions ORDER BY updated_at DESC LIMIT 1;")
          if [ -z "$COOKIE" ]; then
            echo "ERR: no steamworks session cookie configured"
            exit 1
          fi
          echo "== cookie: $(echo -n "$COOKIE" | wc -c) chars =="

          APPID=2183900   # SM2
          # Use a month window so the page renders with real numbers,
          # matching what the daily cron pulls.
          URL="https://partner.steampowered.com/app/details/${APPID}/?dateStart=2026-08-01&dateEnd=2026-08-31&priorDateStart=2026-07-01&priorDateEnd=2026-07-31&alignPriorAnnual=Immediate&submit=Update"

          echo "== fetching URL (appid ${APPID}) =="
          HTML=$(curl -sS --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Cookie: ${COOKIE}" \
            "$URL")
          BYTES=${#HTML}
          echo "html bytes: ${BYTES}"

          # Write to tmp so python can read
          TMP=$(mktemp)
          echo "$HTML" > "$TMP"
          echo ""

          # Redact any dollar values BEFORE printing anything — belt-and-
          # suspenders: even though the country/heatmap section is
          # non-monetary geo data, if there's an adjacent revenue cell
          # in the excerpt we don't want to leak it.
          TMP_PATH="$TMP" python3 <<'PYEOF'
          import re, os
          from pathlib import Path

          html = Path(os.environ['TMP_PATH']).read_text()

          # Redact anything that looks like a monetary value.
          def redact(text):
              text = re.sub(r'\$[\d,]+(?:\.\d+)?', '$REDACTED', text)
              text = re.sub(r'[\d,]{4,}', 'N-REDACTED', text)
              return text

          keywords = ['country', 'heatmap', 'Country', 'Heatmap', 'geo', 'territory', 'region', 'ISO', 'flag', 'World', 'world-map']
          seen = 0
          for kw in keywords:
              matches = list(re.finditer(kw, html))
              if not matches:
                  continue
              print(f"\n== keyword '{kw}': {len(matches)} match(es) ==")
              for m in matches[:5]:
                  start = max(0, m.start() - 150)
                  end   = min(len(html), m.end() + 350)
                  excerpt = html[start:end]
                  # Redact numerics inside the excerpt
                  excerpt = redact(excerpt)
                  # Collapse whitespace so it prints compactly
                  excerpt = re.sub(r'\s+', ' ', excerpt)
                  print(f"  offset {m.start()}: ...{excerpt}...")
                  seen += 1
                  if seen > 60:
                      break
              if seen > 60:
                  break
          if seen == 0:
              print("no keyword hits — HTML may not contain a country/heatmap section")
              # Fallback: print names of any JS var/functions that could be data
              js_hits = re.findall(r'(var|const|let)\s+([a-zA-Z_][a-zA-Z0-9_]{3,40}(?:country|Country|Region|Territory)[a-zA-Z0-9_]*)', html)
              print("JS symbols that reference country/region:", js_hits[:20])
          PYEOF

          rm -f "$TMP"
          echo ""
          echo "== DONE =="
          REMOTEEOF
