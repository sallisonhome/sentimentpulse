name: Delete Poisoned JW Summaries

# Deletes John Wick monthly summaries that still contain pre-§14+§15 polluted
# content ("horror", "free to play", "F2P", "suspense"). No regeneration —
# UI will show those months as empty.

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Delete poisoned summaries
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@104.236.239.46 << 'EOF'
            set -euo pipefail
            cd /opt/sentimentpulse/backend

            echo "── Before delete: poisoned rows ──"
            sqlite3 sentimentpulse.db "SELECT period_year, period_month FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') AND (executive_summary LIKE '%horror%' OR executive_summary LIKE '%free to play%' OR executive_summary LIKE '%F2P%' OR executive_summary LIKE '%suspense%') ORDER BY period_year DESC, period_month DESC;"

            echo ""
            echo "── Deleting ──"
            sqlite3 sentimentpulse.db "DELETE FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') AND (executive_summary LIKE '%horror%' OR executive_summary LIKE '%free to play%' OR executive_summary LIKE '%F2P%' OR executive_summary LIKE '%suspense%');"
            echo "Done."

            echo ""
            echo "── After delete: poisoned rows (should be empty) ──"
            sqlite3 sentimentpulse.db "SELECT period_year, period_month FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') AND (executive_summary LIKE '%horror%' OR executive_summary LIKE '%free to play%' OR executive_summary LIKE '%F2P%' OR executive_summary LIKE '%suspense%');"

            echo ""
            echo "── Remaining JW summaries ──"
            sqlite3 sentimentpulse.db "SELECT period_year, period_month FROM monthly_summaries WHERE game_id = (SELECT id FROM games WHERE name='Untitled John Wick Game') ORDER BY period_year DESC, period_month DESC;"
          EOF
