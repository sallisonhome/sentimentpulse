name: One-off SignalPulse log check 2

"on":
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check signalpulse status and recent logs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail

          echo "== systemctl status signalpulse =="
          systemctl status signalpulse --no-pager -n 5 || true

          echo ""
          echo "== journalctl since last restart (errors + all recent) =="
          journalctl -u signalpulse --no-pager -n 300 --since "-30 min" || true

          echo ""
          echo "== nginx error log tail (if present) =="
          tail -n 100 /var/log/nginx/error.log 2>/dev/null || echo "no nginx error log at that path"

          echo ""
          echo "== disk / memory quick check =="
          df -h / || true
          free -h || true
          REMOTEEOF
