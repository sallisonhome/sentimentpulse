name: SP Check Job Status (one-off)

# Fast, single round-trip: mints a JWT and does one GET on a backfill job
# status endpoint, then exits. Called repeatedly (with sleeps between calls
# done outside this workflow) to poll long-running jobs without holding one
# SSH session open and idle for many minutes.

"on":
  workflow_dispatch:
    inputs:
      job_kind:
        description: "wishlist or sales"
        required: true
      job_id:
        description: "job id to check"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check job
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<REMOTEEOF
          set -uo pipefail
          cat > /tmp/check.js <<'JSEOF'
          const fs = require('fs');
          const jwt = require('/opt/sentimentpulse/signalpulse/node_modules/jsonwebtoken');
          const envRaw = fs.readFileSync('/etc/signalpulse/env', 'utf8');
          function readEnvVar(name) {
            const m = envRaw.match(new RegExp('^' + name + '=(.*)\$', 'm'));
            return m ? m[1].trim().replace(/^["']|["']\$/g, '') : null;
          }
          const JWT_SECRET = readEnvVar('SABER_AUTH_JWT_SECRET');
          function mintToken() {
            return jwt.sign(
              { sub: 'onboard-script', email: 'ops@saber.internal', scopes: ['signalpulse'], is_admin: true, jti: 'chk-' + Date.now() },
              JWT_SECRET, { expiresIn: '10m' }
            );
          }
          const kind = '${{ inputs.job_kind }}';
          const jobId = '${{ inputs.job_id }}';
          const path = kind === 'sales' ? '/api/steam/portal-daily-backfill/' + jobId : '/api/steam/backfill/' + jobId;
          fetch('http://localhost:5000' + path, { headers: { 'Authorization': 'Bearer ' + mintToken() } })
            .then(r => r.text())
            .then(t => console.log(t))
            .catch(e => { console.error('FATAL:', e.message); process.exit(1); });
          JSEOF
          node /tmp/check.js
          RC=\$?
          rm -f /tmp/check.js
          exit \$RC
          REMOTEEOF
