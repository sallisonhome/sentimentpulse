name: SP Diag Hitman Follower+Rank Backfill (one-off, read-only)

# 2026-08-24 — Read-only diagnostic: (1) locate the Hitman product row,
# (2) check its current steam_followers_daily / steam_wishlist_rank_daily
# coverage, (3) inspect how recently-added titles (added in the last two
# weeks) got their first follower/rank rows populated, to determine the
# repeatable backfill pattern to replicate for Hitman.
# Deleted immediately after this diagnostic run per cleanup policy.

"on":
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query products + follower/rank coverage
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db

          echo "── Products created in the last 14 days (id, title, steam_app_id, created_at) ──"
          sqlite3 -header -column "$DB" "
            SELECT id, title, steam_app_id, release_date, created_at
            FROM products
            WHERE created_at >= datetime('now', '-14 days')
            ORDER BY created_at ASC;
          "

          echo ""
          echo "── Hitman product row(s) (title match) ──"
          sqlite3 -header -column "$DB" "
            SELECT id, title, steam_app_id, release_date, created_at
            FROM products
            WHERE title LIKE '%Hitman%' OR title LIKE '%HITMAN%';
          "

          echo ""
          echo "── steam_followers_daily row count + range per product created in last 14 days ──"
          sqlite3 -header -column "$DB" "
            SELECT p.id, p.title, COUNT(f.id) AS follower_rows, MIN(f.date) AS first_date, MAX(f.date) AS last_date
            FROM products p
            LEFT JOIN steam_followers_daily f ON f.product_id = p.id
            WHERE p.created_at >= datetime('now', '-14 days')
            GROUP BY p.id
            ORDER BY p.created_at ASC;
          "

          echo ""
          echo "── steam_wishlist_rank_daily row count + range per product created in last 14 days ──"
          sqlite3 -header -column "$DB" "
            SELECT p.id, p.title, COUNT(w.id) AS rank_rows, MIN(w.date) AS first_date, MAX(w.date) AS last_date
            FROM products p
            LEFT JOIN steam_wishlist_rank_daily w ON w.product_id = p.id
            WHERE p.created_at >= datetime('now', '-14 days')
            GROUP BY p.id
            ORDER BY p.created_at ASC;
          "

          echo ""
          echo "── Hitman exact follower + rank values for today ──"
          sqlite3 -header -column "$DB" "
            SELECT p.id, p.title, f.date, f.follower_count, f.daily_delta
            FROM steam_followers_daily f JOIN products p ON p.id = f.product_id
            WHERE p.id = 18
            ORDER BY f.date DESC LIMIT 3;
          "
          sqlite3 -header -column "$DB" "
            SELECT p.id, p.title, w.date, w.rank
            FROM steam_wishlist_rank_daily w JOIN products p ON p.id = w.product_id
            WHERE p.id = 18
            ORDER BY w.date DESC LIMIT 3;
          "
          REMOTEEOF
