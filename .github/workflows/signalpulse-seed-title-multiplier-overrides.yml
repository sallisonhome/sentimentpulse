name: SignalPulse — Seed title multiplier overrides + re-estimate

# One-off dispatchable workflow that:
#   1. Runs scripts/seed-title-multiplier-overrides-2026-09-13.ts to install
#      per-title multiplier override rows (Wardogs Steam, MW4 Steam) from
#      published anchors.
#   2. Reruns scripts/estimate-console-units.ts so window_estimates_daily
#      picks up the new overrides.
#
# The seed script is idempotent (ON CONFLICT UPDATE per
# (title_id, platform, effective_from)), and the estimator has been
# idempotent all along. Safe to re-run.

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false
  queue: max

jobs:
  seed-and-estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preflight
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          [ -n "$WD" ] || { echo "ERR: could not resolve signalpulse WorkingDirectory"; exit 1; }
          echo "Working dir: $WD"
          [ -f "$WD/data.db" ] || { echo "ERR: DB missing"; exit 1; }
          [ -f "$WD/scripts/seed-title-multiplier-overrides-2026-09-13.ts" ] || { echo "ERR: seed script missing — deploy first"; exit 1; }
          [ -f "$WD/scripts/estimate-console-units.ts" ] || { echo "ERR: estimator missing"; exit 1; }
          [ -x "$WD/node_modules/.bin/tsx" ] || { echo "ERR: tsx missing — deploy first"; exit 1; }

          echo ""
          echo "── Pre-run: title_multiplier_overrides state ──"
          sqlite3 -header -column "$WD/data.db" "
            SELECT COUNT(*) AS overrides_total FROM title_multiplier_overrides;
            SELECT title_id, platform, multiplier, confidence, method, effective_from
              FROM title_multiplier_overrides
              ORDER BY platform, title_id, effective_from DESC LIMIT 20;
          " || echo "(table may not exist yet if migrations haven't landed; storage.ts CREATE TABLE IF NOT EXISTS runs on service boot after deploy)"

          echo ""
          echo "── Pre-run: Wardogs Steam d7 row (baseline for comparison) ──"
          curl -sS "http://127.0.0.1:5000/signal/api/console/leaderboards/steam?window=d7&sort=revenue&dir=desc&limit=200" \
            | jq '.rows[] | select(.name | test("wardogs"; "i")) | {name, unitsMid, revenueMidUsd, ratingCount, estimateMethod}' \
            || echo "(no wardogs row found or endpoint unreachable)"
          REMOTE

      - name: Run seed-title-multiplier-overrides
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"

          if [ -f /etc/signalpulse/env ]; then
            set -a
            . /etc/signalpulse/env
            set +a
          fi
          export NODE_ENV="${NODE_ENV:-production}"

          echo "════════════════════════════════════════════════════════"
          echo "  seed-title-multiplier-overrides-2026-09-13.ts"
          echo "════════════════════════════════════════════════════════"
          t0=$(date +%s)
          timeout 120 ./node_modules/.bin/tsx scripts/seed-title-multiplier-overrides-2026-09-13.ts
          rc=$?
          t1=$(date +%s)
          echo ""
          echo "Elapsed: $((t1 - t0))s  exit=$rc"
          exit $rc
          REMOTE

      - name: Rerun estimate-console-units
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)
          cd "$WD"

          if [ -f /etc/signalpulse/env ]; then
            set -a
            . /etc/signalpulse/env
            set +a
          fi
          export NODE_ENV="${NODE_ENV:-production}"

          echo "════════════════════════════════════════════════════════"
          echo "  estimate-console-units.ts (rerun to pick up overrides)"
          echo "════════════════════════════════════════════════════════"
          t0=$(date +%s)
          # Estimator normally runs in <2 minutes for the full title corpus.
          # Give it a generous 10-minute ceiling.
          # Read LTD flag from the systemd drop-in (if present) and pass through
          LTD_ACCUMULATOR_ENABLED=$(systemctl show -p Environment signalpulse | tr ' ' '\n' | grep '^LTD_ACCUMULATOR_ENABLED=' | cut -d= -f2 || echo "")
          echo "LTD_ACCUMULATOR_ENABLED=${LTD_ACCUMULATOR_ENABLED:-<unset>}"
          LTD_ACCUMULATOR_ENABLED="${LTD_ACCUMULATOR_ENABLED}" timeout 600 ./node_modules/.bin/tsx scripts/estimate-console-units.ts
          rc=$?
          t1=$(date +%s)
          echo ""
          echo "Elapsed: $((t1 - t0))s  exit=$rc"
          exit $rc
          REMOTE

      - name: Post-run audit
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTE'
          set -euo pipefail
          WD=$(systemctl show -p WorkingDirectory --value signalpulse)

          echo "── Post-run: title_multiplier_overrides rows ──"
          sqlite3 -header -column "$WD/data.db" "
            SELECT title_id, platform, multiplier, ci_pct, digital_unit_share,
                   confidence, method, effective_from
              FROM title_multiplier_overrides
              ORDER BY platform, title_id, effective_from DESC;
          "

          echo ""
          echo "── Post-run: Wardogs Steam d7 row (should be ~1.25M units / ~\$25-30M) ──"
          curl -sS "http://127.0.0.1:5000/signal/api/console/leaderboards/steam?window=d7&sort=revenue&dir=desc&limit=200" \
            | jq '.rows[] | select(.name | test("wardogs"; "i")) | {name, unitsMid, revenueMidUsd, ratingCount, estimateMethod}' \
            || echo "(no wardogs row found or endpoint unreachable)"

          echo ""
          echo "── Post-run: MW4 should NOT appear on any leaderboard (unreleased filter) ──"
          for endpoint in \
              "leaderboards/steam?window=d7" \
              "leaderboards/ps5?window=d7" \
              "leaderboards/xbox?window=d7" \
              "leaderboards-multiplatform?window=d7&limit=100"; do
            echo "  /$endpoint"
            curl -sS "http://127.0.0.1:5000/signal/api/console/$endpoint" \
              | jq '.rows[] | select(.name | test("Modern Warfare 4"; "i")) | {name, releaseDate, revenueMidUsd}' \
              || echo "    (endpoint unreachable)"
          done
          echo "(expected: empty output above for all four endpoints)"
          REMOTE
