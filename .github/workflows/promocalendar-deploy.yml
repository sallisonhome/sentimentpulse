name: Deploy Promo Calendar

# Promo Calendar-only deploy (kickoff: PR, 2026-09-04).
#
# Promo Calendar lives inside the sentimentpulse monorepo at promocalendar/,
# but it's an independent Node app with its own systemd unit
# (promocalendar.service, port 5003). Mirrors the partnerships-deploy.yml
# pattern so a promo-only change doesn't trigger a full sentimentpulse+
# gtmstudio+triptracker+signalpulse rebuild.
#
# Concurrency: shares the 'deploy-droplet' group with deploy.yml,
# signalpulse-deploy.yml, and partnerships-deploy.yml so if multiple
# workflows trigger on the same push, they serialize instead of racing npm
# installs on the shared filesystem.
#
# Required secrets (already configured on the sentimentpulse repo):
#   DROPLET_SSH_KEY — ed25519 private key whose pubkey is in
#                     /root/.ssh/authorized_keys on the droplet.
#
# What's provisioned on-droplet if missing:
#   - /etc/promocalendar/env (mode 600) — reserved for env-based config
#     including PROMO_ADMIN_UPLOADER_EMAILS override if we ever need it.
#   - /etc/systemd/system/promocalendar.service — created by this workflow.
#   - /etc/nginx/snippets/promocalendar-locations.conf — installed on first
#     deploy, then included from the main site's server{} block.

"on":
  push:
    branches: [main]
    paths:
      - 'promocalendar/**'
      - '.github/workflows/promocalendar-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, build, restart promocalendar on droplet
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 "bash -s" <<'REMOTEEOF'
          set -euo pipefail

          REPO_DIR=/opt/sentimentpulse
          APP_DIR="${REPO_DIR}/promocalendar"

          echo "== Preflight =="
          # Tolerant preflight: if promocalendar/ hasn't been merged yet, exit
          # clean instead of failing. Matches the partnerships pattern.
          if [ ! -d "$APP_DIR" ] || [ ! -f "$APP_DIR/package.json" ]; then
            echo "promocalendar/ not yet present on main — nothing to deploy. Exiting clean."
            exit 0
          fi

          echo ""
          echo "== HEAD before pull =="
          cd "$REPO_DIR"
          git log --oneline -1

          echo ""
          echo "== git pull =="
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "HEAD now: $(git log --oneline -1)"

          echo ""
          echo "== npm install (promocalendar) =="
          cd "$APP_DIR"
          npm install --no-audit --no-fund

          echo ""
          echo "== npm test (parser regression) =="
          # 6 tests against the committed real-sheet fixture. If ingest logic
          # regresses, we want to know before restart.
          npm test

          echo ""
          echo "== npm run build =="
          npm run build

          echo ""
          echo "== Cache-bust: touch dist/public/index.html =="
          for html in "${APP_DIR}/dist/public/index.html"; do
            if [ -f "$html" ]; then
              touch "$html" && echo "touched $html"
            else
              echo "skip (missing): $html"
            fi
          done

          echo ""
          echo "== Ensure /etc/promocalendar/env exists =="
          mkdir -p /etc/promocalendar
          if [ ! -f /etc/promocalendar/env ]; then
            cat > /etc/promocalendar/env <<'ENVEOF'
          # Promo Calendar env — populated by promocalendar-deploy.yml.
          # PROMO_ADMIN_UPLOADER_EMAILS: comma-separated allowlist override.
          # Default list is hard-coded in server/auth.ts; only override here
          # to add/remove uploaders WITHOUT a code change + redeploy.
          #
          # Example (uncomment + edit to override):
          # PROMO_ADMIN_UPLOADER_EMAILS=allison@saber3d.com,karch@saber3d.com,cmartin@saber3d.com,aiones@saber3d.com,akrupkin@saber3d.com
          ENVEOF
            chmod 600 /etc/promocalendar/env
            echo "created /etc/promocalendar/env"
          else
            echo "/etc/promocalendar/env already present"
          fi

          echo ""
          echo "== Ensure promocalendar.service unit exists =="
          UNIT=/etc/systemd/system/promocalendar.service
          if [ ! -f "$UNIT" ]; then
            cat > "$UNIT" <<'UNITEOF'
          [Unit]
          Description=Promo Calendar API
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/sentimentpulse/promocalendar
          Environment="NODE_ENV=production"
          Environment="PORT=5003"
          EnvironmentFile=-/etc/promocalendar/env
          ExecStart=/usr/bin/node dist/index.cjs
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNITEOF
            systemctl daemon-reload
            systemctl enable promocalendar
            echo "installed promocalendar.service"
          else
            echo "promocalendar.service already installed"
          fi

          echo ""
          echo "== Restart promocalendar.service =="
          systemctl restart promocalendar
          sleep 3
          if systemctl is-active --quiet promocalendar; then
            echo "promocalendar: active"
          else
            echo "promocalendar: FAILED"
            systemctl status promocalendar --no-pager -n 30 || true
            exit 1
          fi

          echo ""
          echo "== Loopback smoke test =="
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 \
              http://127.0.0.1:5003/api/health || echo "000")
          echo "127.0.0.1:5003/api/health -> ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "ERR: promocalendar not responding 200 on :5003 after restart"
            exit 1
          fi

          echo ""
          echo "-- /api/health response:"
          curl -sS --max-time 5 http://127.0.0.1:5003/api/health || echo "HEALTH ERR"
          echo ""

          echo ""
          echo "== Ensure /promo/ nginx block is installed =="
          # Same mechanism as partnerships-deploy.yml: write a snippet, inject
          # an include{} into the main site's server{} block.
          SITE=""
          for cand in /etc/nginx/sites-available/sentimentpulse /etc/nginx/sites-available/default; do
            [ -f "$cand" ] && SITE="$cand" && break
          done
          if [ -z "$SITE" ]; then
            echo "WARN: no nginx site file found; skipping /promo/ install"
          else
            mkdir -p /etc/nginx/snippets
            cat > /etc/nginx/snippets/promocalendar-locations.conf <<'NGXEOF'
          # Managed by promocalendar-deploy.yml — include from the main site.
          # Use ^~ so this exact-prefix beats the regex `.js|.css` cache rules
          # from other conf.d snippets, and use `alias` for the path rewrite.
          location ^~ /promo/assets/ {
              alias /opt/sentimentpulse/promocalendar/dist/public/assets/;
              expires 1y;
              add_header Cache-Control "public, max-age=31536000, immutable";
              try_files $uri =404;
          }
          # Uploads can be up to 20 MB (xlsx files) — override the default
          # 1 MB body-size limit for this location prefix only.
          location /promo/api/ {
              client_max_body_size 25M;
              proxy_pass http://127.0.0.1:5003/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              # saber-auth wrapper sets this — pass through so requireUploader()
              # in server/auth.ts can gate mutations by identity.
              proxy_set_header X-Saber-User $http_x_saber_user;
              proxy_read_timeout 300s;
          }
          location /promo/ {
              alias /opt/sentimentpulse/promocalendar/dist/public/;
              index index.html;
              try_files $uri $uri/ /promo/index.html;
              add_header Cache-Control "no-cache, must-revalidate";
          }
          NGXEOF
            echo "wrote /etc/nginx/snippets/promocalendar-locations.conf"
            if grep -q "snippets/promocalendar-locations.conf" "$SITE"; then
              echo "include already present in $SITE"
            else
              awk -v inc='    include snippets/promocalendar-locations.conf;' '
                { lines[NR] = $0 }
                END {
                  last = 0
                  for (i = 1; i <= NR; i++) if (lines[i] ~ /^[[:space:]]*}[[:space:]]*$/) last = i
                  for (i = 1; i <= NR; i++) {
                    if (i == last) print inc
                    print lines[i]
                  }
                }
              ' "$SITE" > "$SITE.new" && mv "$SITE.new" "$SITE"
              echo "injected include into $SITE"
            fi
          fi

          echo ""
          echo "== Reload nginx =="
          if nginx -t 2>&1 | tail -5; then
            systemctl reload nginx
            echo "nginx reloaded"
          else
            echo "WARN: nginx -t failed; leaving current config running"
          fi

          echo ""
          echo "== External smoke test via nginx =="
          EXT=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 \
              -H "Host: 104.236.239.46" \
              http://127.0.0.1/promo/api/health || echo "000")
          echo "nginx -> /promo/api/health -> ${EXT}"
          if [ "$EXT" != "200" ]; then
            echo "WARN: nginx did not return 200 for /promo/api/health — check /etc/nginx/sites-available/sentimentpulse has the /promo/ block."
          fi

          echo ""
          echo "== DONE =="
          REMOTEEOF
