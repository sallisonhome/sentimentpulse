name: SP PLS Lookup All Products (one-off, read-only)

"on":
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 104.236.239.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query all products and their milestones (JSON)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@104.236.239.46 bash -s <<'REMOTEEOF'
          set -uo pipefail
          DB=/opt/sentimentpulse/signalpulse/data.db
          echo "===JSON_PRODUCTS_START==="
          sqlite3 -json "$DB" "
            SELECT id, title, steam_app_id, is_saber_published, release_date
            FROM products
            WHERE steam_app_id IS NOT NULL
            ORDER BY id;
          "
          echo "===JSON_PRODUCTS_END==="
          echo "===JSON_MILESTONES_START==="
          sqlite3 -json "$DB" "
            SELECT p.id AS pid, p.title AS ptitle, m.id, m.category, m.name, m.target_date, m.actual_date, m.is_default, m.sort_order
            FROM pls_milestones m
            JOIN products p ON p.id = m.product_id
            WHERE m.deleted_at IS NULL
            ORDER BY p.id, m.sort_order;
          "
          echo "===JSON_MILESTONES_END==="
          REMOTEEOF
