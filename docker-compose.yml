version: '3.9'

services:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgres

  # Same backend, but using SQLite (default — no postgres dependency)
  backend-sqlite:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000

  # ── PostgreSQL (optional — activate with --profile postgres) ─────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentimentpulse
      POSTGRES_USER: sentimentpulse
      POSTGRES_PASSWORD: sentimentpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentimentpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  sqlite_data:
  postgres_data:
