<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saber Intelligence Suite — What's New</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #141720;
      --surface-hover: #1c2030;
      --border: #232838;
      --border-hover: #6366f1;
      --text: #e8e9ed;
      --text-muted: #7a7f96;
      --text-dim: #545872;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.08);
      --badge-new: #22c55e;
      --badge-improved: #6366f1;
      --badge-fixed: #f59e0b;
      --badge-other: #7a7f96;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f8f5;
        --surface: #ffffff;
        --surface-hover: #f0f0eb;
        --border: #e0e0d8;
        --border-hover: #6366f1;
        --text: #1a1a1a;
        --text-muted: #5c5c5c;
        --text-dim: #8a8a80;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
      min-height: 100vh;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    .breadcrumb {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
    .breadcrumb a {
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .breadcrumb a:hover { color: var(--primary); border-bottom-color: var(--primary); }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .date-group { margin-bottom: 2.75rem; }
    .date-heading {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.125rem 1.25rem;
      margin-bottom: 0.75rem;
      transition: border-color .15s;
    }
    .entry:hover { border-color: var(--border-hover); }

    .badge {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 0.6rem;
      color: #fff;
    }
    .badge-new      { background: var(--badge-new); }
    .badge-improved { background: var(--badge-improved); }
    .badge-fixed    { background: var(--badge-fixed); }
    .badge-other    { background: var(--badge-other); }

    .entry-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
      line-height: 1.4;
    }
    .entry-body {
      color: var(--text-muted);
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    .entry-body p + p { margin-top: 0.6rem; }
    .entry-body a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .entry-body a:hover { border-bottom-color: var(--primary); }

    .per-app-links {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 2.5rem;
      font-size: 0.875rem;
    }
    .per-app-links strong {
      display: block;
      color: var(--text);
      margin-bottom: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .per-app-links a {
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      margin-right: 0.85rem;
      transition: color .15s, border-color .15s;
    }
    .per-app-links a:hover { color: var(--primary); border-bottom-color: var(--primary); }

    .loading, .error {
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .error { color: var(--badge-fixed); }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="/">Saber Intelligence Suite</a>
      <span>&nbsp;›&nbsp;</span>
      <span>What's New</span>
    </div>
    <h1>What's New</h1>
    <p class="subtitle">A running suite-wide log of what shipped across every app.</p>

    <div class="per-app-links">
      <strong>Per-app changelogs</strong>
      <a href="/sentiment/changelog">SentimentPulse</a>
      <a href="/signal/changelog.html">SignalPulse</a>
      <a href="/trips/changelog.html">Trip Tracker</a>
      <a href="/gtm/changelog.html">GTM Studio</a>
      <a href="/genrepulse/changelog.html">Genre Pulse</a>
      <a href="/partnerships/changelog.html">Publishing Partnerships</a>
    </div>

    <div id="changelog-root" class="loading">Loading changelog…</div>
  </div>

  <script>
    // ---------------------------------------------------------------------
    // Parses the same CHANGELOG.md format used across the suite:
    //
    //   ## <Date>
    //   - <Kind>
    //     ### <Title>
    //     <Body paragraph, one or more lines>
    //   ## <Next Date>
    //
    // Kinds: New, Improved, Fixed. Anything else -> "Other".
    // ---------------------------------------------------------------------

    function parseChangelog(src) {
      const lines = src.split(/\r?\n/);
      const groups = [];
      let currentGroup = null;
      let currentEntry = null;
      let bodyBuffer = [];

      const flushBody = () => {
        if (currentEntry && bodyBuffer.length) {
          currentEntry.body = bodyBuffer.join('\n').trim();
          bodyBuffer = [];
        }
      };
      const flushEntry = () => {
        flushBody();
        if (currentEntry && currentGroup) currentGroup.entries.push(currentEntry);
        currentEntry = null;
        bodyBuffer = [];
      };
      const flushGroup = () => {
        flushEntry();
        if (currentGroup) groups.push(currentGroup);
        currentGroup = null;
      };

      for (const raw of lines) {
        const line = raw.trim();
        const dateMatch = /^##\s+(?!#)(.+?)\s*$/.exec(line);
        if (dateMatch) {
          flushGroup();
          currentGroup = { date: dateMatch[1], entries: [] };
          continue;
        }
        const kindMatch = /^-\s+(New|Improved|Fixed|Other)\s*$/.exec(line);
        if (kindMatch && currentGroup) {
          flushEntry();
          const k = kindMatch[1];
          currentEntry = { kind: k, title: '', body: '' };
          continue;
        }
        const titleMatch = /^###\s+(.+?)\s*$/.exec(line);
        if (titleMatch && currentEntry) {
          flushBody();
          currentEntry.title = titleMatch[1];
          continue;
        }
        if (currentEntry && (line.length > 0 || bodyBuffer.length > 0)) {
          bodyBuffer.push(line);
        }
      }
      flushGroup();
      return groups;
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Minimal markdown → HTML for entry bodies:
    //   `code`  →  <code>code</code>
    //   [text](url)  →  <a href="url">text</a>
    // Paragraph breaks on blank lines.
    function renderBody(body) {
      const paragraphs = body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      return paragraphs.map(p => {
        let html = escapeHtml(p);
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(
          /\[([^\]]+)\]\(([^)]+)\)/g,
          (_, text, url) => {
            const safeUrl = url.replace(/"/g, '&quot;');
            return `<a href="${safeUrl}">${text}</a>`;
          }
        );
        return `<p>${html}</p>`;
      }).join('');
    }

    function badgeClass(kind) {
      if (kind === 'New')      return 'badge-new';
      if (kind === 'Improved') return 'badge-improved';
      if (kind === 'Fixed')    return 'badge-fixed';
      return 'badge-other';
    }

    async function loadChangelog() {
      const root = document.getElementById('changelog-root');
      try {
        // SUITE_CHANGELOG.md is served alongside the launcher.
        const resp = await fetch('/SUITE_CHANGELOG.md', { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const src = await resp.text();
        const groups = parseChangelog(src);
        root.classList.remove('loading');

        if (!groups.length) {
          root.className = 'error';
          root.textContent = 'No changelog entries found.';
          return;
        }

        root.innerHTML = groups.map(g => `
          <div class="date-group">
            <div class="date-heading">${escapeHtml(g.date)}</div>
            ${g.entries.map(e => `
              <div class="entry">
                <span class="badge ${badgeClass(e.kind)}">${escapeHtml(e.kind)}</span>
                <div class="entry-title">${escapeHtml(e.title || '(no title)')}</div>
                <div class="entry-body">${renderBody(e.body || '')}</div>
              </div>
            `).join('')}
          </div>
        `).join('');
      } catch (err) {
        root.className = 'error';
        root.textContent = `Could not load changelog: ${err.message}`;
      }
    }

    loadChangelog();
  </script>
</body>
</html>
