[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Prepend sys.path so env.py can import our app modules
prepend_sys_path = .

# Template used to generate new migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for Create Date in migration files
timezone = UTC

version_path_separator = os

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
