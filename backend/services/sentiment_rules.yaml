version: 1
description: §18 Layer 4 — gaming-domain lexicon overlay rules

# Priority system
# ---------------
# Higher priority values win when multiple rules match the same post.
# Rules with equal priority are evaluated in file order (last match wins
# among ties). Default priority is 100 when the field is omitted.
#
# Rule evaluation short-circuits at the FIRST rule with the highest priority
# that fires; however, ALL matching rules are recorded in `applied_rules`
# for audit purposes regardless of which rule actually overrides the result.
#
# Hot-reload
# ----------
# This file is hot-reloadable at runtime. To add a new rule without
# redeploying: edit this file on the droplet and call reload_rules() from
# the sentiment_lexicon module (e.g. via a scheduled task or manual trigger).
# No code changes or service restart required.

rules:
  - id: bug_list_force_negative
    description: Body contains 3+ bug/glitch/broken/crash/exploit/nerf terms → force negative
    priority: 90
    when:
      body_term_count:
        terms:
          - bug
          - bugged
          - glitch
          - broken
          - crash
          - exploit
          - unplayable
          - refund
          - doesn't work
          - doesnt work
          - can't play
          - cant play
          - wont start
          - won't start
          - freeze
          - freezes
          - freezing
          - nerf
          - nerfed
        min: 3
    set:
      label: negative
      score: 0.85
      reason: bug_list_threshold

  - id: rhetorical_break_question
    description: Title is a rhetorical "did X break Y" question with substantive body → force negative
    priority: 95
    when:
      title_matches_any:
        - "(?i)did.*(break|broke|breaks|ruin|ruined)"
        - "(?i)why is.*(broken|bugged|crashing|unplayable)"
        - "(?i)is this.*(a joke|serious|intended)"
      title_ends_with: "?"
      body_min_chars: 80
    set:
      label: negative
      score: 0.80
      reason: rhetorical_negative

  - id: praise_emoji_plus_confirmation
    description: Title has praise emoji AND body contains praise terms → force positive
    priority: 85
    when:
      title_contains_any:
        - "❤️"
        - "🔥"
        - "🙌"
        - "😍"
        - "👌"
        - "👏"
        - "🥇"
      body_contains_any:
        - love
        - perfect
        - amazing
        - best ever
        - "10/10"
        - masterpiece
        - goty
    set:
      label: positive
      score: 0.85
      reason: praise_emoji_confirmation

  - id: sarcastic_thanks_devs
    description: Phrases like "thanks devs" or "great job devs" sandwiched with bug/break content → force negative
    priority: 92
    when:
      text_matches_any:
        - "(?i)(thanks|thank you|great job|nice job)[, !]+(devs?|developers?|saber|studio)"
      text_contains_any:
        - bugged
        - broken
        - unplayable
        - crash
        - refund
        - garbage
    set:
      label: negative
      score: 0.80
      reason: sarcastic_thanks

  - id: refund_signal
    description: '"refund" or "uninstalled" in body → strong negative signal'
    priority: 88
    when:
      body_contains_any:
        - refund
        - refunded
        - uninstalled
        - uninstalling
        - gonna uninstall
        - deleting this game
    set:
      label: negative
      score: 0.85
      reason: refund_or_uninstall

  - id: 10_out_of_10
    description: 10/10 or "best game" pattern → strong positive
    priority: 87
    when:
      text_matches_any:
        - "(?i)\\b10\\s*/\\s*10\\b"
        - "(?i)best (game|fps|shooter) (ever|of the year|i.ve played)"
        - "(?i)goty( contender)?"
    set:
      label: positive
      score: 0.85
      reason: goty_or_10_10

  # ─── Sarcasm and skepticism patterns (2026-08-14) ──────────────────────
  # Added after RoBERTa mis-tagged "Cool of Saber to save me money by making
  # sure I won't buy Turok Origins or Jurassic Park Survival" as positive 0.89.
  # Model reads "cool" + "save" + "buy" as positive markers; misses the sarcasm.

  - id: purchase_refusal
    description: '"won''t buy / not buying / disregard buying / refuse to buy / won''t support" + game reference → force negative'
    priority: 96
    when:
      text_matches_any:
        - "(?i)(won'?t|will not|not gonna|not going to|refuse to|disregard) (buy|buying|purchase|support|pay for)"
        - "(?i)(save|saved) me (money|the money|from buying)"
        - "(?i)(pass on this|skip this one|hard pass)"
        - "(?i)(never|not) (touch|touching|playing) this game"
    set:
      label: negative
      score: 0.82
      reason: purchase_refusal

  - id: excitement_dropped
    description: '"my excitement dropped / less excited / lost interest / hype died" pattern → negative even when "excited" is in the text'
    priority: 94
    when:
      text_matches_any:
        - "(?i)(excitement|hype|interest|hope)([^.!?]{0,60})?(just )?(dropped|died|gone|killed|tanked|died down|plummeted)"
        - "(?i)(less|no longer|not really|way less) excited (about|for)"
        - "(?i)(lost|losing) (interest|hype|faith|hope)"
        - "(?i)(dropped|killed) my (hype|excitement|interest)"
    set:
      label: negative
      score: 0.80
      reason: excitement_dropped

  - id: sarcastic_cool_of
    description: '"Cool of X to Y" sarcastic construction where Y describes negative outcome → negative'
    priority: 93
    when:
      text_matches_any:
        - "(?i)cool of (saber|the devs?|the studio|them) to"
        - "(?i)thanks? (saber|the devs?) for (fucking|ruining|destroying|killing)"
        - "(?i)real classy of (saber|them)"
      text_contains_any:
        - "won't buy"
        - "wont buy"
        - "save me money"
        - "save my money"
        - "disaster"
        - "trainwreck"
        - "ruining"
        - "destroying"
    set:
      label: negative
      score: 0.82
      reason: sarcastic_cool_of

  - id: ai_slop_criticism
    description: '"AI slop / genAI / AI-generated / brags about AI" as post subject → force negative'
    priority: 91
    when:
      text_matches_any:
        - "(?i)ai\\s+slop"
        - "(?i)(ai|chatgpt)[\\-\\s]+(generated|written|writer|slop|garbage|trash)"
        - "(?i)brag(s|ging|ged) about (ai|chatgpt|genai)"
        - "(?i)(replaced|replacing|fired).*(writer|lead writer).*(chatgpt|ai)"
        - "(?i)genai use"
        - "(?i)undisclosed (ai|gen[- ]?ai)"
    set:
      label: negative
      score: 0.85
      reason: ai_slop_criticism

  - id: boycott_signal
    description: '"boycott / never support / part of the problem" → force negative'
    priority: 89
    when:
      text_matches_any:
        - "(?i)boycott(ing|ed)?"
        - "(?i)part of the problem"
        - "(?i)(never|no longer) support(ing)? (saber|this (studio|company|dev))"
        - "(?i)support(ing)? (them|this|saber) is (part of|the) problem"
    set:
      label: negative
      score: 0.82
      reason: boycott_signal

  - id: waste_of_oxygen
    description: 'Extreme personal criticism of company/ceo → force negative'
    priority: 88
    when:
      text_matches_any:
        - "(?i)waste of oxygen"
        - "(?i)what a (piece of shit|asshole|moron|clown|joke)"
        - "(?i)(fuck|screw) (this (company|studio)|saber)"
        - "(?i)fumble(d)? (the|this)"
        - "(?i)(disaster|trainwreck) (of a|in the making)"
    set:
      label: negative
      score: 0.82
      reason: extreme_criticism
