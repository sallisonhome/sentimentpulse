## SentimentPulse Nginx Configuration
## Copy to /etc/nginx/sites-available/sentimentpulse on the droplet.
## Replace YOUR_SERVER_IP with the droplet's public IP.

server {
    listen 80;
    server_name YOUR_SERVER_IP;

    # Frontend — serve the built Vite app
    root /opt/sentimentpulse/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
