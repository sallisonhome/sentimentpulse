## Saber Intelligence Suite — Nginx Configuration
## Serves: saber-auth SSO at /auth/, launcher at /, SentimentPulse at /sentiment/,
## SignalPulse at /signal/, Partnerships at /partnerships/ (via include),
## Trip Tracker at /trips/, GTM Studio at /gtm/, Promo Calendar at /promo/
## (via include).
## Console Leaderboards decommissioned 2026-09-10 -- /console/ removed.
## Replace YOUR_SERVER_IP with the droplet's public IP.
##
## 2026-09-09: all `location ~ ^/X/assets/ { alias ...; }` blocks below were
## rewritten from regex-location to `location ^~ /X/assets/` (plain prefix,
## high-priority match). A regex location combined with `alias` requires a
## capture group or nginx appends the full request URI onto the alias path,
## producing a nonexistent path and a guaranteed 404 -- proven with an
## isolated nginx instance before this fix was written (not theorized).
## The corrected pattern matches the always-working /promo/ include below.
##
## Genre Pulse (/genrepulse/) is a static bundle git-pulled straight into
## /opt/sentimentpulse/genrepulse/ (no build step) that reverse-proxies its
## API calls to https://howmanyareplaying.com/api/. The proxy MUST resolve
## the upstream host at request time via a `set` variable, never as a bare
## `proxy_pass https://howmanyareplaying.com/...` literal -- a literal forces
## nginx to resolve DNS once at startup, and a DNS blip on that hostname
## crashes the ENTIRE vhost (all apps on this droplet, not just Genre Pulse).
## This took the whole suite down for 6 hours on 2026-07-31 -- see
## sp-nginx-fix-resolver.yml for the incident and the original fix.

server {
    listen 80;
    server_name 104.236.239.46;

    # Defer upstream DNS resolution to request time (see Genre Pulse note
    # above) so a DNS blip on howmanyareplaying.com can't crash this vhost.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 50M;

    # ── saber-auth (Saber Suite SSO) ─────────────────────────────────────────
    # Backend is saber-auth.service on :5100 (systemd, always-on). This
    # location block was previously only ever patched directly into the LIVE
    # nginx file (2026-08-13, never committed to git) -- exactly the same
    # mistake as the /promo/ include below. A later live-only edit (2026-09-09)
    # silently dropped it again, taking /auth/login.html and /auth/admin down
    # and, with them, sign-in for the whole suite. Keep this committed.
    location /auth/ {
        proxy_pass http://127.0.0.1:5100/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Launcher (root) ──────────────────────────────────────────────────────
    location = / {
        root /opt/sentimentpulse/launcher;
        index index.html;
    }
    location = /index.html {
        root /opt/sentimentpulse/launcher;
    }
    # Suite-wide What's New page + its markdown source. Both live under
    # /opt/sentimentpulse/launcher/ (SUITE_CHANGELOG.md is copied there
    # by the deploy workflow from repo root).
    location = /changelog.html {
        root /opt/sentimentpulse/launcher;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /SUITE_CHANGELOG.md {
        alias /opt/sentimentpulse/SUITE_CHANGELOG.md;
        default_type text/markdown;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── SentimentPulse (frontend + API) ──────────────────────────────────────
    # Long-lived cache for hashed assets: Vite emits filenames like
    # index-BLi5pu6R.js that change on every deploy, so it's safe to
    # cache them for a year. Prevents unnecessary revalidation traffic.
    location ^~ /sentiment/assets/ {
        alias /opt/sentimentpulse/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /sentiment/ {
        alias /opt/sentimentpulse/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /sentiment/index.html;
        # index.html is unversioned and must always be revalidated so
        # the browser picks up new bundle hashes on the next deploy.
        # Without this, users' browsers can serve a stale index.html
        # for hours after a deploy, which points at a JS bundle that
        # no longer exists (or worse, an older bundle that still
        # exists but is missing new features - exactly what happened
        # with the DTF chart update on 2026-07-27).
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # ── SignalPulse (frontend + API) ─────────────────────────────────────────
    location ^~ /signal/assets/ {
        alias /opt/sentimentpulse/signalpulse/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /signal/ {
        alias /opt/sentimentpulse/signalpulse/dist/public/;
        index index.html;
        try_files $uri $uri/ /signal/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /signal/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Partnerships (frontend + API) ────────────────────────────────────────
    # Location blocks themselves are managed/written by partnerships-deploy.yml
    # into /etc/nginx/snippets/partnerships-locations.conf on the droplet.
    # This include reference must stay committed here -- it was previously
    # only injected into the LIVE file directly (never in git), so a
    # 2026-09-10 nginx-sync run (fixing an unrelated duplicate-location bug)
    # briefly overwrote it and 404'd /partnerships/ in production for a few
    # minutes. Re-added and committed so every sync keeps this route.
    include snippets/partnerships-locations.conf;

    # ── Trip Tracker (frontend + API) ─────────────────────────────────────────
    # Port 5001 confirmed live via `systemctl show triptracker.service` on
    # 2026-09-09 (Environment=PORT=5001) -- not assumed from the code default.
    location ^~ /trips/assets/ {
        alias /opt/sentimentpulse/triptracker/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /trips/ {
        alias /opt/sentimentpulse/triptracker/dist/public/;
        index index.html;
        try_files $uri $uri/ /trips/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /trips/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── GTM Studio (frontend + API) ───────────────────────────────────────────
    # Port 8001 confirmed from the committed gtm/systemd/gtmstudio.service unit
    # file (ExecStart ... --port 8001) -- not assumed.
    location ^~ /gtm/assets/ {
        alias /opt/sentimentpulse/gtm/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /gtm/ {
        alias /opt/sentimentpulse/gtm/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /gtm/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /gtm/api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Genre Pulse (static bundle + reverse-proxy to howmanyareplaying.com) ──
    location /genrepulse/api/ {
        # A variable in proxy_pass (required for the request-time DNS defer
        # above) disables nginx's automatic location-prefix stripping, so an
        # explicit rewrite is required or the full /genrepulse/api/... path
        # is forwarded upstream unchanged and 404s. Verified live against
        # the real howmanyareplaying.com before shipping.
        # `set` MUST come before `rewrite ... break;` -- `break` halts all
        # later rewrite-phase directives in this location, including a
        # `set` written after it, leaving the variable empty. Found live
        # during this session's testing (500 "no host in upstream").
        set $sp_upstream_hmap "howmanyareplaying.com";
        rewrite ^/genrepulse/api/(.*)$ /api/$1 break;
        proxy_pass https://$sp_upstream_hmap$uri$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $sp_upstream_hmap;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /genrepulse/ {
        alias /opt/sentimentpulse/genrepulse/;
        index index.html;
        try_files $uri $uri/ /genrepulse/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Promo Calendar ────────────────────────────────────────────────────────────────
    # Location blocks themselves are managed/written by promocalendar-deploy.yml
    # into /etc/nginx/snippets/promocalendar-locations.conf on the droplet.
    # This include reference must stay committed here -- previously it was
    # only injected into the LIVE file directly (never in git), so every
    # sp-nginx-sync.yml run silently wiped it and broke /promo/.
    include snippets/promocalendar-locations.conf;
}
