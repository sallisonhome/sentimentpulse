## Saber Intelligence Suite — Nginx Configuration
## Serves: launcher at /, SentimentPulse at /sentiment/, SignalPulse at /signal/
## Replace YOUR_SERVER_IP with the droplet's public IP.

server {
    listen 80;
    server_name YOUR_SERVER_IP;

    client_max_body_size 50M;

    # ── Launcher (root) ──────────────────────────────────────────────────────
    location = / {
        root /opt/sentimentpulse/launcher;
        index index.html;
    }
    location = /index.html {
        root /opt/sentimentpulse/launcher;
    }

    # ── SentimentPulse (frontend + API) ──────────────────────────────────────
    location /sentiment/ {
        alias /opt/sentimentpulse/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /sentiment/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # ── SignalPulse (frontend + API) ─────────────────────────────────────────
    location /signal/ {
        alias /opt/sentimentpulse/signalpulse/dist/public/;
        index index.html;
        try_files $uri $uri/ /signal/index.html;
    }

    location /signal/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
